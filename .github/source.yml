commit:
  message: "feat(auth): add anonymous runtime OTP auth, slider CAPTCHA, and rate limits\n\nImplement Slice 3 of prtmax/cosmos#288 on top of Slice 1 (#639) and Slice 2 (#641):\n\n- Add forward-only migration 00196_app_auth_captcha_otp_and_rate_limits.sql, checksum entry, and FK allowlist entries for csm_app_auth_captchas, csm_app_auth_otp_challenges, csm_otp_delivery.auth_challenge_id, and csm_app_auth_rate_limits.\n- Add procedural PNG slider CAPTCHA generation (360x180 background + 48x48 transparent piece, zero targetRatio exposure, 3-attempt / 120s budget, single-use proof token).\n- Add PostgreSQL sorted multi-bucket rate limiter with dual-fingerprint key-rotation support, trusted proxy CIDR resolution (MERCURY_TRUSTED_PROXIES), and shared appusersecurity send limits.\n- Register anonymous Runtime auth endpoints under /api/v1/runtime/apps/{appId}: GET /auth/channels, POST /auth/captcha/challenges, POST /auth/captcha/challenges/{challengeId}/verify, POST /auth/otp/challenges (202 anti-enumeration), POST /session/otp (SMS auto-signup without dummy password), and POST /auth/password/reset (204 revoking all sessions/refresh families).\n- Extend messagingworker runner/reaper and appuserclosure purge for auth OTP challenges and expired CAPTCHA/rate-limit cleanup, and update openapi-baseline/runtime.json."
