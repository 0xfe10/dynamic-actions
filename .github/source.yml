commit:
  message: "feat(messaging): durable async OTP delivery worker and security challenge queue (#641)\n\n* feat(messaging): add durable OTP worker delivery and security queue\n\nImplement Slice 2 of durable async OTP delivery on top of Slice 1 scoped\nmessaging channels and bindings:\n\n- Add forward-only migration 00195_otp_delivery_and_security_queue.sql\n  (reserving 00194) with csm_otp_delivery, secret-key MAC/readiness/invalidation\n  columns on csm_app_verification_challenges, and typed csm_jobs partial indexes.\n- Add versioned OTPKeyRing with HKDF-SHA256 domain-separated subkeys for\n  target/limiter fingerprints, OTP MACs, and AES-256-GCM delivery envelopes\n  bound via AAD to (jobId, challengeId, tenantId, appId, channelVersion).\n- Add bounded typed lease recovery and transaction-capable, lease/attempt-fenced\n  job completion helpers to internal/jobs.\n- Add worker-only internal/messagingworker with Aliyun Dysmsapi 2017-05-25\n  SendSms (ACS3-HMAC-SHA256) and Standard SMTP (implicit TLS / required STARTTLS\n  with egress host allowlist & pinned DNS IPs) adapters, supervised 4-slot\n  runner with graceful SIGTERM drain, 30s periodic reaper, and Prometheus metrics.\n- Migrate signed-in POST /api/v1/runtime/apps/{appId}/users/me/security/challenges\n  onto atomic transactional queueing while preserving the exact HTTP 200 contract,\n  Runtime OpenAPI bytes, and legacy null-mac_key_id verification.\n\n* chore(mercury): restore devicecatalog files from main\n\n* fix(messaging): address PR #641 Round 1 review findings\n\nAddress all 5 findings from Round 1 review:\n\n- Add pre-Send lease/ownership/channel-version fence and bound Send context\n  deadline to min(externalTimeout, remainingLease) in messagingworker.Runner.\n- Gate keyed-MAC issuance behind MERCURY_OTP_ISSUE_KEYED_MAC (default false)\n  for safe mixed-version rollout while verifiers always accept both legacy and\n  keyed-MAC formats; fail fast on partial/misconfigured worker OTP config.\n- Classify temporary pre-DATA SMTP failures (454 STARTTLS, transient DNS lookup\n  errors, TLS handshake network timeouts) as retryable while keeping egress and\n  certificate verification failures permanent.\n- Strictly allowlist provider_reference formats (Aliyun BizId, UUID RequestId,\n  deterministic SMTP Message-ID) so unexpected upstream text is never stored or logged.\n- Clean up linked csm_otp_delivery and parent csm_jobs rows during account\n  closure purge and sweep orphaned messaging.otp_delivery jobs in Reaper.\n\n* test(integration): finalize Round 2 pre-send fence and closure purge checks\n\n* fix(messaging): address PR #641 Round 2 review findings\n\nAddress all 5 findings from Round 2 review:\n\n- Complete verifyPreSendFence in messagingworker.Runner with send_deadline and\n  challenge liveness/invalidation/supersession checks, anchoring absolute lease\n  and send deadlines before DB query execution and bounding Send via\n  context.WithDeadline(ctx, min(externalDeadline, leaseDeadline, sendDeadline)).\n- Enforce verification_ready_at for all async-queued security challenges\n  (including Phase 1 null-mac_key_id rows) while preserving true pre-migration\n  legacy row verification, and gate API async OTP delivery behind explicit\n  MERCURY_OTP_ASYNC_DELIVERY_ENABLED with fail-fast config validation.\n- Call smtp.Client.Hello explicitly before Extension(\"STARTTLS\") so greeting\n  disconnects and timeouts are classified as retryable instead of permanent.\n- Isolate provider_reference validation per adapter source and derive an opaque\n  job-bound hash token (aliyun:<24-hex>) for Aliyun SMS so verbatim upstream\n  text is never stored in DB or written to logs.\n- Lock parent csm_jobs rows in ascending id order (FOR UPDATE OF j) before\n  deleting csm_otp_delivery rows during account closure purge to prevent\n  lock-order deadlocks with worker and reaper transactions.\n\n* fix(messaging): use clock_timestamp and pre-BeginTx anchors for lease fencing\n\nAddress the remaining P1 from Round 3 review on PR #641:\n\n- Use PostgreSQL clock_timestamp() instead of transaction-start now() for lease\n  validity predicates and remaining lease/send_deadline duration queries in\n  jobs.LockOwnedTx/CompleteTx/FailTx/DeadTx/RetryTx and runner.verifyPreSendFence.\n- Capture Go monotonic deadline anchors before BeginTx in runner.preflight and\n  runner.verifyPreSendFence so server BEGIN latency and scheduler pauses can\n  never overstate remaining lease or send_deadline budgets.\n- Add PostgreSQL integration regression tests simulating post-BEGIN delay past\n  lease_expires_at (both direct pg_sleep and delayed BeginTx in Runner.ProcessOne)\n  verifying expired leases are rejected and never invoke the provider."
