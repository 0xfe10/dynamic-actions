commit:
  message: "feat(ar_photo): implement AR domain models, sync merger, save-before-print, and isolate frame scorer (#525)\n\n* feat(ar_photo): add AR print layout, sync merger, save-before-print, and isolate frame scorer\n\n* fix(ar_photo): harden print fencing, idempotent cloud recovery, sync safety, and scorer bounds\n\n* fix(ar_photo): harden print guards, sync reconciliation, and scorer bounds\n\nResolve Round 2 audit findings for Slice 1 (Part of #521):\n- Guard all async save/print checkpoints with target-edit generation so late draft or preview edits never dispatch stale prints or overwrite active state\n- Require exact remote ID preservation on linked updates, reject tombstoned IDs on net-new registrations, and enforce monotonic assetRevision\n- Fingerprint full cloud save payloads before reusing idempotency keys, reconcile uncommitted cloud saves before follow-ups, and retain ambiguous attempts when switching to localOnly\n- Keep linked cloud rows intact on ordinary local save by inserting a distinct localOnly copy\n- Require deletionAuthoritative or point-lookup confirmation before detaching omitted linked items and preserve tombstones, snapshotGeneration, and pendingAttempts across bare syncPending snapshots\n- Clear stale revision asset metadata when remote assetRevision advances or transitions from unknown to known\n- Capture manual-pick and draft-slot epochs before video cleanup, bound FrameScorer input copy sizes, harden JSON numerics and scale-invariant homography checks, expose unmodifiable snapshot/selection views, and add regression tests\n\n* fix(ar_photo): resolve Round 3 media pinning, revision, replay, and merge guards\n\nResolve all 5 Round 3 P1 audit findings for Slice 1 (Part of #521):\n- Pin in-flight candidate/item media paths across writes, uploads, and print dispatch so concurrent draft replacement or discard never deletes active media, and capture target-edit generation before awaiting initial restore\n- Share canonical effectiveRemoteId semantics across cubit and merger for legacy synced rows and reject null or non-positive assetRevision on versioned cloud updates\n- Preserve original baselineAssetRevision on ArPendingCloudAttempt for exact-key replay, correlate attempts across draft and item namespaces via localItemId/videoPath/remoteId, and reconcile ambiguous net-new attempts before minting fresh keys so each item produces strictly one remote row\n- Retain unresolved pendingAttempts during batch syncPending unless a returned synced row explicitly confirms the specific idempotencyKey and full payload\n- Remove cover-hash-only revision reuse across unknown-to-known transitions and retain the established assetRevision floor across unversioned replies to prevent rollback when timestamps are absent\n\n* fix(ar_photo): enforce owner-scoped pins, strong ID correlation, non-mutating recovery, and revision asset guards\n\nResolve all 5 Round 4 P1 audit findings for Slice 1 (Part of #521):\n- Scope in-flight media pins to their originating owner and revision so pin release never evaluates cleanup against another owner's state or while closing\n- Correlate pending attempts strictly by localItemId or effectiveRemoteId (removing videoPath-only matching) and propagate explicit draftId from drafts to materialized items so distinct Save-copies sharing a video path never inherit another item's binding or attempt\n- Remove mutating probe fallbacks that submitted changed payloads under an older idempotencyKey, fail closed when no non-mutating lookup can resolve an ambiguous net-new attempt, and store discovered revisions in resolvedAssetRevision while keeping baselineAssetRevision immutable\n- Include verifiable canonicalVideoIdentity (preferring videoSha256) in save payload fingerprinting and validation, and keep the local pendingAttempts journal authoritative in syncPending by merging unknown gateway entries first and applying confirmed removals last\n- Preserve existing verified versioned asset fields alongside the retained numeric assetRevision when an unversioned reply arrives during ArPhotoSyncMerger.merge\n\n* fix(ar_photo): guard batch uploads, replay revision floor, and video digest binding\n\nResolve all 3 Round 5 P1 audit findings for Slice 1 (Part of #521):\n- Reconcile or exclude unlinked local-only items with unresolved pending attempts before handing snapshots to gateway.syncPending so lost-response -> Local Only -> syncPending cannot create duplicate cloud photos while unrelated eligible items still upload, and prevent unconfirmed mismatching batch rows from overwriting local rows\n- Independently enforce the current persisted assetRevision floor before replacing a row or dispatching print from an exact-key replay so a cached or replayed older revision never overwrites or prints over a newer verified revision\n- Invalidate cached local video and transcode paths in ArPhotoSyncMerger when remote videoSha256 differs from or introduces a digest over local cache, and include transcodedVideoPath in canonicalVideoIdentity so transcode-only inputs remain distinguishable to key and confirmation logic\n\n* fix(ar_photo): isolate single-item gateway save, preserve partial batch rows, and scope video digest invalidation\n\nResolve all 3 Round 6 P1 audit findings for Slice 1 (Part of #521):\n- Isolate _runSaveBeforePrint's gateway.syncPending path to a single-item snapshot for the requested target and upsert only that validated item back into preCloudSnapshot so unrelated blocked rows are never handed to the gateway or mutated\n- Make public syncPending() merge non-destructive for omitted local rows so partial gateway responses preserve existing linked items, their media fields, and their pending attempts across restarts\n- Decouple video-only videoSha256 mismatch invalidation from revisionProvenSame in ArPhotoSyncMerger so sparse equal-revision video digest updates invalidate only video/transcode/duration caches while preserving cover bytes, print layout, reference URL, and local print raster\n\n* fix(ar_photo): preserve verified geometry on sparse equal-revision replies\n\nResolve Round 7 P2-1 audit finding for Slice 1 (Part of #521):\n- Preserve local.aspectRatio and local.isLandscape in ArPhotoSyncMerger._mergeMatched when revisionProvenSame holds, cover is not invalidated, and a sparse remote reply omits printLayout so portrait constructor defaults do not contradict a retained landscape layout\n- Extend the sparse videoSha256 merge regression test with a landscape item (aspectRatio: 4/3, isLandscape: true, landscape printLayout) asserting geometry and print assets survive video cache invalidation"
