commit:
  message: "fix(messaging): address PR #641 Round 2 review findings\n\nAddress all 5 findings from Round 2 review:\n\n- Complete verifyPreSendFence in messagingworker.Runner with send_deadline and\n  challenge liveness/invalidation/supersession checks, anchoring absolute lease\n  and send deadlines before DB query execution and bounding Send via\n  context.WithDeadline(ctx, min(externalDeadline, leaseDeadline, sendDeadline)).\n- Enforce verification_ready_at for all async-queued security challenges\n  (including Phase 1 null-mac_key_id rows) while preserving true pre-migration\n  legacy row verification, and gate API async OTP delivery behind explicit\n  MERCURY_OTP_ASYNC_DELIVERY_ENABLED with fail-fast config validation.\n- Call smtp.Client.Hello explicitly before Extension(\"STARTTLS\") so greeting\n  disconnects and timeouts are classified as retryable instead of permanent.\n- Isolate provider_reference validation per adapter source and derive an opaque\n  job-bound hash token (aliyun:<24-hex>) for Aliyun SMS so verbatim upstream\n  text is never stored in DB or written to logs.\n- Lock parent csm_jobs rows in ascending id order (FOR UPDATE OF j) before\n  deleting csm_otp_delivery rows during account closure purge to prevent\n  lock-order deadlocks with worker and reaper transactions."
