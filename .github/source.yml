commit:
  message: "feat(auth): add anonymous runtime OTP auth, slider CAPTCHA, and rate limits (#648)\n\n* feat(auth): add anonymous runtime OTP auth, slider CAPTCHA, and rate limits\n\nImplement Slice 3 of prtmax/cosmos#288 on top of Slice 1 (#639) and Slice 2 (#641):\n\n- Add forward-only migration 00196_app_auth_captcha_otp_and_rate_limits.sql, checksum entry, and FK allowlist entries for csm_app_auth_captchas, csm_app_auth_otp_challenges, csm_otp_delivery.auth_challenge_id, and csm_app_auth_rate_limits.\n- Add procedural PNG slider CAPTCHA generation (360x180 background + 48x48 transparent piece, zero targetRatio exposure, 3-attempt / 120s budget, single-use proof token).\n- Add PostgreSQL sorted multi-bucket rate limiter with dual-fingerprint key-rotation support, trusted proxy CIDR resolution (MERCURY_TRUSTED_PROXIES), and shared appusersecurity send limits.\n- Register anonymous Runtime auth endpoints under /api/v1/runtime/apps/{appId}: GET /auth/channels, POST /auth/captcha/challenges, POST /auth/captcha/challenges/{challengeId}/verify, POST /auth/otp/challenges (202 anti-enumeration), POST /session/otp (SMS auto-signup without dummy password), and POST /auth/password/reset (204 revoking all sessions/refresh families).\n- Extend messagingworker runner/reaper and appuserclosure purge for auth OTP challenges and expired CAPTCHA/rate-limit cleanup, and update openapi-baseline/runtime.json.\n\n* fix(auth): address PR #648 Round 1 security and concurrency findings\n\nAddress all 7 security and concurrency findings from Round 1 review on prtmax/cosmos#648:\n\n- Serialize password Login and session Refresh with OTP password reset by locking csm_app_users (FOR SHARE) before locking session/credential rows and revalidating credentials and revocation state inside the transaction.\n- Add dedicated MERCURY_OTP_ANONYMOUS_AUTH_ENABLED rollout gate (default false, requiring MERCURY_OTP_ASYNC_DELIVERY_ENABLED) isolating anonymous auth jobs from Slice 2 signed-in OTP delivery during mixed-version deployments.\n- Close anti-enumeration timing and error differences by validating enqueue prerequisites upfront, executing equivalent ID and AEAD sealing work for suppressed sends, and applying a 25ms minimum dispatch latency floor.\n- Enforce one canonical lock order across resend and redemption (sorted rate limits -> CAPTCHA -> sorted contact advisory locks -> csm_app_users -> csm_app_auth_otp_challenges -> credentials/sessions) to eliminate resend/redeem deadlocks.\n- Lock csm_app_users FOR SHARE during OTP eligibility checks to prevent post-closure challenge/delivery creation racing account closure purge.\n- Harden procedural slider CAPTCHA by matching real and decoy notch shading and adding independent per-pixel surface noise between background and piece cutouts.\n- Drop X-Real-IP fallback when no trusted XFF hop is present, sample post-lock clock_timestamp() once after acquiring all sorted rate-limit locks, and add PostgreSQL -race regression tests for all fixes.\n\n* fix(auth): close Round 2 anti-enumeration, captcha decoy, and concurrency test gaps\n\n* fix(auth): align captcha slot x-bounds and frosted interior fill parity\n\n* fix(auth): eliminate partial-mask source correlation across captcha piece and notches\n\n* feat(auth): expose captchaRequired on runtime auth channel capabilities\n\n* chore(orion): pin Orion submodule to 7b2e0760 for OTP auth and slider CAPTCHA\n\n* chore(orion): bump Orion submodule to 8dfdc3c4 for localization test teardown fix"
