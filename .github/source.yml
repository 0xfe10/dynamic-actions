commit:
  message: "fix(rigel): bind ordinary-file checks to the sent target\n\nRelease assemble ignores a top-level authorizedResourceOrigins field so a\nfrozen release does not consume debug-only configuration outside the digest.\nDebug assemble and pinned IDE bootstrap still copy a validated list.\n\nTrusted OSS ordinary-file origins decode %2F once and then require an object\nid plus a 64-digit lowercase digest. Other origins keep literal path\nsegments. A raw target that is not the URI being sent is rejected, including\non each redirect."
