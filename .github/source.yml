commit:
  message: "fix(publishing): preserve actionable Pubox doctor failures (#470)\n\nPubox failed doctor probes use `status: \"fail\"` and `error`, but Mercury decoded only `message`/`detail`. A failed Honor or Xiaomi check therefore displayed preceding successful probe messages while losing the actionable error.\n\nDecode the actual `error` field and prefer failed-probe diagnostics whenever a concrete failure is present. Preserve legacy message/detail fallback and successful/skipped probe behavior. Provider credentials and URL queries remain redacted through the existing client sanitizer, and verbose traces are never decoded or displayed.\n\nValidation:\n- Focused unit tests with `-race`: actual Pubox errors, failure priority, legacy fields, successful/skipped probes, multiple failures, empty errors and URL redaction.\n- Full storepublishing PostgreSQL integration suite with `-race` in a dedicated temporary PostgreSQL container. The new regression checks sanitized failure persistence/readback, unaffected successful siblings and clearing a prior failure after a successful doctor response.\n- Package vet, staticcheck, gofmt and diff checks.\n\nNo schema, provider configuration or platform contract changes. This diagnostic correction is independent of the live-submission acceptance work in #468 and does not establish store publication. Local API/worker rollout requires separate coordination.\n\nRefs #469"
