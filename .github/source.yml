  message: "fix(messaging): use clock_timestamp and pre-BeginTx anchors for lease fencing\n\nAddress the remaining P1 from Round 3 review on PR #641:\n\n- Use PostgreSQL clock_timestamp() instead of transaction-start now() for lease\n  validity predicates and remaining lease/send_deadline duration queries in\n  jobs.LockOwnedTx/CompleteTx/FailTx/DeadTx/RetryTx and runner.verifyPreSendFence.\n- Capture Go monotonic deadline anchors before BeginTx in runner.preflight and\n  runner.verifyPreSendFence so server BEGIN latency and scheduler pauses can\n  never overstate remaining lease or send_deadline budgets.\n- Add PostgreSQL integration regression tests simulating post-BEGIN delay past\n  lease_expires_at (both direct pg_sleep and delayed BeginTx in Runner.ProcessOne)\n  verifying expired leases are rejected and never invoke the provider."
