  message: "feat(platform): configure presigned read URL expiry (#676)\n\n* feat(platform): configure presigned read URL expiry\n\nStore a platform-wide presigned object read and download URL lifetime, editable from Platform General Settings, and use it for later read URL issuance.\n\nCloses #675\n\n* fix(platform): keep presigned read expiry off a busy connection\n\nResolve the platform read TTL through the caller's transaction, close result sets before signing, and stop caching failed lookups or stale invalidations.\n\n* fix(storage): synchronize in-flight read TTL invalidation test\n\nSignal lookup start on a channel so the race detector no longer sees the test and the stub share an unsynchronized counter."
