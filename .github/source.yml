commit:
  message: "fix(auth): scope adoption cancellation, pop invalidation, region wiring, and carrier retry errors\n\n- Add SessionCancellationToken to SessionCubit.authenticate so cancelling a social/carrier adoption aborts only its own generation without disturbing newer unrelated authentications or clearing their sessions.\n- Recognize own terminal SessionState emissions across Bloc broadcast microtasks in SocialLoginCubit._handleSessionChange so adoption failures preserve carrier preview and error state instead of being treated as external transitions.\n- Cancel pending social/carrier auth immediately on route pop (ModalRoute.popped and PopScope) in MellowAuthPage, MellowAuthProvidersPage, and MellowCarrierLoginSheet rather than waiting for post-animation dispose().\n- Wire production loginRegion in buildFeatureScope from explicit loginRegion, APP_REGION, or live LocaleCubit via SocialLoginScopeSync; fail closed on empty regionKeys and validate non-empty, type-matching provider settings.\n- Keep MellowCarrierLoginSheet open on closure-retry adoption failure so the localized failure dialog renders cleanly without a duplicate background toast from MellowAuthPage.\n- Add regression tests for blocked store.write adoption cancellation, reverse route-pop animation cancellation, LocaleCubit default region wiring, empty regionKeys/settings fail-closed checks, and carrier closure-retry adoption failure and success."
