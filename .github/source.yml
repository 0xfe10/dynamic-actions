commit:
  message: "feat(arphoto): add AR photo backend, pgvector recognition pipeline, and Vega settings (#699)\n\n* feat(arphoto): add AR photo backend, pgvector recognition pipeline, and Vega quota settings\n\nImplement the complete AR photo backend, pgvector dual-embedding indexing and\nrecognition pipeline, internal Python algorithm service client boundary, and\nVega admin AR photo configuration surface for #687.\n\n- Schema & Infrastructure:\n  - Add forward-only migration 00208_ar_photos.sql (reserved after #695's 00207)\n    with non-superuser RDS-safe pgvector extension guard, dual vector(256)\n    xfeat_embedding + vector(512) rootsift_embedding columns with HNSW cosine\n    indexes, upload grants, revisions, and OSS cleanup queue.\n  - Update compose.yml and dynamic CI workflows to pgvector/pgvector:pg18.\n  - Extend assetlink (ar_photo module with owner/public runtime private-scope\n    enforcement), storage active-reservation accounting, and integrity checks.\n- Backend & Worker:\n  - Add typed HTTPAlgorithmClient for the live ar_recognition v0.0.156 contract\n    (/healthz, /v1/extract, /v1/match) with bounded in-flight semaphore, circuit\n    breaker, strict request/response validation, and fail-closed degradation when\n    AR_ALGORITHM_BASE_URL is unset.\n  - Add AR photo lifecycle service, two-pass pgvector HNSW + RRF recognition\n    pipeline with homography rescaling, IndexRunner & CleanupRunner workers,\n    authenticated runtime routes (/api/v1/runtime/ar-photos/*), and Huma\n    platform admin routes (/tenants/{tenantId}/apps/{appId}/ar-photo-config).\n- Vega Admin UI:\n  - Add AppARPhotoSettingsPage (quota, HTTPS example/guide links, optimistic\n    locking, read-only RBAC mode, live indexing and pipeline version metrics)\n    with en/zh-CN/zh-TW translations and regenerated platform-api client types.\n\n* fix(arphoto): address PR #699 audit findings across auth, cleanup, geometry, worker, and Vega\n\nResolve all 15 audit findings (7 P1, 8 P2) from the PR #699 pre-merge audit:\n\n- P1-01: Block ModuleARPhoto on Platform asset redirects (ResolvePlatformAccess\n  and ResolvePlatformRedirect fail closed with ErrForbidden) while retaining\n  private runtime-only scope validation at link registration.\n- P1-02: Cap AR photo presigned OSS read URLs to 60s TTL; visibility changes\n  and soft-delete invalidate all new redirects immediately after commit.\n- P1-03: Queue duplicate print_raster upload grants and presign-failure batch\n  leftovers for cleanup, schedule physical deletion >= upload_grant.expires_at,\n  defer cleanup until grant expiry passes, and retain storage quota accounting\n  until confirmed OSS deletion (object_deleted_at IS NOT NULL).\n- P1-04: Preserve the 12 MiB image upload contract; index worker reads up to\n  12 MiB, verifies SHA-256 on original bytes, and downscales/re-encodes images\n  >4 MiB into <=4 MiB JPEG before calling /v1/extract.\n- P1-05: Fail closed with 503 AR_ALGORITHM_UNCONFIGURED on new registrations\n  before consuming grants or degrading existing ready photos, while preserving\n  idempotent replay.\n- P1-06: Compose inv(t_frame_to_image) * h_ref_to_image into h_ref_to_frame\n  alongside preserved ROI geometry (h_ref_to_image), rejecting singular\n  t_frame_to_image matrices.\n- P2-01: Expand integrity checks in storage_references.go to cover AR configs,\n  upload grants, photos, revisions, vectors, cleanup objects, and ar_photo\n  asset links with soft-delete semantics.\n- P2-02: Propagate worker DB bookkeeping errors, reconcile photo status on\n  retry and dead-lettered ar_photo.index jobs, wait for processing goroutine\n  on shutdown/lease loss, and claim cleanup rows with FOR UPDATE SKIP LOCKED\n  plus guarded completion.\n- P2-03: Touch pgvector cast before pg_settings probe in read-only recall tx\n  and sort recall candidates by exact cosine distance prior to RRF fusion.\n- P2-04: Reject explicit 0/0s AR algorithm concurrency and timeout env vars,\n  defaulting only when unset or empty.\n- P2-05: Preserve dirty Vega AR photo drafts and baseline expectedVersion\n  across background query refetches until save or explicit reload.\n- P2-06: Require active owners in recognition recall and purge AR photos,\n  vectors, asset links, and OSS objects on app user account closure.\n- P2-08: Enforce strict extract view-count and match status/winner/confidence\n  validation, filter recall by compatible pipeline_version + vocabulary_version,\n  and validate ROI dimensions unconditionally on all recognition outcomes.\n\n* fix(mercury): harden AR photo grant races, index fencing, and integrity checks\n\nAddress Round 2 review findings on PR #699:\n- R2-P1-01: lock and conditionally consume unexpired pending upload grants\n  before creating asset links in registration; cancel active-link cleanup\n  rows without recording terminal deleted status until confirmed OSS deletion.\n- R2-P2-01: commit partial-presign failure expiry and cleanup enqueue\n  atomically and recover expired unqueued grants in CleanupRunner.\n- R2-P2-02: treat replayed index jobs for already-ready revisions as\n  idempotent no-ops and fence publish/status mutations to active job leases.\n- R2-P2-03: unconditionally assert <=60s AR read presign TTL via object-store spy.\n- R2-P2-04: couple AR photo and vector integrity checks to revision roles and\n  add corrupt-row integrity regression tests.\n- R2-P2-05: verify disabled owners hide previously matched public photos.\n- R2-P2-06: preserve malformed JSON decode failures and reject degenerate\n  homographies before returning matched.\n- R2-P2-07: add cold pgvector GUC, unsorted RRF, and incompatible-version\n  recall exclusion tests.\n\n* fix(mercury): fence AR index leases, atomic cleanup cancel, and scale-invariant homography\n\nAddress Round 3 review findings on PR #699:\n- R3-P1-01: combine active-link check and spurious cleanup cancellation into a\n  single conditional DELETE, reset cleanup attempts=0 on reschedule to\n  invalidate active claims, recover deleted/expired unqueued grants, and add\n  an overlap regression test where soft-delete commits between claim and cancel.\n- R3-P2-01: lock the live csm_jobs row FOR UPDATE with owner, attempts, and\n  unexpired lease inside the same transaction as every indexing, ready, failed,\n  and retry write; add concurrent worker-takeover regression tests.\n- R3-P2-02: add partial-presign failure integration coverage proving the first\n  presigned grant expires and queues atomically when the second presign fails.\n- R3-P2-03: normalize 3x3 homographies by Frobenius norm before evaluating\n  determinant degeneracy so scale-equivalent transforms (1e-4*I, 1e4*I) pass.\n- R3-P2-04: add partial-decode UnmarshalTypeError tests on HTTP 200 ok=true\n  envelopes verifying ErrAlgorithmUnavailable with decode-envelope cause.\n- R3-P2-05: extract production arphoto.InitRecallTx and exercise it directly\n  against a cold pgx connection asserting session-local hnsw.* GUC values.\n\n* fix(mercury): add monotonic cleanup claim generation and 4K-safe homography check\n\nAddress Round 4 review findings on PR #699:\n- R4-P2-01: add never-reset monotonic claim_generation to\n  csm_ar_photo_cleanup_objects (00208_ar_photos.sql + checksum), increment on\n  every claim and ON CONFLICT reschedule while keeping attempts=0 retry reset,\n  fence all cleanup cancel/liveness/defer/delete/retry statements by\n  claim_generation, and add a full Worker 1 -> reschedule -> Worker 2 reclaim\n  takeover integration test.\n- R4-P2-02: replace global Frobenius-norm determinant cutoff with column-\n  equilibrated invert3x3 and normalized coordinate-frame validation\n  (N_dst * H * N_src^-1) so valid 4K-edge small overlays (960x720 -> 3840x2160\n  at s=0.1, tx=3500, ty=1900) and scaled identities (1e-12*I, 1e12*I) pass\n  while zero and rank-deficient matrices fail closed.\n\n* fix(mercury): unify AR cleanup prechecks in one FOR UPDATE tx and document OSS idempotency\n\nAddress Round 5 review finding (R5-P2-01) on PR #699:\n- Collapse cleanup claim-liveness, active-link cancellation, and upload-grant\n  expiry deferral into one FOR UPDATE transaction (precheckCleanupItem)\n  serialized against ON CONFLICT reschedules and concurrent reclaims.\n- Document that DB locks are intentionally released before remote OSS calls:\n  storage.DeleteObject is an explicit at-least-once idempotent operation on\n  permanently unreferenced single-use keys (ErrObjectNotFound = success),\n  while monotonic claim_generation strictly fences all DB transitions.\n- Add WithBeforeDeleteHook and a post-precheck takeover integration test\n  verifying stale post-precheck OSS deletion affects 0 DB rows while the\n  reclaiming worker completes deletion and records object_deleted_at."
