commit:
  message: "feat(mercury): add permanent asset link registry and 307 redirect endpoints (#693)\n\n* feat(mercury): add permanent asset link registry and 307 redirect endpoints\n\nAdd mercury.csm_asset_links (00206_asset_links.sql) with canonical relative object key limits (<= 1,023 physical bytes including enforced_prefix), live owner tuple/resource validation on registration and redirect, immutable owner and revoked-state preservation on Upsert, distinct release_build vs native_app_release download RBAC, post-auth backing-object Stat checks, and symmetric 307 Temporary Redirect endpoints across /api/v1/assets/{publicId}, /api/v1/platform/assets/{publicId}, and /api/v1/runtime/assets/{publicId}.\n\n* fix(mercury): enforce resource scope/object matching, product-image archival, and SQL/Go whitespace parity\n\n- Match asset-bearing owner_resource_id rows against declared (tenant_id, app_id, user_id) scope and (storage_profile_id, object_key) during registration and redirect resolution, including banner_assets, release_build_artifacts (joined to action runs/build specs), native_app_releases, and app_user_avatars\n- Require device_product_images links to reference at least one active device_product via an active version or active tutorial cover so archiving the sole product invalidates redirects\n- Align 00206_asset_links.sql btrim whitespace characters with Go unicode.IsSpace/strings.TrimSpace and enforce UTF-8 validity in ValidCanonicalObjectKey\n- Add Round 2 PostgreSQL integration and Unicode whitespace parity regression tests\n\n* fix(mercury): bind app-logo/ICC object keys and allow standalone tutorial covers\n\n- Require csm_app_logos links to match source_storage_profile_id, source_object_key, and source_storage_deleted_at IS NULL\n- Require csm_color_profiles links to match the canonical verified object key color-profiles/verified/<upload_id>.icc\n- Accept both (video_storage_profile_id, video_object_key) and standalone (cover_storage_profile_id, cover_object_key) pairs on csm_device_tutorials\n- Add registration and redirect regression tests for mismatched app-logo/ICC keys and standalone tutorial covers"
