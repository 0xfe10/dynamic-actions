commit:
  message: "fix(mercury): harden asset link RBAC, owner liveness, upsert, and key bounds\n\nResolve all Round 1 audit findings on permanent asset links:\n- Split ModuleNativeAppRelease (platform.app_releases.download/manage) from ModuleReleaseBuild (platform.releases.read/manage) and exclude metadata-only platform.app_releases.read.\n- Enforce live tenant/app/user/resource ownership at both registration and redirect resolution, plus RevokeByOwnerUser helper and avatar integrity check.\n- Preserve exact owner tuple and revoked status on idempotent Upsert retries; require explicit Reactivate to restore revoked links.\n- Verify backing object existence via Stat after authorization before issuing 307 redirects so deleted objects return 404 instead of 307.\n- Enforce canonical relative object keys (no dot or empty segments) and the 1,023-byte physical key limit including enforced_prefix in SQL, registration, and signing."
