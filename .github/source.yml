commit:
  message: "feat(jigsaw): connect multi-image collage entry and Mercury catalog materials (#434)\n\n* feat(jigsaw): connect multi-image collage entry and Mercury catalog materials\n\nConnects both Mellow Home collage entry keys (collage-card and collage) to /features/IMAGE_PRINT/collage with fail-closed multi-image selection (1-9 photos), native free/fixed/stitch layout modes, validated Mercury slotLayout@1 template application with slotCount checking, shared catalog stickers/borders/text/fonts, layer z-order and slot reordering, and editable Jigsaw 1.0 draft save/reopen while preserving single-image Pixso and cutting flows intact.\n\nRefs #394\n\n* fix(jigsaw): address PR #434 review blockers and add regression tests\n\n- Preserve singImage on photoEdit templates and keep photoEdit template entry distinct from collage tools (including #432 cutout/eraser tools in collage mode)\n- Fix templateScale coordinate scaling in decodeCreativeNativeDocument and live catalog/photo additions so canvas, slot, draft, and export dimensions match when templateScale != 1\n- Fence async history font restoration in JigsawController without moving the cursor before await, discard stale restores on concurrent mutations, and gate toolbar/layers/canvas mutations during in-flight operations\n- Clamp and uniformly scale stitch padding/gaps so 9-photo vertical and horizontal stitch layouts never overflow canvas bounds at large margin\n- Enforce aggregate multi-image collage byte (48 MiB) and pixel (36 MP) budgets across picker, cubit, editor startup/add-photo, sequential initial node decodes, and bounded document history snapshot eviction (64 MiB default)\n- Validate manifest/version font bindings and fail closed on undeclared fontKey or text-border fontId instead of silent fallback\n\n* fix(jigsaw): preserve photoEdit slot geometry and reconcile collage/history budgets\n\n- Gate JigsawController.singLayoutDelegate on singImage && isUseImageSize so inset and rotated photoEdit manifest slots keep their exact authored geometry while preserving singImage template routing\n- Enforce aggregate collage byte (24 MiB) and decoded pixel (36 MP) budgets consistently across initial load, incremental onAddImage, and photo replacement (accounting for the replaced slot delta)\n- Reconcile maximumCollageTotalBytes (24 MiB raw -> ~32 MiB base64 JSON) with defaultMaxDocumentHistoryBytes (72 MiB) and enforce totalBytes <= budget unconditionally in JigsawController history\n\n* fix(home): expect three default tiles when collage is unassembled\n\nCollage requires image print, so the default secondary page keeps three tiles.\nMistake analysis, AI Photo, Remove Handwriting, and Sudoku stay hidden unless\ntheir destinations are assembled.\n\n* fix(jigsaw): count original pixels for cropped collage photos\n\nCropped renders stay in the image cache, so add, replace, and reopened\ndrafts must budget the retained original instead of the downsampled size.\n\n* fix(jigsaw): reject over-budget collage drafts before decoding photos\n\nReopened drafts kept the original bytes and a smaller cropped render.\nMeasure that original content header and fail closed before image init.\n\n* fix(jigsaw): size reopened collage drafts before decoding photos\n\nRead original dimensions from ImageDescriptor headers and reject\nover-budget drafts before any photo init allocates originImage.\n\n* fix(jigsaw): size collage photos from headers without decoding frames\n\nTry the header parser, then ImageDescriptor, and fail closed when neither\ncan read dimensions instead of decoding a full frame.\n\n* test(jigsaw): cover descriptor failure on mixed collage drafts\n\nReopen a valid photo followed by unrecognized bytes and reject the header\nbefore any original image is decoded."
