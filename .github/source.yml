commit:
  message: "fix(rigel): default debug packages to project staging (#318)\n\n* fix(rigel): default debug builds to project staging\n\nEmpty COSMOS_PLATFORM_URL now selects this project's staging platform API.\nDebug specs that use the development host, or a host other than the selected\nnon-loopback platform, fail before Flutter runs. The platform cache key\nincludes the endpoint, so a spec from another host is not reused.\n\nStaging profiles accept remote resources only from the runtime host or the\nOSS CDN. Production release signing and freeze stay unchanged.\n\n* fix(rigel): close staging debug review findings\n\nThe profile IDE startup selects now defaults to project staging, while unpinned\nbootstrap stays offline. Remote images check every redirect hop and keep signed\nquery strings. Cached specs record a platform or offline-spec-file source, and\ndebug builds pass that marker as DEBUG_SPEC_SOURCE. IPv6 loopback is accepted,\nand a debug spec must match the selected platform scheme, port, and runtime path.\n\n* fix(rigel): reject mismatched debug identity before cache reuse\n\nCompare the requested tenant and app with the spec envelope and buildInput\nbefore writing a cache record or starting Flutter. Cache source and spec now\nshare one atomic record, and a pinned IDE assembly carries that source instead\nof logging handwritten-default. Staging resource checks accept only signed\nvirtual-hosted OSS URLs, not every aliyuncs.com host.\n\n* fix(rigel): keep the default IDE assembly formatter-stable\n\nThe check task writes the unpinned assembly before dart format. A blank line\nbetween the export and debugSpecSource keeps that file unchanged.\n\n* fix(rigel): bind staging resource origins and release output\n\nStaging loads must match the runtime origin, including its effective port, or an explicitly configured project origin. Other buckets stay rejected when the storage profile does not name one. Nested buildInput ids must be canonical strings. Release assemble no longer labels a frozen spec as handwritten, and an older IDE assembly still compiles without replacing its pin.\n\n* fix(rigel): wire resource origins and startup source\n\nCopy environment.authorizedResourceOrigins from the trusted build input into the standard assembly. An omitted list authorizes no external host. Direct launch uses a tracked source library, so an old embedded const and a missing sidecar both analyze, and an assembly with no binding proof stays unknown.\n\n* fix(rigel): read debug-spec resource origins\n\nCopy authorizedResourceOrigins from the top-level debug spec into the shared Android, iOS, and IDE assembly. buildInput stays unchanged. An OSS key encoded with %2F is decoded once for the path check, and the original signed URI is what gets sent.\n\n* fix(rigel): run the origin generator with the SDK dart\n\nThe profile test shells out to the Flutter SDK dart. CI does not provide fvm.\n\n* fix(rigel): bind trusted banner, avatar, and feedback objects\n\nThe current session records the exact URI and method from those Mercury\nresponses. Upload grant checks stay in place. A redirect, another method,\nanother object, or a later session does not inherit the grant. Release\npasses an empty DEBUG_SPEC_SOURCE and no longer rewrites the tracked\nlaunch library, so a later debug start still compiles that file.\n\n* fix(rigel): bind ordinary-file checks to the sent target\n\nRelease assemble ignores a top-level authorizedResourceOrigins field so a\nfrozen release does not consume debug-only configuration outside the digest.\nDebug assemble and pinned IDE bootstrap still copy a validated list.\n\nTrusted OSS ordinary-file origins decode %2F once and then require an object\nid plus a 64-digit lowercase digest. Other origins keep literal path\nsegments. A raw target that is not the URI being sent is rejected, including\non each redirect.\n\n* fix(rigel): drop a redundant redirect assertion\n\nFoundation check fails on the unnecessary non-null assertion in the banner\ngrant test.\n\n* fix(rigel): keep object grants on the session that requested them\n\nRegister historical ticket GETs from trusted read and update responses.\nRecord avatar and feedback grants only after header and media checks.\nA captured session epoch rejects a late response after logout, close, or\na switch. A single-object read cannot follow a redirect onto another\ngrant or an ordinary file.\n\n* fix(rigel): reject loose ordinary-file paths and hosts\n\nEmpty path segments and a trailing slash no longer match a canonical object key. OSS ordinary files require one bucket label and one oss-region label. A local receiver records the encoded path and query on the first hop and after a redirect.\n\n* fix(rigel): register object reads as one set\n\nHistorical attachment GETs are recorded only after every descriptor, URL, and originating session epoch is accepted. Banner and avatar call sites select single-object GET, so a target that also matches ordinary policy cannot hop to another ordinary target."
