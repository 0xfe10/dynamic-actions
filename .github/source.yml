commit:
  message: "fix(mellow): resolve Wave 4E closure exit, pending-closure toast, and paper picker i18n (#464)\n\n* fix(mellow): resolve Wave 4E closure exit, pending-closure toast, and paper picker i18n\n\n- Return to guest Personal Center via GoRouter (or root route) after acknowledging account closure confirmation when the session is revoked (#461).\n- Suppress expected HTTP 409 ACCOUNT_PENDING_CLOSURE confirmation challenges from RuntimeApiClient failure reporting and app-shell error notices so only the localized revocation dialog appears (#462).\n- Localize A4-Pocket paper picker, consumable detail, and preview copy across en, zh-CN, and zh-Hant-TW Fluent bundles and fallback maps (#463).\n- Add unit and widget regression tests covering all three fixes, narrow/scaled layout, and semantic theme tokens.\n\n* fix(auth,l10n): scope pending-closure failure suppression and prioritize selected-locale fallbacks\n\n- Replace global 409 ACCOUNT_PENDING_CLOSURE suppression with request-scoped runtimeApiExpectedProblemCodesKey opt-in used only on initial interactive sign-in attempts that present the cancel-closure dialog; repeated 409 failures on revokePendingClosure: true retries still emit failure reports and surface both the runtime error notice and auth feedback (#462).\n- Reorder FluentLocalizer resolution so selected-locale remote, bundled, and packaged fallbacks take precedence over reference fallbackLocale bundles, preventing shipped builds with older or English-ahead packs from leaking English paper-picker strings under zh-CN (#463).\n- Add unit and widget regression tests for retry 409 error reporting and shipped-pack locale precedence.\n\n* fix(auth): require exact HTTP 409 conflict status for pending-closure suppression and dialog\n\n- Key request-scoped failure-report opt-out by exact (statusCode, problemCode) pairs via runtimeApiExpectedProblemsKey ({409: {'ACCOUNT_PENDING_CLOSURE'}}) so non-409 statuses carrying ACCOUNT_PENDING_CLOSURE are never suppressed (#462).\n- Add SessionState.isPendingClosureConflict (RuntimeApiErrorKind.conflict + ACCOUNT_PENDING_CLOSURE) and require it in MellowAuthPage and NativeAuthenticationPage before opening the pending-closure dialog or suppressing initial auth error feedback (#462).\n- Expand failure_report_test.dart to test HTTP 401 + ACCOUNT_PENDING_CLOSURE and HTTP 409 + unrelated conflict code independently on opted-in login requests, and assert both the global runtime error notice and localized auth feedback in mellow_wave4e_ux_bugs_test.dart."
