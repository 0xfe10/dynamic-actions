commit:
  message: "feat(vega): redesign release batch store drawer, popovers, and store settings (#574)\n\n* feat(vega): redesign release batch store drawer, popovers, and store settings\n\nRedesign the Release Batch detail table and App Store Publishing settings workspace for #573:\n\n- Isolate per-row concurrency across build start/retry, finalize/lock, store submission, and artifact downloads so sibling rows and background refetches never block other rows.\n- Thread platform.store_publishing.manage alongside platform.store_publishing.read into batch routes, detail page, row popovers, and store drawer.\n- Replace inline App/tenant store links and raw artifact lists with HoverPopover Store status and Packages (N) pills plus fixed-width right-aligned icon-only row actions.\n- Add a right-side Sheet drawer on Release Batch detail for one-click store submission, audit progress tracking, single-channel resubmit, and returnBatchId Store Settings round-trips.\n- Redesign App Store Publishing settings into a 2-tab Listing Info and Store Channels layout with HelpFieldLabel rules, live counters, visual upload previews, Channel binding Dialog, and legacy #publish/#release-*/#history* deep-link support.\n- Enforce zero raw HTML form/button elements across release-batch and store-publishing modules via AST guard and expand Vitest and Playwright coverage.\n\n* fix(vega): resolve release batch concurrency, readiness, and table action review findings\n\nAddress all 11 review findings on PR #574:\n\n- Keep non-asChild TableAction controls permanently wrapped in an inline-flex span so toggling disabled never detaches retained button DOM nodes while preserving asChild flex-nowrap parent structure and disabled hover tooltips.\n- Reconcile concurrent per-row Start/Retry responses by itemId instead of overwriting the whole batch cache so out-of-order sibling responses never roll back already-started rows.\n- Scope post-submission Sheet tab transitions and pending flags to the submitting item and guard mutation cleanup in try/finally across drawer unmounts.\n- Reconcile selected store channels whenever async listingReadiness blocks previously selected targets, evaluate listing readiness from Pubox catalog listingSpec without hard-coded screenshot minima, and preserve loaded blank listings as incomplete rather than unknown.\n- Keep the row build TableAction slot mounted in place across state changes so w-px Actions column width remains stable, and surface per-artifact pending spinner/aria-disabled feedback on direct-URL downloads.\n- Drop legacy publish/history tabs once returning to Listing Info or Store Channels, enforce an explicit image preview URL scheme allowlist, split store-publishing-i18n and store-publishing tests below 600 lines, guard all touched test TSX files in ui-primitives-guard, and exercise real touch tap in mobile Playwright.\n\n* fix(vega): preserve legacy release drafts, gate drawer readiness, and stream direct downloads\n\n- Keep AppStoreReleaseSelector mounted when switching away from legacy #publish/#history hashes so unsaved release notes survive browser Back while hiding legacy tab triggers on Listing Info and Store Channels\n- Gate drawer store selection and submission until targets, listing, and catalog readiness queries settle, and expose an explicit Retry control on readiness errors\n- Display the channel catalog maxScreenshots limit in store listing readiness failure reasons\n- Stream direct artifact downloads through raw transport fetch and blob completion with origin-scoped credentials instead of a fixed 600ms launch timer\n- Validate root-relative image preview URLs against the application origin via URL parsing to reject backslash-normalized cross-origin escapes\n\n* fix(vega): enforce configured store catalog schemas, fallback CORS downloads, and return absolute preview URLs\n\n- Require catalogQuery.data.configured === true and a matching catalog schema entry per enabled store target in the publish drawer, surfacing Retry when unconfigured and blocking missing-schema targets\n- Fall back to native browser anchor download when cross-origin direct signed artifact streaming fails with a CORS/network TypeError while preserving same-origin network errors\n- Return validated absolute resolved.href from toSafeImagePreviewUrl for root-relative paths instead of stripping the validated origin\n\n* fix(vega): use document origin for direct download CORS fallback\n\n- Keep API-origin comparison (sameApiOrigin) for fetch credentials while checking document origin (sameDocumentOrigin) when deciding whether a fetch TypeError falls back to native anchor navigation\n- Cover third-party storage, split-origin Mercury API, and same-document-origin cases in artifact-download.test.ts"
  authors: ["0xfe10"]
