commit:
  message: "refactor(vega): separate Platform, Tenant, and App Studio workbenches (#522)\n\n* refactor(vega): separate Platform, Tenant, and App Studio workbenches\n\nSeparate Vega into three isolated workbenches (Platform, Tenant, and App Studio) and align minimal Mercury tenant self-service authorization:\n\n- Centralize all public catalog authoring and tenant/app control-plane administration under /platform without cross-workbench links or redirects into /tenants.\n- Add whitelisted Tenant profile self-service (/tenants/$tenantId/profile), read-only Tenant app directory (/tenants/$tenantId/apps), and Tenant per-app resource selection and custom authoring (/tenants/$tenantId/apps/$appId/resources/*) within the Tenant workbench shell.\n- Converge App Studio around app users/roles/permissions, translation overrides, banners, feedback, store publishing, and legal docs, with deterministic direct navigation back to /tenants/$tenantId/apps without relying on browser history.\n- Remove cross-workbench links across navigation, scope rail, developer dock, and store-publishing helpers, and tighten route-level authorization guards against cross-workbench, cross-tenant, and cross-app URL entry.\n- Grant tenant_administrator scoped tenant profile and per-app content permissions in Mercury while redacting and preserving platform-internal profile fields (internalNotes, customAttributes) and enforcing active/published app-region language-pack selection.\n\nRefs #521\n\n* fix(vega,mercury): preserve omitted internal profile fields and isolate workbench scopes\n\n- Preserve omitted internalNotes and customAttributes on PUT /tenants/{tenantId}/profile across all caller identities while retaining explicit platform edits/clears and 403 rejection for non-platform callers\n- Unify /resources/device-products, legacy /studio/device-products redirect, and resource tab visibility on effective appContext permissions\n- Bind TenantProfilePage save mutation variables and cache updates to the submitted tenant ID and isolate form state across tenant navigation\n- Scope TenantAppLanguagePacksPage dialog state, catalog snapshot, and mutation variables/cache updates by tenantId and appId, and fix status badge translation keys\n- Add PostgreSQL HTTP, Vitest router/cache, and real-Mercury Playwright regressions\n\nRefs #521"
