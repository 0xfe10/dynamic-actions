  message: "feat(runtime-api): regenerate Mercury runtime client for AR Photo endpoints (#543)\n\n* feat(runtime-api): regenerate Mercury runtime client for AR Photo endpoints\n\nPart of prtmax/cosmos#687\n\n* fix(runtime-api): redact AR Photo failure reports and harden contract tests\n\nPart of prtmax/cosmos#687\n\n* fix(runtime-api): strip full AR Photo fragments and validate form-data disposition\n\nPart of prtmax/cosmos#687\n\n* fix(runtime-api): guard percent decoding, full fragment strip, and closing boundary\n\nSafely decode percent-encoded AR Photo URI parts without throwing on non-UTF-8 escapes, strip all non-whitespace fragment characters on query-free relative AR Photo excerpts with safe fallback, and enforce strict RFC/Go closing boundary line matching in multipart loopback tests.\n\nPart of prtmax/cosmos#687\n\n* test(runtime-api): require CRLF or EOF on multipart closing boundary\n\nMatch Go mime/multipart.Reader CRLF mode in the loopback multipart test helper by requiring CRLF or EOF after optional horizontal whitespace on the closing delimiter, and add negative mixed-line-ending and positive EOF-padded tests.\n\nPart of prtmax/cosmos#687"
