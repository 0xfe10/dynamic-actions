commit:
  message: "fix(devices): harden Wi-Fi and cloud printer fail-closed invariants\n\nAddress all 6 review findings on PR #431:\n- Require explicit matching tenantId, appId, viewerId, and non-null role\n  on CloudPrinterDirectory and CloudPrinter records; never default missing\n  role to owner or stamp missing scope metadata onto accepted replies.\n- Sequence per-printer and directory mutations in CloudPrinterCubit so\n  stale refreshes or out-of-order mutations cannot resurrect unbound\n  printers or overwrite newer commits.\n- Correlate exact printer ID and command kind on cloud reads, mutations,\n  and receipts, and require authoritative offline printer status on\n  disconnect acknowledgements instead of fabricating offline state locally.\n- Guard cloud share-code, firmware-status, and calibration dialogs with\n  both opening scope and CloudPrinterCubit generation so sign-out or\n  account switches dismiss open dialogs immediately.\n- Add WifiCancellationToken to WifiPrinterGateway and wire cubit cancel,\n  scope change, close, and retry paths to interrupt active native\n  operations and prevent overlapping provisioning or connection writes.\n- Require exact target printer ID on Wi-Fi connect replies and explicit\n  acknowledgement plus request correlation on WifiProvisioningResult.\n- Add targeted unit and widget regression tests covering all 6 findings.\n\nRefs #397\nRefs #398"
