commit:
  message: "fix(auth): tighten social/carrier gating and async cancellation races\n\nAddress independent review findings on social-provider and carrier quick-login:\n- Fail closed on unconfigured catalogs and gate loaded visibility/invocation strictly on applicable region, non-null configuration, and host support while keeping Email sign-in available.\n- Pass active login region through SocialLoginCubit/buildFeatureScope and enforce regionKeys policy client-side as defense-in-depth.\n- Invalidate in-flight social and carrier attempts on Skip/route exit and external session/account changes all the way through session adoption.\n- Reserve a shared single-flight slot before awaiting catalog loads so concurrent callers cannot overlap exchanges.\n- Require a valid carrier preview and configuration in both SocialLoginCubit and carrier_login_sheet before enabling or invoking submission.\n- Inspect explicit pending-closure retry outcomes in Mellow social and carrier flows so failed retries surface localized errors instead of closing silently or mistaking an unrelated session.\n\nRefs #371"
