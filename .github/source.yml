commit:
  message: "fix(vega): resolve release batch concurrency, readiness, and table action review findings\n\nAddress all 11 review findings on PR #574:\n\n- Keep non-asChild TableAction controls permanently wrapped in an inline-flex span so toggling disabled never detaches retained button DOM nodes while preserving asChild flex-nowrap parent structure and disabled hover tooltips.\n- Reconcile concurrent per-row Start/Retry responses by itemId instead of overwriting the whole batch cache so out-of-order sibling responses never roll back already-started rows.\n- Scope post-submission Sheet tab transitions and pending flags to the submitting item and guard mutation cleanup in try/finally across drawer unmounts.\n- Reconcile selected store channels whenever async listingReadiness blocks previously selected targets, evaluate listing readiness from Pubox catalog listingSpec without hard-coded screenshot minima, and preserve loaded blank listings as incomplete rather than unknown.\n- Keep the row build TableAction slot mounted in place across state changes so w-px Actions column width remains stable, and surface per-artifact pending spinner/aria-disabled feedback on direct-URL downloads.\n- Drop legacy publish/history tabs once returning to Listing Info or Store Channels, enforce an explicit image preview URL scheme allowlist, split store-publishing-i18n and store-publishing tests below 600 lines, guard all touched test TSX files in ui-primitives-guard, and exercise real touch tap in mobile Playwright."
