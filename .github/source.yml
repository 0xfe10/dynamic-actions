commit:
  message: "fix(rigel): honor RUNTIME_APP_BINDING in unpinned offline staging bootstrap (#454)\n\n* fix(rigel): honor runtime app binding in unpinned bootstrap\n\nWave 4C offline vividprint staging builds export the handwritten development\nbootstrap when assemble cannot replace the gitignored generated assembly.\nThose builds already pass RUNTIME_APP_BINDING and RUNTIME_BASE_URL via\nflutter --dart-define, but developmentProfile still defaulted to\norion-foundation. Requests then hit /apps/orion-foundation/* and return\nNot Found while staging vividprint endpoints return 200.\n\nAdd a small resolver for assembly dart-defines, regression tests, and a\nlive staging check tying orion-foundation 404s to the Wave 4C symptoms.\n\nRefs #449, #450, #451\n\n* fix(rigel): address review on unpinned runtime define handling\n\nTrim RUNTIME_APP_BINDING and ORION_DEV_APP_ID, validate trimmed runtime\nURLs before AppProfile, and document RUNTIME_* precedence over ORION_DEV_*.\nRemove live staging HTTP unit tests; add offline assembly call-path coverage.\n\nRefs #449, #450, #451\n\n* chore(rigel): dart format after review fixes\n\n* test(rigel): assert unpinned assembly RUNTIME define wiring offline\n\nExport resolveUnpinnedAssemblyDevelopmentProfile with shared define constants\nand add source-level wiring tests so CI fails if development_assembly bypasses\nRUNTIME_APP_BINDING. Remove no-op dart-define early returns.\n\nRefs #449, #450, #451\n\n* style(rigel): satisfy prefer_interpolation_to_compose_strings in wiring test"
