commit:
  message: "fix(editor_color_jigsaw): add missing jigsaw Fluent keys and fix graffiti clear pill contrast (#467)\n\n* fix(editor_color_jigsaw): add missing jigsaw Fluent keys and fix graffiti clear pill contrast\n\n- Add all 13 image-print-jigsaw-* LocaleKeys, packaged fallback translations across en/zh-CN/zh-Hant-TW, FluentLocalizer.tryTranslate, EditorLocalization LocaleKeys mapping + null fallback, and updated fixture .ftl bundles + manifest.json SHA-256 digests (#465).\n- Replace the transparent outlined Clear/Reset pill in GraffitiPage with the opaque semantic pillDecoration (colors.surface) and semantic foreground colors (colors.textDisabled / colors.textPrimary) so both disabled and enabled states stay clearly legible on the dark canvas (#466).\n- Add regression unit and widget tests in editor_jigsaw_messages_test.dart and wave4f_collage_graffiti_ux_test.dart covering all 13 jigsaw keys, collage bottom bar rendering, Graffiti clear pill contrast, and 320px/1.6x layout.\n\n* fix(editor_color_jigsaw,l10n): make graffiti clear pill opaque and preserve packaged fallback locales\n\n- Give GraffitiPage Key('graffiti-clear-pill') a solid opaque semantic surface fill (gradient: null, border: colors.border) with colors.textTertiary (disabled) and colors.textPrimary (enabled) foregrounds so both states have legible contrast over the dark canvas (#466).\n- Add FluentLocalizer.supportsPackagedFallback and preserve saved/selected packaged-fallback locales in LocaleCubit.select and LocaleCubit._apply when remote/bundled packs omit them (#465).\n- Update Graffiti clear pill tests to assert no translucent gradient and legible contrast across both disabled and enabled states on default and custom palettes, and add LocaleCubit regression tests for remote-English-only + saved zh-CN jigsaw resolution.\n\n* fix(editor_color_jigsaw): force full opacity on graffiti clear pill fill\n\n- Normalize clearPillDecoration fill to colors.surface.withValues(alpha: 1.0) in GraffitiPage so translucent #RRGGBBAA surface tokens cannot let the dark canvas bleed through (#466).\n- Exercise a translucent surface token (Color(0x40FFFFFF)) in wave4f_collage_graffiti_ux_test.dart verifying rendered fill opacity is 1.0 and contrast meets thresholds across disabled and enabled states."
