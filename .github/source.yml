commit:
  message: "feat(messaging): add durable OTP worker delivery and security queue\n\nImplement Slice 2 of durable async OTP delivery on top of Slice 1 scoped\nmessaging channels and bindings:\n\n- Add forward-only migration 00195_otp_delivery_and_security_queue.sql\n  (reserving 00194) with csm_otp_delivery, secret-key MAC/readiness/invalidation\n  columns on csm_app_verification_challenges, and typed csm_jobs partial indexes.\n- Add versioned OTPKeyRing with HKDF-SHA256 domain-separated subkeys for\n  target/limiter fingerprints, OTP MACs, and AES-256-GCM delivery envelopes\n  bound via AAD to (jobId, challengeId, tenantId, appId, channelVersion).\n- Add bounded typed lease recovery and transaction-capable, lease/attempt-fenced\n  job completion helpers to internal/jobs.\n- Add worker-only internal/messagingworker with Aliyun Dysmsapi 2017-05-25\n  SendSms (ACS3-HMAC-SHA256) and Standard SMTP (implicit TLS / required STARTTLS\n  with egress host allowlist & pinned DNS IPs) adapters, supervised 4-slot\n  runner with graceful SIGTERM drain, 30s periodic reaper, and Prometheus metrics.\n- Migrate signed-in POST /api/v1/runtime/apps/{appId}/users/me/security/challenges\n  onto atomic transactional queueing while preserving the exact HTTP 200 contract,\n  Runtime OpenAPI bytes, and legacy null-mac_key_id verification."
