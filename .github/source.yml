commit:
  message: "feat(vega): converge creative catalog and banners to full-width workspace (#646)\n\n* feat(vega): converge creative catalog and banners to full-width workspace\n\n- Wrap all remaining App control-plane settings pages (creative, banners, help-center, icons, fonts, consumables, social-providers, updates) with AppControlPlaneSubnav\n- Add reusable full-width catalog workspace primitives (CatalogWorkspace, CatalogDomainTabs, CatalogPillFilterGroup, CatalogViewToggle, CatalogToolbar, CatalogTableCard, CatalogMoreActionsMenu) with zero inner left rails\n- Converge Platform and App Creative Catalog onto horizontal domain tabs, toolbar source pills, full-page /new and /edit authoring routes, unified table/cards toggle defaulting to table, locale and advanced filters, clickable platform distribution summary badges, and icon-only row/card actions\n- Converge Platform and App Banners onto shared BannerListWorkspace defaulting to table view with Table/Cards toggle, status pills with counts, platform distribution badge column, and Archive nested under More actions\n\n* fix(vega): address Plan W Slice W1 review findings\n\n- Complete dirty-state detection on CreativeItemCreatePage (kind, payload, metadata, keywords, fonts, invalid JSON)\n- Redirect App Save Draft to source=owned so newly saved drafts remain visible immediately\n- Converge Creative directory filters, table columns, and imported row artwork/metadata across Platform and App views\n- Wire real catalog font bindings and unified form shell/sections across Creative Create and Edit pages\n- Add exact browser titles for Creative/Banner Create & Edit and all App settings entry/sub-routes\n- Wrap direct App Icon, Font, and Banner sub-routes with AppManagementPageLayout/AppControlPlaneSubnav\n- Split Plan W test coverage into creative-catalog-plan-w.test.tsx and expand subnav sub-route tests\n\n* fix(vega): sync template font bindings, align studio catalog columns, and extract app catalog routes\n\n- Enforce bidirectional inline manifest.fonts and fontBindings sync on JSON edit and Save, and lock immutable uploaded manifestAssetId bindings on Edit\n- Lock font binding edits while Manifest JSON is invalid so invalid JSON text and errors are never wiped by remounting\n- Align App All, Library, and Owned table columns (including Updated), resolve imported item category names from library category lookups, and expose the Source filter in Advanced options\n- Extract App Icon, Font, and Banner sub-routes into app-catalog-routes.tsx, reducing router.tsx below origin/main\n- Expand Plan W tests across All/Library/Owned pills and add creative-catalog-font-sync.test.tsx covering JSON sync, invalid JSON lock, and manifestAssetId lock\n\n* fix(vega): derive locked font bindings from uploaded manifests and paginate studio category lookups\n\n- Parse uploaded template manifest JSON files client-side on both Create and Edit to auto-sync fontBindings while keeping manual font-binding controls locked\n- Paginate all upstream library category and membership cursor pages via allCreativeLibraryQuery without 20-category or 100-item truncation caps\n- Extract Plan W creative catalog editor i18n keys into creative-catalog-editor-extra-i18n.ts so creative-catalog-en-i18n.ts stays under 800 lines\n- Add regression tests for newly uploaded manifest files on Create & Edit and >20 paginated categories/memberships\n\n* fix(vega): strictly preflight-validate uploaded manifests and persist coherent bindings on Edit\n\n- Enforce Mercury closed manifest keys and explicit fallback:\"systemSans\" font entries on uploaded manifest JSON files in manifest-font-sync.ts (rejecting wrapped {\"manifest\":...} payloads and normalized shortcuts)\n- Track async manifest File.text() parsing state to disable Save on Create while in flight and re-validate/derive fontBindings inside save.mutationFn before staging\n- Preflight-validate manifest JSON files before upload-intent creation on Edit and immediately persist derived fontBindings alongside finalized manifestAssetId without overwriting unsaved form edits\n- Add regression tests in creative-catalog-font-sync.test.tsx covering delayed File.text(), invalid manifest preflight rejection, strict parser/wrapper/fallback checks, and immediate Edit coherence\n\n* fix(vega): commit Edit manifest replacement and derived bindings atomically\n\n- Replace standalone manifest finalize + separate draft PUT on Edit with Mercury atomic stage + existing-item commit via replaceItemManifestAtomically\n- Propagate commit errors (missing/inactive font 404, revision conflict 409, network errors) cleanly to RoleUploadSlot so success toasts and state updates never fire on failed commits\n- Preserve unsaved local form edits during atomic manifest replacement using persisted draft fields + expectedRevision\n- Add regression test for atomic Edit commit rejection (404 / 409) and reload coherence in creative-catalog-font-sync.test.tsx"
