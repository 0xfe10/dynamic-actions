commit:
  message: "feat(devices): define and wire fail-closed Wi-Fi and cloud printer boundaries (#431)\n\n* feat(devices): wire fail-closed Wi-Fi and cloud printer boundaries\n\nDefine typed Wi-Fi discovery/provisioning contracts (WifiPrinterGateway,\nWifiProvisioningRequest, WifiPrinterCubit) and cloud-printer ownership,\ndirectory, and command contracts (CloudPrinterScope, CloudPrinterRole,\nCloudPrinterGateway, CloudPrinterCubit) in device_management.\n\nWire both gateways fail-closed by default through buildFeatureScope in\nrigel_platform with App/account scope fencing and live snapshot projection,\nconnect Mellow Wi-Fi and cloud printer screens plus cloud QR binding to\nthe typed controllers, add comprehensive unit and widget tests, and update\nopenwiki/development/status.md with current boundaries and remaining\nexternal runtime/hardware gates.\n\nRefs #397\nRefs #398\n\n* fix(devices): harden Wi-Fi and cloud printer fail-closed invariants\n\nAddress all 6 review findings on PR #431:\n- Require explicit matching tenantId, appId, viewerId, and non-null role\n  on CloudPrinterDirectory and CloudPrinter records; never default missing\n  role to owner or stamp missing scope metadata onto accepted replies.\n- Sequence per-printer and directory mutations in CloudPrinterCubit so\n  stale refreshes or out-of-order mutations cannot resurrect unbound\n  printers or overwrite newer commits.\n- Correlate exact printer ID and command kind on cloud reads, mutations,\n  and receipts, and require authoritative offline printer status on\n  disconnect acknowledgements instead of fabricating offline state locally.\n- Guard cloud share-code, firmware-status, and calibration dialogs with\n  both opening scope and CloudPrinterCubit generation so sign-out or\n  account switches dismiss open dialogs immediately.\n- Add WifiCancellationToken to WifiPrinterGateway and wire cubit cancel,\n  scope change, close, and retry paths to interrupt active native\n  operations and prevent overlapping provisioning or connection writes.\n- Require exact target printer ID on Wi-Fi connect replies and explicit\n  acknowledgement plus request correlation on WifiProvisioningResult.\n- Add targeted unit and widget regression tests covering all 6 findings.\n\nRefs #397\nRefs #398\n\n* fix(device-management): harden cloud read ordering, QR serial matching and Wi-Fi write serialization\n\nAddress remaining review edge cases for #397 and #398:\n- Sequence cloud detail and list reads with monotonic per-printer freshness tracking so older detail or stale list replies cannot overwrite fresher snapshots.\n- Require explicit non-empty matching serials on serial-only cloud QR bind replies instead of accepting null or blank serials.\n- Route Wi-Fi provisioning, connect, and disconnect through one shared serialized write gate with cooperative cancellation and zero cross-operation overlap.\n\nRefs #397\nRefs #398\n\n* fix(device-management): fence stale cloud reads and cancelled Wi-Fi connects\n\nReject a detail read that started before a committed mutation, and merge a\nnewer directory list per printer instead of dropping it when an older detail\nfinishes first. Disconnect a cancelled connect that still comes up, and keep\ncancelProvisioning from retiring a queued connect or disconnect.\n\nRefs #397\nRefs #398\n\n* fix(device-management): fence stale directory lists and orphan Wi-Fi disconnects\n\nAdvance one directory freshness barrier on committed mutations, unbind\ntombstones, and fail-closed authorization clears so an older list cannot\nrepublish over them. Retry a native disconnect when a cancelled connect\nleaves an orphan after cleanup and the queued disconnect both fail.\n\n* fix(device-management): preserve cloud auth denial and distinct Wi-Fi orphans\n\n* fix(device-management): fence scope switches and stale cloud invites"
  authors: ["0xfe10"]
