commit:
  message: "fix(rigel): harden Android nearby Wi-Fi permission upgrade, scan freshness, and SSID decoding\n\n- Request ACCESS_COARSE_LOCATION and ACCESS_FINE_LOCATION together on API 31+ whenever precise location is missing, keep approximate-only grants eligible for upgrade, and derive permanent denial strictly from an explicit fine-location denial response plus rationale state.\n- Serialize and coalesce concurrent requestAccess calls onto a single active Android permission dialog instead of cancelling the waiting caller or invoking requestPermissions twice.\n- Check WifiManager.EXTRA_RESULTS_UPDATED on SCAN_RESULTS_AVAILABLE_ACTION so asynchronous scan failures wait within the remaining deadline or fail with scan_failed rather than returning stale cached results.\n- Preserve exact untrimmed SSIDs and strictly decode API 33+ WifiSsid.getBytes() as UTF-8 with CodingErrorAction.REPORT without falling back to WifiSsid.toString()."
