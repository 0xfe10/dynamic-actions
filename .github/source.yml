commit:
  message: "feat(store-publishing): redesign store listing UX and align Pubox v0.2.11 media slots (#614)\n\n* feat(store-publishing): redesign store listing UX and align Pubox v0.2.11 media slots\n\nRedesign Vega store listing workflows and update Mercury Pubox integration for multi-device media_slots and standalone listing capability discovery (Pubox v0.2.11 compatible with v0.2.10 fallback):\n\n- Reuse App packaging icon as default store icon with explicit override, restore, and lightbox preview (yet-another-react-lightbox).\n- Support multi-device media slots across 14 store catalogs, canonical slot normalization, dimension inspection, same_dimensions validation, and per-slot rules.\n- Replace modal legal link management with persistent 2-card legal status links backed by public legal URL verification and zero SQL migrations.\n- Surface per-store action results in a review/retry modal with bundled_with_release and unsupported_standalone handling and a default-collapsed history bar.\n\n* fix(store-publishing): address PR #614 review findings\n\n- Sync and clear primary-slot mediaSlots on default and override edits so post-pull screenshot edits cannot be shadowed by stale primary media_slot_asset_ids, and initialize non-primary override edits from inherited fallback slots cleanly\n- Make per-store inherit default icon button delete iconUrl/iconPreviewUrl via clearOverrideIcon instead of spreading previous state\n- Gate Retry actions in Store Actions Result Modal on row.retryable !== false while preserving legacy v0.2.10 undefined retryability\n- Resolve App packaging icon bytes via applogo.Service.ReadPackagingIcon when standalone Validate/Push or CreatePublish runs with an empty listing iconUrl\n- Constrain compact slot upload draft text width inside narrow w-28/w-36 gallery cards"
