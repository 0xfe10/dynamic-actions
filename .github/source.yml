commit:
  message: "fix(ar_photo): enforce owner-scoped pins, strong ID correlation, non-mutating recovery, and revision asset guards\n\nResolve all 5 Round 4 P1 audit findings for Slice 1 (Part of #521):\n- Scope in-flight media pins to their originating owner and revision so pin release never evaluates cleanup against another owner's state or while closing\n- Correlate pending attempts strictly by localItemId or effectiveRemoteId (removing videoPath-only matching) and propagate explicit draftId from drafts to materialized items so distinct Save-copies sharing a video path never inherit another item's binding or attempt\n- Remove mutating probe fallbacks that submitted changed payloads under an older idempotencyKey, fail closed when no non-mutating lookup can resolve an ambiguous net-new attempt, and store discovered revisions in resolvedAssetRevision while keeping baselineAssetRevision immutable\n- Include verifiable canonicalVideoIdentity (preferring videoSha256) in save payload fingerprinting and validation, and keep the local pendingAttempts journal authoritative in syncPending by merging unknown gateway entries first and applying confirmed removals last\n- Preserve existing verified versioned asset fields alongside the retained numeric assetRevision when an unversioned reply arrives during ArPhotoSyncMerger.merge"
