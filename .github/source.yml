commit:
  message: "fix(vega): resolve Snowflake IDs before querying scoped platform APIs (#629)\n\nMercury's PlatformResourceResolutionMiddleware rewrites :tenantId and :appId path segments only, while query and JSON body SnowflakeID parameters enforce ^[0-9]{1,19}$. When Vega navigated via tenant/app slug URLs\u2014especially on cold loads where workspace projection lacked tenantAccess or directory queries were still pending\u2014several pages and shared hooks passed raw route slugs to GET /api/platform/v1/regions, GET /api/platform/v1/platform/legal-templates, GET /api/platform/v1/authorization/audit-events, and PUT /api/platform/v1/device-products/{productId}/assignments, resulting in 422 INVALID_REQUEST.\n\nGate Snowflake-scoped queries on validated decimal Snowflake IDs and resolve canonical numeric tenant/app IDs from workspace projection and path-resolved management endpoints across all slug-routed tenant, application, settings, resource, and studio subpages."
  authors: ["0xfe10"]
