  message: "feat(theme): enforce 14-color semantic contract, migrate UI colors, and add orion-ui skill\n\nUpgrade Orion's native theme token contract to the 20-key schema (14 semantic colors + 6 typography/spacing/radius tokens) without legacy alias keys:\n- Replace legacy 10-color tokens with the 14 semantic colors across NativeTheme, NativeColors ThemeExtension, ThemeData.colors / BuildContext.colors, trilingual themeColorDisplayNames, rigel_build validation, and all 74 assembly test fixtures.\n- Migrate shared UI widgets in packages/core/widgets and presentation packages (breeze and mellow) from hardcoded Color/Colors literals to semantic context.colors tokens.\n- Add packages/core/widgets/test/no_hardcoded_ui_colors_test.dart and native_colors_widgets_test.dart to permanently block unapproved hardcoded UI colors in CI.\n- Add .agents/skills/orion-ui/ and link it as mandatory UI guidance in AGENTS.md.\n\nRefs #439"
