name: "[cosmos] Staging"

on:
  push:
    branches:
      - "**"

env:
  DOCKER_REGISTRY: ghcr.io
  DOCKER_REGISTRY_ALI: registry.cn-hongkong.aliyuncs.com
  DOCKER_REGISTRY_ALI_VPC: registry-vpc.cn-hongkong.aliyuncs.com

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    name: Prepare Lanes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ref_name: ${{ steps.source.outputs.ref_name }}
      main: ${{ steps.source.outputs.matches }}
      api: ${{ steps.lanes.outputs.api }}
      admin: ${{ steps.lanes.outputs.admin }}
      android: ${{ steps.lanes.outputs.android }}
    steps:
      - name: Check out workflow metadata
        uses: actions/checkout@v6
      - name: Resolve source branch
        id: source
        uses: repotea-workspace/kangumi/github-actions/dyn-source@main
        with:
          repository: prtmax/cosmos
          branches: main
      - name: Check out Cosmos
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: prtmax/cosmos
          token: ${{ secrets.GH_TOKEN_0XFE10 }}
      - name: Select verification lanes
        id: lanes
        shell: bash
        env:
          IS_MAIN: ${{ steps.source.outputs.matches }}
        run: |
          set -euo pipefail
          api=false
          admin=false
          android=false
          if [ "${IS_MAIN}" = "true" ]; then
            api=true
            admin=true
            android=true
          else
            if ! git rev-parse --verify origin/main >/dev/null 2>&1; then
              git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main || true
            fi
            if changed="$(git diff --name-only origin/main...HEAD 2>/dev/null)" && [ -n "${changed}" ]; then
              while IFS= read -r file; do
                case "${file}" in
                  *.md|openwiki/*|docs/*)
                    ;;
                  lyra/*)
                    admin=true
                    ;;
                  orion)
                    android=true
                    ;;
                  fornax/*|solar/*)
                    api=true
                    admin=true
                    android=true
                    ;;
                  *)
                    api=true
                    admin=true
                    android=true
                    ;;
                esac
              done <<< "${changed}"
            else
              api=true
              admin=true
              android=true
            fi
          fi
          {
            echo "api=${api}"
            echo "admin=${admin}"
            echo "android=${android}"
          } >> "$GITHUB_OUTPUT"

  api:
    name: API Checks
    needs: prepare
    if: needs.prepare.outputs.api == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: cosmos-api-${{ needs.prepare.outputs.ref_name || github.run_id }}
      cancel-in-progress: ${{ needs.prepare.outputs.main != 'true' }}
    env:
      DATABASE_URL: postgres://postgres:ci-postgres-only@127.0.0.1:5432/mercury?sslmode=disable
    services:
      postgres:
        image: postgres:18.1-bookworm
        env:
          POSTGRES_DB: mercury
          POSTGRES_PASSWORD: ci-postgres-only
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mercury"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Check out workflow metadata
        uses: actions/checkout@v6
      - name: Check out Cosmos
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: prtmax/cosmos
          token: ${{ secrets.GH_TOKEN_0XFE10 }}
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
          cache-dependency-path: solar/**/go.sum
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Set up Just
        uses: extractions/setup-just@v3
      - name: Install API dependencies
        run: |
          just --justfile solar/mercury/Justfile bootstrap
          cd tools/openapi-compat && go mod download
      - name: Check native contracts
        run: just --justfile fornax/dalim/Justfile check
      - name: Check API formatting and static analysis
        run: |
          just --justfile solar/mercury/Justfile format-check
          just --justfile solar/mercury/Justfile lint
          just --justfile solar/mercury/Justfile staticcheck
      - name: Run API unit and race tests
        run: just test-go
      - name: Check OpenAPI compatibility
        run: just openapi-compat
      - name: Run migrations and PostgreSQL integration tests
        env:
          MERCURY_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: just migrate && just test-db
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: mercury
          push: false
          cache-from: type=gha,scope=mercury-worker
          cache-to: type=gha,mode=max,scope=mercury-worker
      - name: Build Worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          push: false
          cache-from: type=gha,scope=mercury-worker
          cache-to: type=gha,mode=max,scope=mercury-worker

  admin:
    name: Admin Checks
    needs: prepare
    if: needs.prepare.outputs.admin == 'true'
    runs-on: ubuntu-24.04
    concurrency:
      group: cosmos-admin-${{ needs.prepare.outputs.ref_name || github.run_id }}
      cancel-in-progress: ${{ needs.prepare.outputs.main != 'true' }}
    env:
      DATABASE_URL: postgres://postgres:ci-postgres-only@127.0.0.1:5432/mercury?sslmode=disable
    services:
      postgres:
        image: postgres:18.1-bookworm
        env:
          POSTGRES_DB: mercury
          POSTGRES_PASSWORD: ci-postgres-only
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mercury"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Check out workflow metadata
        uses: actions/checkout@v6
      - name: Check out Cosmos
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: prtmax/cosmos
          token: ${{ secrets.GH_TOKEN_0XFE10 }}
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: '3.13.2'
      - name: Resolve locked Cosmos tools
        run: dart pub get --enforce-lockfile --directory tools/cosmos_build
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
          cache-dependency-path: solar/**/go.sum
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: lyra/package.json
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: lyra/pnpm-lock.yaml
      - name: Set up Just
        uses: extractions/setup-just@v3
      - name: Install admin and test API dependencies
        run: |
          just --justfile lyra/Justfile bootstrap
          just --justfile solar/mercury/Justfile bootstrap
      - name: Check Cosmos Dart tools
        working-directory: tools/cosmos_build
        run: |
          dart format --output=none --set-exit-if-changed .
          dart analyze
          dart test
      - name: Check admin formatting
        run: just --justfile lyra/Justfile format-check
      - name: Lint admin
        run: just --justfile lyra/Justfile lint
      - name: Check admin types
        run: just --justfile lyra/Justfile typecheck
      - name: Run admin unit tests
        run: just --justfile lyra/Justfile test
      - name: Check generated platform API client
        run: just generate-check platform
      - name: Build admin production assets
        run: pnpm --dir lyra build
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('lyra/pnpm-lock.yaml') }}
      - name: Install Playwright Chromium
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm --dir lyra --filter @cosmos/vega exec playwright install-deps chromium
          else
            pnpm --dir lyra --filter @cosmos/vega exec playwright install --with-deps chromium
          fi
      - name: Prepare browser E2E database
        run: docker exec "${{ job.services.postgres.id }}" createdb -U postgres mercury_browser_e2e
      - name: Mercury and Vega browser E2E
        env:
          APP_ENVIRONMENT: Test
          CORS_ALLOWED_ORIGINS: http://127.0.0.1:4173
          DATABASE_URL: postgres://postgres:ci-postgres-only@127.0.0.1:5432/mercury_browser_e2e?sslmode=disable
          MERCURY_BOOTSTRAP_PASSWORD: browser-e2e-password
          MERCURY_E2E_EMAIL: browser-e2e@example.com
          MERCURY_E2E_PASSWORD: browser-e2e-password
          MERCURY_E2E_REAL: "1"
          MERCURY_OBJECT_STORE_DIR: /tmp/mercury-e2e-objects
          MERCURY_OBJECT_STORE_PUBLIC_BASE: http://127.0.0.1:4190
          MERCURY_PROXY_URL: http://127.0.0.1:3000
        run: |
          just migrate
          just --justfile solar/mercury/Justfile bootstrap-admin --email "$MERCURY_E2E_EMAIL" --display-name Browser-E2E --reason browser-e2e-setup --request-id "50000000-0000-4000-8000-000000000001"
          mkdir -p "$MERCURY_OBJECT_STORE_DIR"
          dart run tools/cosmos_build/bin/serve_directory_objects.dart "$MERCURY_OBJECT_STORE_DIR" 4190 >mercury-objects-e2e.log 2>&1 &
          object_pid=$!
          just run-api >mercury-e2e.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true; wait "$api_pid" 2>/dev/null || true; kill "$object_pid" 2>/dev/null || true; wait "$object_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 100); do
            curl --fail --silent http://127.0.0.1:3001/health/ready >/dev/null && break
            kill -0 "$api_pid" 2>/dev/null || { cat mercury-e2e.log; exit 1; }
            sleep 0.1
          done
          curl --fail --silent http://127.0.0.1:3001/health/ready >/dev/null || { cat mercury-e2e.log; exit 1; }
          pnpm --dir lyra --filter @cosmos/vega test:e2e --grep "real Mercury|store publishing reads and writes|listing uploads retain multipart bytes|App legal documents edit saved content|App management keeps real release selection"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Vega image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: vega
          push: false
          build-args: |
            VITE_MERCURY_BASE_URL=https://mercury.invalid
          cache-from: type=gha,scope=vega
          cache-to: type=gha,mode=max,scope=vega

  android:
    name: Android Checks
    needs: prepare
    if: needs.prepare.outputs.android == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: cosmos-android-${{ needs.prepare.outputs.ref_name || github.run_id }}
      cancel-in-progress: ${{ needs.prepare.outputs.main != 'true' }}
    steps:
      - name: Check out workflow metadata
        uses: actions/checkout@v6
      - name: Check out Cosmos
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: prtmax/cosmos
          token: ${{ secrets.GH_TOKEN_0XFE10 }}
          submodules: recursive
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
          cache-dependency-path: solar/**/go.sum
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Read pinned Flutter version
        id: toolchain
        run: python3 -c "import json; print('flutter=' + json.load(open('orion/.fvmrc'))['flutter'])" >> "$GITHUB_OUTPUT"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.toolchain.outputs.flutter }}
          cache: true
      - name: Set up Just
        uses: extractions/setup-just@v3
      - name: Cache Orion Pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: orion-pub-${{ runner.os }}-${{ hashFiles('orion/pubspec.lock', 'orion/tools/rigel_build/pubspec.lock', 'orion/tools/tonik/pubspec.lock') }}
          restore-keys: |
            orion-pub-${{ runner.os }}-
      - name: Cache Android Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: orion-gradle-${{ runner.os }}-${{ hashFiles('orion/apps/rigel/android/**/*.gradle*', 'orion/apps/rigel/android/**/gradle-wrapper.properties', 'orion/pubspec.lock') }}
          restore-keys: |
            orion-gradle-${{ runner.os }}-
      - name: Install Orion dependencies
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_0XFE10 }}
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: credential.https://github.com.helper
          GIT_CONFIG_VALUE_0: "!gh auth git-credential"
        run: |
          cd orion
          flutter --version
          dart pub --directory tools/rigel_build get --enforce-lockfile
          dart run tools/rigel_build/bin/develop.dart bootstrap
      - name: Check Orion formatting and static analysis
        run: |
          cd orion
          dart run tools/rigel_build/bin/develop.dart format-check
          dart run tools/rigel_build/bin/develop.dart analyze
      - name: Run Orion assembly and Flutter tests
        run: |
          cd orion
          dart run tools/rigel_build/bin/develop.dart test
      - name: Resolve locked Cosmos generation tools
        run: dart pub get --enforce-lockfile --directory tools/cosmos_build
      - name: Install runtime API contract dependencies
        run: just --justfile solar/mercury/Justfile bootstrap
      - name: Check generated runtime API client
        run: just generate-check runtime
      - name: Build Android APK
        run: cd orion/apps/rigel && flutter build apk --debug --no-pub

  # iOS Checks are temporarily disabled at the project owner's request.
  # Restore this job and its deployment dependency after fixing printer SDK
