name: '[endfather] Staging'

on:
  push:
    branches:
      - '**'
env:
  DOCKER_REGISTRY: ghcr.io
  DOCKER_REGISTRY_ALI: registry.cn-hongkong.aliyuncs.com
  DOCKER_REGISTRY_ALI_VPC: registry-vpc.cn-hongkong.aliyuncs.com

permissions:
  actions: write
  contents: read
  packages: write

jobs:
  ensure-main:
    name: Ensure main
    runs-on: ubuntu-latest
    outputs:
      ENSURE_MAIN: ${{ steps.ensure_main.outputs.matches }}
    steps:
      - uses: actions/checkout@v6

      - name: Ensure main
        id: ensure_main
        uses: repotea-workspace/kangumi/github-actions/dyn-source@main
        with:
          repository: prtmax/endfather
          branches: main

  build-app-java:
    name: Build app java
    runs-on: ubuntu-latest
    needs:
      - ensure-main
    if: needs.ensure-main.outputs.ENSURE_MAIN == 'true'
    strategy:
      matrix:
        package:
          - babosa
    steps:
      - uses: actions/checkout@v6
      - name: Setup Maven Action
        uses: s4u/setup-maven-action@v1.19.0
        with:
          java-version: 17
          maven-version: 3.9.11
          checkout-enabled: false
      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: prtmax/endfather
          token: '${{ secrets.GH_TOKEN_0XFE10 }}'
          source_context: 'true'

      - name: Build ${{ matrix.package }}
        run: |
          cd ${{ matrix.package }}
          mvn clean package -Dmaven.test.skip=true

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: artifact-java
          path: |
            babosa/launchers/*/target/dist/*.gz
            babosa/tasks/*/target/dist/*.gz

  build-docker-image-babosa:
    name: Build docker image babosa
    runs-on: ubuntu-latest
    needs:
      - build-app-java
    strategy:
      matrix:
        package:
          - LAUNCHER: launchers/analysis
            SLUG: launcher-analysis
          - LAUNCHER: launchers/labelexpert
            SLUG: launcher-labelexpert
          - LAUNCHER: launchers/metaprint
            SLUG: launcher-metaprint
          - LAUNCHER: launchers/universal
            SLUG: launcher-universal
          - LAUNCHER: launchers/woodii
            SLUG: launcher-woodii
          - LAUNCHER: tasks/infra
            SLUG: task-infra
          - LAUNCHER: launchers/webhook
            SLUG: launcher-webhook
    steps:
      - uses: actions/checkout@v6
      - name: Checkout
        id: checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: prtmax/endfather
          token: '${{ secrets.GH_TOKEN_0XFE10 }}'
          source_context: 'true'
          image_name: ${{ matrix.package.SLUG }}
          acr_namespace: xoohub

      - uses: actions/download-artifact@v4
        with:
          name: artifact-java
          path: babosa

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: '0xfe10'
          password: ${{ secrets.GH_TOKEN_0XFE10 }}

      - name: Docker login (Aliyun)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.CR_ALI_USERNAME_PUNCHX }}
          password: ${{ secrets.CR_ALI_PASSWORD_PUNCHX }}
          registry: ${{ env.DOCKER_REGISTRY_ALI }}

      - name: Publish docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          provenance: false
          sbom: false
          context: babosa/${{ matrix.package.LAUNCHER }}
          file: babosa/${{ matrix.package.LAUNCHER }}/docker/Dockerfile
          tags: ${{ steps.checkout.outputs.ghcr_tags }}
          labels: ${{ steps.checkout.outputs.oci_labels }}

      - name: Push to Aliyun ACR (with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 5
          retry_wait_seconds: 30
          command: |
            source_image="${{ steps.checkout.outputs.ghcr_sha_run }}"
            target_image="${{ steps.checkout.outputs.ali_image }}:${source_image##*:}"
            docker tag "$source_image" "$target_image"
            docker push "$target_image"
            docker tag ${{ steps.checkout.outputs.ghcr_sha }} ${{ steps.checkout.outputs.ali_sha }}
            docker tag ${{ steps.checkout.outputs.ghcr_sha }} ${{ steps.checkout.outputs.ali_staging }}
            docker push ${{ steps.checkout.outputs.ali_sha }}
            docker push ${{ steps.checkout.outputs.ali_staging }}

      - uses: repotea-workspace/kangumi/github-actions/tepusher@main
        if: failure()
        with:
          template: .maintain/notify/build-failed-docker-image.md
          token: ${{ secrets.WEPLUSBOT_TOKEN }}
          receiver: '#d8bb7fbacf0849f1bb7fcc89a878a1a0'
          vars: |
            environment: 测试环境
            app: ${{ matrix.package.LAUNCHER }}

  migrate-db:
    name: Migrate database
    runs-on: ubuntu-latest
    needs:
      - build-docker-image-babosa
    strategy:
      matrix:
        project:
          - cornerstone
          - analysis
    steps:
      - uses: actions/checkout@v6
      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: prtmax/endfather
          token: '${{ secrets.GH_TOKEN_0XFE10 }}'
          source_context: 'true'

      - name: Migrate cornerstone
        uses: docker://flyway/flyway:10-alpine
        if: ${{ matrix.project == 'cornerstone' }}
        with:
          args: >
            -url="jdbc:mysql://${{ secrets.BABOSA_DB_CORNERSTONE_HOST_STG }}/babosa_stg?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8"
            -user=${{ secrets.BABOSA_DB_CORNERSTONE_USER_STG }}
            -password=${{ secrets.BABOSA_DB_CORNERSTONE_PASSWORD_STG }}
            -locations=filesystem:./traice/cornerstone/records
            -encoding=UTF-8
            migrate

      - name: Migrate analysis
        uses: docker://flyway/flyway:10-alpine
        if: ${{ matrix.project == 'analysis' }}
        with:
          args: >
            -url="jdbc:mysql://${{ secrets.BABOSA_DB_ANALYSIS_HOST_STG }}/analysis_stg?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8"
            -user=${{ secrets.BABOSA_DB_ANALYSIS_USER_STG }}
            -password=${{ secrets.BABOSA_DB_ANALYSIS_PASSWORD_STG }}
            -locations=filesystem:./traice/analysis/records
            -encoding=UTF-8
            migrate

      - uses: repotea-workspace/kangumi/github-actions/tepusher@main
        if: failure()
        with:
          template: .maintain/notify/migrate-failed.md
          token: ${{ secrets.WEPLUSBOT_TOKEN }}
          receiver: '#d8bb7fbacf0849f1bb7fcc89a878a1a0'
          vars: |
            environment: 测试环境
            app: ${{ matrix.project }}

  build-docker-image-madman:
    name: Build docker image madman
    runs-on: ubuntu-latest
    needs:
      - ensure-main
    if: needs.ensure-main.outputs.ENSURE_MAIN == 'true'
    strategy:
      matrix:
        package:
          - realtime
    steps:
      - uses: actions/checkout@v6
      - name: Checkout
        id: checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: prtmax/endfather
          token: '${{ secrets.GH_TOKEN_0XFE10 }}'
          source_context: 'true'
          image_name: madman-${{ matrix.package }}
          acr_namespace: xoohub

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: '0xfe10'
          password: ${{ secrets.GH_TOKEN_0XFE10 }}

      - name: Docker login (Aliyun)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.CR_ALI_USERNAME_PUNCHX }}
          password: ${{ secrets.CR_ALI_PASSWORD_PUNCHX }}
          registry: ${{ env.DOCKER_REGISTRY_ALI }}

      - name: Publish docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          provenance: false
          sbom: false
          context: madman
          file: madman/docker/${{ matrix.package }}.Dockerfile
          tags: ${{ steps.checkout.outputs.ghcr_tags }}
          labels: ${{ steps.checkout.outputs.oci_labels }}

      - name: Push to Aliyun ACR (with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 5
          retry_wait_seconds: 30
          command: |
            source_image="${{ steps.checkout.outputs.ghcr_sha_run }}"
            target_image="${{ steps.checkout.outputs.ali_image }}:${source_image##*:}"
            docker tag "$source_image" "$target_image"
            docker push "$target_image"
            docker tag ${{ steps.checkout.outputs.ghcr_sha }} ${{ steps.checkout.outputs.ali_sha }}
            docker tag ${{ steps.checkout.outputs.ghcr_sha }} ${{ steps.checkout.outputs.ali_staging }}
            docker push ${{ steps.checkout.outputs.ali_sha }}
            docker push ${{ steps.checkout.outputs.ali_staging }}

      - uses: repotea-workspace/kangumi/github-actions/tepusher@main
        if: failure()
        with:
          template: .maintain/notify/build-failed-docker-image.md
          token: ${{ secrets.WEPLUSBOT_TOKEN }}
          receiver: '#d8bb7fbacf0849f1bb7fcc89a878a1a0'
          vars: |
            environment: 测试环境
            app: ${{ matrix.package}}

  build-docker-image-frontend:
    name: Build docker image frontend
    runs-on: ubuntu-latest
    needs:
      - ensure-main
    if: needs.ensure-main.outputs.ENSURE_MAIN == 'true'
    strategy:
      matrix:
        package:
          - name: woodii
            path: woodii
            command: build:stg
            dist: dist-stg
    steps:
      - uses: actions/checkout@v6
      - name: Checkout
        id: checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: prtmax/endfather
          token: '${{ secrets.GH_TOKEN_0XFE10 }}'
          source_context: 'true'
          image_name: frontend-${{ matrix.package.name }}
          acr_namespace: xoohub

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: '0xfe10'
          password: ${{ secrets.GH_TOKEN_0XFE10 }}

      - name: Docker login (Aliyun)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.CR_ALI_USERNAME_PUNCHX }}
          password: ${{ secrets.CR_ALI_PASSWORD_PUNCHX }}
          registry: ${{ env.DOCKER_REGISTRY_ALI }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: prepare deps
        working-directory: ${{ matrix.package.path }}
        run: |
          npm i -g yarn
          yarn install
          yarn ${{ matrix.package.command }}

      - name: after build
        run: |
          cd ${{ matrix.package.path }}
          mv ${{ matrix.package.dist }} target

      - name: Publish docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          provenance: false
          sbom: false
          context: ${{ matrix.package.path }}
          file: ${{ matrix.package.path }}/docker/Dockerfile
          tags: ${{ steps.checkout.outputs.ghcr_tags }}
          labels: ${{ steps.checkout.outputs.oci_labels }}

      - name: Push to Aliyun ACR (with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 5
          retry_wait_seconds: 30
          command: |
            source_image="${{ steps.checkout.outputs.ghcr_sha_run }}"
            target_image="${{ steps.checkout.outputs.ali_image }}:${source_image##*:}"
            docker tag "$source_image" "$target_image"
            docker push "$target_image"
            docker tag ${{ steps.checkout.outputs.ghcr_sha }} ${{ steps.checkout.outputs.ali_sha }}
            docker tag ${{ steps.checkout.outputs.ghcr_sha }} ${{ steps.checkout.outputs.ali_staging }}
            docker push ${{ steps.checkout.outputs.ali_sha }}
            docker push ${{ steps.checkout.outputs.ali_staging }}

  clean-artifacts:
    name: Clean artifacts
    runs-on: ubuntu-latest
    needs:
      - build-docker-image-babosa
    if: always()
    steps:
      - uses: geekyeggo/delete-artifact@v5
        with:
          name: artifact-java
