name: "[aynhub] Staging"

on:
  push:
    branches:
      - "develop"
env:
  DOCKER_REGISTRY: ghcr.io
  FRONTEND_API_URL: https://hub-stg.iprtapp.com

permissions:
  actions: write
  contents: read
  packages: write

jobs:
  build-apps:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - package: begonia
            build-args: ""
          - package: freesia
            build-args: "NEXT_PUBLIC_API_URL=https://hub-staging.iprtapp.com"
    steps:
      - uses: actions/checkout@v6
      - name: Checkout
        id: checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: prtmax/aynhub
          token: "${{ secrets.GH_TOKEN_0XFE10 }}"
          source_context: "true"
          image_name: aynhub-${{ matrix.package }}

      - name: Check
        working-directory: ${{ matrix.package }}
        run: |
          ls -la

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: '0xfe10'
          password: ${{ secrets.GH_TOKEN_0XFE10 }}
          registry: ${{ env.DOCKER_REGISTRY }}

      - name: Build and publish docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          context: ${{ matrix.package }}
          file: ${{ matrix.package }}/Dockerfile
          provenance: false
          sbom: false
          tags: ${{ steps.checkout.outputs.ghcr_tags }}
          labels: ${{ steps.checkout.outputs.oci_labels }}
          build-args: ${{ matrix.build-args }}
