name: '[byteone] Staging'

on:
  push:
    branches:
      - '**'
env:
  DOCKER_REGISTRY: ghcr.io

  ECS_REGION: cn-shenzhen
  ECS_VSWITCH_ID: vsw-wz9uncyx33urqcxpj8c1p
  ECS_AVAILABILITY_ZONE: cn-shenzhen-e
  ECS_SECURITY_GROUP_ID: sg-wz9eo52rpleayua0e1s6
  ECS_IMAGE_ID: ubuntu_24_04_x64_20G_alibase_20251102.vhd
  ECS_INSTANCE_TYPE: ecs.c7a.large
  ECS_SYSTEM_DISK_SIZE: 40
  ECS_SPOT_STRATEGY: SpotAsPriceGo

jobs:
  ensure-main:
    name: Ensure main
    runs-on: ubuntu-latest
    outputs:
      ENSURE_MAIN: ${{ steps.ensure_main.outputs.ENSURE_MAIN }}
    steps:
      - uses: actions/checkout@v6

      - name: Ensure main
        id: ensure_main
        run: |
          if grep -q 'main' .github/branch.txt; then
            echo "ENSURE_MAIN=true" >> $GITHUB_OUTPUT
          else
            echo "ENSURE_MAIN=false" >> $GITHUB_OUTPUT
          fi

  build-apps:
    name: Build
    runs-on: ubuntu-latest
    needs:
      - ensure-main
    if: needs.ensure-main.outputs.ENSURE_MAIN == 'true'
    strategy:
      matrix:
        package:
          - name: core
          - name: msgbridge
          - name: front
            args: |
              BUILD_MODE=staging
    steps:
      - uses: actions/checkout@v6
      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: prtmax/byteone
          token: '${{ secrets.GH_TOKEN_0XFE10 }}'
          ref_file: .github/ref.txt

      - name: Check
        working-directory: pkgs/${{ matrix.package.name }}
        run: |
          ls -la

      - name: Docker login
        uses: docker/login-action@v1
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ${{ env.DOCKER_REGISTRY }}

      - uses: benjlevesque/short-sha@v3.0

      - name: Publish docker image hash
        uses: docker/build-push-action@v6
        with:
          push: true
          context: pkgs/${{ matrix.package.name }}
          file: pkgs/${{ matrix.package.name }}/Dockerfile
          build-args: ${{ matrix.package.args || '' }}
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/byteone-${{ matrix.package.name }}:sha-${{ env.SHA }}
            ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/byteone-${{ matrix.package.name }}:staging

      - name: Mirror images to ACR
        uses: repotea-workspace/kangumi/github-actions/mirror-to-acr@main
        with:
          # config_file: mirror-acr/mirror-config-sz.yaml
          source_image: ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/byteone-${{ matrix.package.name }}:sha-${{ env.SHA }}
          target_image: |
            crpi-uhy920dintikwpn3-vpc.cn-shenzhen.personal.cr.aliyuncs.com/coohub/${{ github.repository }}_byteone-${{ matrix.package.name }}:sha-${{ env.SHA }}
            crpi-uhy920dintikwpn3-vpc.cn-shenzhen.personal.cr.aliyuncs.com/coohub/${{ github.repository }}_byteone-${{ matrix.package.name }}:staging


          registry_credentials: |
            {
              "ghcr.io": {
                "username": "0xfe10",
                "password": "${{ secrets.GT_0XFE10 }}"
              },
              "crpi-uhy920dintikwpn3-vpc.cn-shenzhen.personal.cr.aliyuncs.com": {
                "username": "${{ secrets.CR_ALI_USERNAME_JOECHOW }}",
                "password": "${{ secrets.CR_ALI_PASSWORD_JOECHOW }}"
              },
              "crpi-uhy920dintikwpn3.cn-shenzhen.personal.cr.aliyuncs.com": {
                "username": "${{ secrets.CR_ALI_USERNAME_JOECHOW }}",
                "password": "${{ secrets.CR_ALI_PASSWORD_JOECHOW }}"
              }
            }

          # Aliyun credentials
          ali_access_key: ${{ secrets.ALI_ACCESS_KEY_AYN_ECS }}
          ali_secret_key: ${{ secrets.ALI_SECRET_KEY_AYN_ECS }}
          ali_region: ${{ env.ECS_REGION }}

          # ECS configuration
          vswitch_id: ${{ env.ECS_VSWITCH_ID }}
          availability_zone: ${{ env.ECS_AVAILABILITY_ZONE }}
          security_group_id: ${{ env.ECS_SECURITY_GROUP_ID }}
          image_id: ${{ env.ECS_IMAGE_ID }}
          instance_type: ${{ env.ECS_INSTANCE_TYPE }}
          system_disk_size: ${{ env.ECS_SYSTEM_DISK_SIZE }}
          spot_strategy: ${{ env.ECS_SPOT_STRATEGY }}
          key_pair_name: ${{ env.ECS_KEYPAIR_NAME }}
          ssh_private_key: ${{ secrets.SSH_KEYPAIR_ALI_GENERIC }}

  deploy-apps:
    name: Deploy Apps
    runs-on: ubuntu-latest
    needs:
      - build-apps
    steps:
      - uses: actions/checkout@v6
      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: prtmax/byteone
          token: '${{ secrets.GH_TOKEN_0XFE10 }}'
          ref_file: .github/ref.txt

      - uses: benjlevesque/short-sha@v3.0
      - name: Deploy
        uses: repotea-workspace/kangumi/github-actions/gitops-deploy@main
        with:
          repository: repotea-workflow/gitops-ayn
          deploy_key: '${{ secrets.DEPLOY_KEY_GITOPS_AYN }}'
          argocd_server: ${{ secrets.ARGOCD_AYN_SERVER }}
          argocd_api_token: ${{ secrets.ARGOCD_AYN_API_TOKEN }}
          app_name: iot-staging-byteone
          project_name: prtmax/byteone
          ac_git_ref: __origin__/.github/ref.txt
          commit_message: __origin__/.github/message.txt
          changes: |
            {
              "argocd/iot/byteone/overlays/staging/values.yaml": {
                "app.core.image": "${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/byteone-core:sha-${{ env.SHA }}",
                "app.msgbridge.image": "${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/byteone-msgbridge:sha-${{ env.SHA }}",
                "app.front.image": "${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/byteone-front:sha-${{ env.SHA }}"
              }
            }
