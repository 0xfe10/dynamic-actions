name: "[sampleyard] Staging"

on:
  push:
    branches:
      - "**"

jobs:
  ensure-main:
    name: Ensure main
    runs-on: ubuntu-latest
    outputs:
      ENSURE_MAIN: ${{ steps.ensure_main.outputs.ENSURE_MAIN }}
    steps:
      - uses: actions/checkout@v6

      - name: Ensure main
        id: ensure_main
        run: |
          if grep -q '^main$' .github/branch.txt; then
            echo "ENSURE_MAIN=true" >> $GITHUB_OUTPUT
          else
            echo "ENSURE_MAIN=false" >> $GITHUB_OUTPUT
          fi

  test-demo:
    name: Test Demo
    runs-on: ubuntu-latest
    needs:
      - ensure-main
    if: needs.ensure-main.outputs.ENSURE_MAIN == 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: boxliy/sampleyard
          token: "${{ secrets.GH_TOKEN_0XFE10 }}"
          ref_file: .github/ref.txt

      - name: Test swallow
        run: npm test --prefix aviary/swallow

  falcon-android-java:
    name: Falcon Android Java
    runs-on: ubuntu-latest
    needs:
      - ensure-main
    if: needs.ensure-main.outputs.ENSURE_MAIN == 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Checkout sampleyard
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: boxliy/sampleyard
          token: "${{ secrets.GH_TOKEN_0XFE10 }}"
          ref_file: .github/ref.txt

      - name: Checkout nib
        uses: actions/checkout@v6
        with:
          repository: boxliy/nib
          token: "${{ secrets.GH_TOKEN_0XFE10 }}"
          path: .falcon-nib

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"

      - name: Build Falcon Android Java
        env:
          NIB_ROOT: ${{ github.workspace }}/.falcon-nib
        run: ./gradlew :falcon-core:mockTest :app:assembleDebug
        working-directory: aviary/falcon/android-java

  falcon-android-kotlin:
    name: Falcon Android Kotlin
    runs-on: ubuntu-latest
    needs:
      - ensure-main
    if: needs.ensure-main.outputs.ENSURE_MAIN == 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Checkout sampleyard
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: boxliy/sampleyard
          token: "${{ secrets.GH_TOKEN_0XFE10 }}"
          ref_file: .github/ref.txt

      - name: Checkout nib
        uses: actions/checkout@v6
        with:
          repository: boxliy/nib
          token: "${{ secrets.GH_TOKEN_0XFE10 }}"
          path: .falcon-nib

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"

      - name: Build Falcon Android Kotlin
        env:
          NIB_ROOT: ${{ github.workspace }}/.falcon-nib
        run: ./gradlew :falcon-core:mockTest :app:assembleDebug
        working-directory: aviary/falcon/android-kotlin

  falcon-ios-objectivec:
    name: Falcon iOS Objective-C
    runs-on: macos-latest
    needs:
      - ensure-main
    if: needs.ensure-main.outputs.ENSURE_MAIN == 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Checkout sampleyard
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: boxliy/sampleyard
          token: "${{ secrets.GH_TOKEN_0XFE10 }}"
          ref_file: .github/ref.txt

      - name: Checkout nib
        uses: actions/checkout@v6
        with:
          repository: boxliy/nib
          token: "${{ secrets.GH_TOKEN_0XFE10 }}"
          path: .falcon-nib

      - name: Link sibling nib checkout
        run: ln -sfn "${GITHUB_WORKSPACE}/.falcon-nib" "${GITHUB_WORKSPACE}/../nib"

      - name: Build Falcon iOS Objective-C
        run: xcodebuild -project FalconObjC.xcodeproj -scheme FalconObjC -sdk iphonesimulator -configuration Debug -derivedDataPath "${RUNNER_TEMP}/falcon-objc-derived" build CODE_SIGNING_ALLOWED=NO
        working-directory: aviary/falcon/ios-objectivec

  falcon-ios-swift:
    name: Falcon iOS Swift
    runs-on: macos-latest
    needs:
      - ensure-main
    if: needs.ensure-main.outputs.ENSURE_MAIN == 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Checkout sampleyard
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: boxliy/sampleyard
          token: "${{ secrets.GH_TOKEN_0XFE10 }}"
          ref_file: .github/ref.txt

      - name: Checkout nib
        uses: actions/checkout@v6
        with:
          repository: boxliy/nib
          token: "${{ secrets.GH_TOKEN_0XFE10 }}"
          path: .falcon-nib

      - name: Link sibling nib checkout
        run: ln -sfn "${GITHUB_WORKSPACE}/.falcon-nib" "${GITHUB_WORKSPACE}/../nib"

      - name: Build Falcon iOS Swift
        run: xcodebuild -project FalconSwift.xcodeproj -scheme FalconSwift -sdk iphonesimulator -configuration Debug -derivedDataPath "${RUNNER_TEMP}/falcon-swift-derived" build CODE_SIGNING_ALLOWED=NO
        working-directory: aviary/falcon/ios-swift

  falcon-flutter-android:
    name: Falcon Flutter Android
    runs-on: ubuntu-latest
    needs:
      - ensure-main
    if: needs.ensure-main.outputs.ENSURE_MAIN == 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Checkout sampleyard
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: boxliy/sampleyard
          token: "${{ secrets.GH_TOKEN_0XFE10 }}"
          ref_file: .github/ref.txt

      - name: Checkout nib
        uses: actions/checkout@v6
        with:
          repository: boxliy/nib
          token: "${{ secrets.GH_TOKEN_0XFE10 }}"
          path: .falcon-nib

      - name: Link sibling nib checkout
        run: ln -sfn "${GITHUB_WORKSPACE}/.falcon-nib" "${GITHUB_WORKSPACE}/../nib"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build Falcon Flutter Android
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build apk --debug
        working-directory: aviary/falcon/flutter

  falcon-flutter-ios:
    name: Falcon Flutter iOS
    runs-on: macos-latest
    needs:
      - ensure-main
    if: needs.ensure-main.outputs.ENSURE_MAIN == 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Checkout sampleyard
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: boxliy/sampleyard
          token: "${{ secrets.GH_TOKEN_0XFE10 }}"
          ref_file: .github/ref.txt

      - name: Checkout nib
        uses: actions/checkout@v6
        with:
          repository: boxliy/nib
          token: "${{ secrets.GH_TOKEN_0XFE10 }}"
          path: .falcon-nib

      - name: Link sibling nib checkout
        run: ln -sfn "${GITHUB_WORKSPACE}/.falcon-nib" "${GITHUB_WORKSPACE}/../nib"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build Falcon Flutter iOS
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build ios --no-codesign
        working-directory: aviary/falcon/flutter
