name: '[labeldesktop] Staging'

on:
  push:
    branches:
      - '**'

jobs:

  # ensure-main:
  #   name: Ensure main
  #   runs-on: ubuntu-latest
  #   outputs:
  #     ENSURE_MAIN: ${{ steps.ensure_main.outputs.ENSURE_MAIN }}
  #   steps:
  #     - uses: actions/checkout@v2
  
  #     - name: Ensure main
  #       id: ensure_main
  #       run: |
  #         if grep -q 'main' .github/ref.txt; then
  #           echo "ENSURE_MAIN=true" >> $GITHUB_OUTPUT
  #         else
  #           echo "ENSURE_MAIN=false" >> $GITHUB_OUTPUT
  #         fi

  build:
    name: Build
    strategy:
      matrix:
        os:
          - windows-latest
          # - macos-latest
    runs-on: ${{ matrix.os }}
    # needs:
    #   - ensure-main
    # if: needs.ensure-main.outputs.ENSURE_MAIN == 'true'
    steps:
      - uses: actions/checkout@v2
      - name: Checkout
        uses: fewensa/actions/clone-any@main
        with:
          platform: gitlab
          repository: prtmax/labeldesktop
          access_token: '${{ secrets.GITLAB_TOKEN }}'
          ref_file: .github/ref.txt

      - name: Setup Flutter SDK
        uses: flutter-actions/setup-flutter@v3
        with:
          channel: stable
          #version: 3.19.6

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Test deps
        run: |
          rustc --version
          cargo --version
          flutter --version

      - name: Setup git credential
        run: |
          git config --global credential.helper store
          echo 'https://${{ secrets.GITLAB_TOKEN }}@gitlab.com' > ~/.git-credentials

      - name: Install deps
        run: |
          flutter pub global activate get_cli
          flutter pub upgrade
          get generate locales assets/locales

      - name: Check build
        if: matrix.os == 'windows-latest'
        run: |
          flutter build windows

      - name: Prepare publish
        run: |
          sh -f scripts/after-build.sh

      - name: Compile Installer
        if: matrix.os == 'windows-latest'
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.4
        with:
          path: labeldesktop.iss
          options: /O+

      - name: Check build
        if: matrix.os == 'macos-latest'
        run: flutter build macos

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifact-release
          path: |
            Output


  publish:
    name: Publish build
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - uses: actions/checkout@v2
      - name: Checkout
        uses: fewensa/actions/clone-any@main
        with:
          platform: gitlab
          repository: prtmax/labeldesktop
          access_token: '${{ secrets.GITLAB_TOKEN }}'
          ref_file: .github/ref.txt

      - uses: actions/download-artifact@v4
        with:
          name: artifact-release
          path: Output

      - name: Publish release
        uses: docker://minio/minio:RELEASE.2024-08-03T04-33-23Z
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          MIO_IPRT_ENDPOINT: ${{ secrets.MIO_IPRT_ENDPOINT }}
          MIO_IPRT_AK: ${{ secrets.MIO_IPRT_AK }}
          MIO_IPRT_SK: ${{ secrets.MIO_IPRT_SK }}
        with:
          entrypoint: /bin/bash
          args: -f scripts/release-win-ci.sh

      - name: Read distribute
        id: read_distribute
        uses: juliangruber/read-file-action@v1
        with:
          path: ./distribute.txt

      - uses: fewensa/actions/tepusher@main
        with:
          template: .maintain/notify/publish-success.md
          token: ${{ secrets.WEPLUSBOT_TOKEN }}
          receiver: "#6cfbef7cc90c4d1ab0842b13e483fafb"
          aters: wxid_5634706356812,wxid_ag5na9b93xq822
          vars: |
            environment: 测试环境
            download_link: '${{ steps.read_distribute.outputs.content }}'

  notify:
    name: Notify failure
    runs-on: ubuntu-latest
    needs:
      - build
      - publish
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    steps:
      - uses: actions/checkout@v2
      - name: Checkout
        uses: fewensa/actions/clone-any@main
        with:
          platform: gitlab
          repository: prtmax/labeldesktop
          access_token: '${{ secrets.GITLAB_TOKEN }}'
          ref_file: .github/ref.txt

      - uses: fewensa/actions/tepusher@main
        with:
          template: .maintain/notify/publish-failed.md
          token: ${{ secrets.WEPLUSBOT_TOKEN }}
          receiver: "#6cfbef7cc90c4d1ab0842b13e483fafb"
          aters: xiaowen407086
          vars: |
            environment: 测试环境

  clean-artifacts:
    name: Clean artifacts
    runs-on: ubuntu-latest
    needs:
      - publish
    if: always()
    steps:
      - uses: geekyeggo/delete-artifact@v5
        with:
          name: artifact-release



