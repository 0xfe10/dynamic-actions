name: "[labelab] Staging"

on:
  push:
    branches:
      - "**"

jobs:
  build-android:
    name: Build Android ${{ matrix.artifact.name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        artifact:
          - name: APK
            command: flutter build apk --release
            path: mobile/build/app/outputs/flutter-apk/app-release.apk
            upload_name: app-release-apk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Decode keystore
        run: |
          echo "${{ secrets.LABALAB_STG_JKS }}" | base64 --decode > $GITHUB_WORKSPACE/labelab-release.jks

      - name: Write key.properties
        run: |
          cat > mobile/android/key.properties << EOF
          storePassword=${{ secrets.LABALAB_STG_STORE_PASSWORD }}
          keyPassword=${{ secrets.LABALAB_STG_KEY_PASSWORD }}
          keyAlias=${{ secrets.LABALAB_STG_KEY_ALIAS }}
          storeFile=$GITHUB_WORKSPACE/labelab-release.jks
          EOF

      - name: Build ${{ matrix.artifact.name }}
        working-directory: mobile
        run: ${{ matrix.artifact.command }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact.upload_name }}
          path: ${{ matrix.artifact.path }}

  release:
    name: Create Pre-release
    runs-on: ubuntu-latest
    needs: build-android
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: ncipollo/release-action@v1
        with:
          tag: canary
          name: Canary (${{ github.ref_name }}@${{ github.sha }})
          body: |
            Branch: `${{ github.ref_name }}`
            Commit: ${{ github.sha }}
          prerelease: true
          allowUpdates: true
          removeArtifacts: true
          artifacts: dist/*
