name: "[sampleyard] Staging"

on:
  push:
    branches:
      - "**"

jobs:
  ensure-main:
    name: Ensure main
    runs-on: ubuntu-latest
    outputs:
      ENSURE_MAIN: ${{ steps.ensure_main.outputs.ENSURE_MAIN }}
    steps:
      - uses: actions/checkout@v6

      - name: Ensure main
        id: ensure_main
        run: |
          if grep -q '^main$' .github/branch.txt; then
            echo "ENSURE_MAIN=true" >> $GITHUB_OUTPUT
          else
            echo "ENSURE_MAIN=false" >> $GITHUB_OUTPUT
          fi

  test-demo:
    name: Test Demo
    runs-on: ubuntu-latest
    needs:
      - ensure-main
    if: needs.ensure-main.outputs.ENSURE_MAIN == 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: boxliy/sampleyard
          token: "${{ secrets.GH_TOKEN_0XFE10 }}"
          ref_file: .github/ref.txt

      - name: Test swallow
        run: npm test --prefix aviary/swallow

  falcon-android-java:
    name: Falcon Android Java
    runs-on: ubuntu-latest
    needs:
      - ensure-main
    if: needs.ensure-main.outputs.ENSURE_MAIN == 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Checkout sampleyard
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: boxliy/sampleyard
          token: "${{ secrets.GH_TOKEN_0XFE10 }}"
          ref_file: .github/ref.txt

      - name: Checkout nib
        uses: actions/checkout@v6
        with:
          repository: boxliy/nib
          token: "${{ secrets.GH_TOKEN_0XFE10 }}"
          path: .falcon-nib

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"

      - name: Build Falcon Android Java
        env:
          NIB_ROOT: ${{ github.workspace }}/.falcon-nib
        run: ./gradlew :falcon-core:mockTest :app:assembleDebug
        working-directory: aviary/falcon/android-java

  falcon-android-kotlin:
    name: Falcon Android Kotlin
    runs-on: ubuntu-latest
    needs:
      - ensure-main
    if: needs.ensure-main.outputs.ENSURE_MAIN == 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Checkout sampleyard
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: boxliy/sampleyard
          token: "${{ secrets.GH_TOKEN_0XFE10 }}"
          ref_file: .github/ref.txt

      - name: Checkout nib
        uses: actions/checkout@v6
        with:
          repository: boxliy/nib
          token: "${{ secrets.GH_TOKEN_0XFE10 }}"
          path: .falcon-nib

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"

      - name: Build Falcon Android Kotlin
        env:
          NIB_ROOT: ${{ github.workspace }}/.falcon-nib
        run: ./gradlew :falcon-core:mockTest :app:assembleDebug
        working-directory: aviary/falcon/android-kotlin
