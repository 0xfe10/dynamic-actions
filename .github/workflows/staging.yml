  build-and-deploy:
    name: Build Staging Images
    runs-on: ubuntu-latest
    needs: [prepare, api, admin, android]
    if: ${{ success() && needs.prepare.outputs.main == 'true' }}
    steps:
      - uses: actions/checkout@v6
      - name: Checkout
        id: checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: prtmax/cosmos
          token: ${{ secrets.GH_TOKEN_0XFE10 }}
          submodules: recursive
          source_context: "true"
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: '0xfe10'
          password: ${{ secrets.GH_TOKEN_0XFE10 }}
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY_ALI }}
          username: ${{ secrets.CR_ALI_USERNAME_PUNCHX }}
          password: ${{ secrets.CR_ALI_PASSWORD_PUNCHX }}
      - name: Build and push image
        id: mercury_image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: mercury
          push: true
          provenance: false
          sbom: false
          labels: ${{ steps.checkout.outputs.oci_labels }}
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.SOURCE_REPO }}/cosmos-mercury:sha-${{ env.SHORT_SHA }}-${{ github.run_number }}
            ${{ env.DOCKER_REGISTRY }}/${{ env.SOURCE_REPO }}/cosmos-mercury:sha-${{ env.SHORT_SHA }}
            ${{ env.DOCKER_REGISTRY }}/${{ env.SOURCE_REPO }}/cosmos-mercury:staging
            ${{ env.DOCKER_REGISTRY_ALI }}/xoohub/${{ env.REPO_NAME }}_cosmos-mercury:sha-${{ env.SHORT_SHA }}-${{ github.run_number }}
            ${{ env.DOCKER_REGISTRY_ALI }}/xoohub/${{ env.REPO_NAME }}_cosmos-mercury:sha-${{ env.SHORT_SHA }}
            ${{ env.DOCKER_REGISTRY_ALI }}/xoohub/${{ env.REPO_NAME }}_cosmos-mercury:staging
      - name: Build and push worker image
        id: worker_image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          push: true
          provenance: false
          sbom: false
          labels: ${{ steps.checkout.outputs.oci_labels }}
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.SOURCE_REPO }}/cosmos-mercury-worker:sha-${{ env.SHORT_SHA }}-${{ github.run_number }}
            ${{ env.DOCKER_REGISTRY }}/${{ env.SOURCE_REPO }}/cosmos-mercury-worker:sha-${{ env.SHORT_SHA }}
            ${{ env.DOCKER_REGISTRY }}/${{ env.SOURCE_REPO }}/cosmos-mercury-worker:staging
            ${{ env.DOCKER_REGISTRY_ALI }}/xoohub/${{ env.REPO_NAME }}_cosmos-mercury-worker:sha-${{ env.SHORT_SHA }}-${{ github.run_number }}
            ${{ env.DOCKER_REGISTRY_ALI }}/xoohub/${{ env.REPO_NAME }}_cosmos-mercury-worker:sha-${{ env.SHORT_SHA }}
            ${{ env.DOCKER_REGISTRY_ALI }}/xoohub/${{ env.REPO_NAME }}_cosmos-mercury-worker:staging
      - name: Build and push Vega image
        id: vega_image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: vega
          push: true
          provenance: false
          sbom: false
          labels: ${{ steps.checkout.outputs.oci_labels }}
          build-args: |
            VITE_MERCURY_BASE_URL=https://mercury-stg.iprtapp.com
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.SOURCE_REPO }}/cosmos-vega:sha-${{ env.SHORT_SHA }}-${{ github.run_number }}
            ${{ env.DOCKER_REGISTRY }}/${{ env.SOURCE_REPO }}/cosmos-vega:sha-${{ env.SHORT_SHA }}
            ${{ env.DOCKER_REGISTRY }}/${{ env.SOURCE_REPO }}/cosmos-vega:staging
            ${{ env.DOCKER_REGISTRY_ALI }}/xoohub/${{ env.REPO_NAME }}_cosmos-vega:sha-${{ env.SHORT_SHA }}-${{ github.run_number }}
            ${{ env.DOCKER_REGISTRY_ALI }}/xoohub/${{ env.REPO_NAME }}_cosmos-vega:sha-${{ env.SHORT_SHA }}
            ${{ env.DOCKER_REGISTRY_ALI }}/xoohub/${{ env.REPO_NAME }}_cosmos-vega:staging
