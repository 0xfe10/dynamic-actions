name: "[image-review] Staging"

on:
  push:
    branches:
      - "**"

env:
  DOCKER_REGISTRY: ghcr.io
  DOCKER_REGISTRY_ALI: registry.cn-hongkong.aliyuncs.com
  DOCKER_REGISTRY_ALI_VPC: registry-vpc.cn-hongkong.aliyuncs.com
  DOCKER_REGISTRY_ALI_SZ: crpi-uhy920dintikwpn3.cn-shenzhen.personal.cr.aliyuncs.com
  DOCKER_REGISTRY_ALI_SZ_VPC: crpi-uhy920dintikwpn3-vpc.cn-shenzhen.personal.cr.aliyuncs.com

permissions:
  actions: write
  contents: read
  packages: write

jobs:
  ensure-main:
    name: Ensure main
    runs-on: ubuntu-latest
    outputs:
      ENSURE_MAIN: ${{ steps.ensure_main.outputs.matches }}
    steps:
      - uses: actions/checkout@v6

      - name: Ensure main
        id: ensure_main
        uses: repotea-workspace/kangumi/github-actions/dyn-source@main
        with:
          repository: prtmax/Image-review
          branches: main

  build-app:
    name: Build
    runs-on: ubuntu-latest
    needs:
      - ensure-main
    if: needs.ensure-main.outputs.ENSURE_MAIN == 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Checkout
        id: checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: prtmax/Image-review
          token: "${{ secrets.GH_TOKEN_0XFE10 }}"
          source_context: "true"
          image_name: image-review
          acr_namespace: xoohub

      - name: Docker login (GHCR)
        uses: docker/login-action@v3
        with:
          username: '0xfe10'
          password: ${{ secrets.GH_TOKEN_0XFE10 }}
          registry: ${{ env.DOCKER_REGISTRY }}

      - name: Docker login (Aliyun)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.CR_ALI_USERNAME_PUNCHX }}
          password: ${{ secrets.CR_ALI_PASSWORD_PUNCHX }}
          registry: ${{ env.DOCKER_REGISTRY_ALI }}

      - name: Docker login (Aliyun SZ)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.CR_ALI_USERNAME_JOECHOW }}
          password: ${{ secrets.CR_ALI_PASSWORD_JOECHOW }}
          registry: ${{ env.DOCKER_REGISTRY_ALI_SZ }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          provenance: false
          sbom: false
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.checkout.outputs.ghcr_tags }}
          labels: ${{ steps.checkout.outputs.oci_labels }}

      - name: Push to Aliyun ACR (with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 5
          retry_wait_seconds: 30
          command: |
            source_image="${{ steps.checkout.outputs.ghcr_sha_run }}"
            run_tag="${source_image##*:}"
            docker buildx imagetools create -t "${{ steps.checkout.outputs.ali_image }}:${run_tag}" "$source_image"
            docker buildx imagetools create -t "${{ steps.checkout.outputs.ali_sha }}" "$source_image"
            docker buildx imagetools create -t "${{ steps.checkout.outputs.ali_staging }}" "$source_image"
            docker buildx imagetools create -t "${{ env.DOCKER_REGISTRY_ALI_SZ }}/coohub/${{ env.REPO_NAME }}_image-review:${run_tag}" "$source_image"
            docker buildx imagetools create -t "${{ env.DOCKER_REGISTRY_ALI_SZ }}/coohub/${{ env.REPO_NAME }}_image-review:sha-${{ env.SHORT_SHA }}" "$source_image"
            docker buildx imagetools create -t "${{ env.DOCKER_REGISTRY_ALI_SZ }}/coohub/${{ env.REPO_NAME }}_image-review:staging" "$source_image"
