name: '[endfather] Staging'

on:
  push:
    branches:
      - '**'
env:
  #DOCKER_REGISTRY: uhub.service.ucloud.cn
  DOCKER_REGISTRY: ghcr.io

jobs:
  ensure-main:
    name: Ensure main
    runs-on: ubuntu-latest
    outputs:
      ENSURE_MAIN: ${{ steps.ensure_main.outputs.ENSURE_MAIN }}
    steps:
      - uses: actions/checkout@v5

      - name: Ensure main
        id: ensure_main
        run: |
          if grep -q 'main' .github/branch.txt; then
            echo "ENSURE_MAIN=true" >> $GITHUB_OUTPUT
          else
            echo "ENSURE_MAIN=false" >> $GITHUB_OUTPUT
          fi

  build-app-java:
    name: Build app java
    runs-on: ubuntu-latest
    needs:
      - ensure-main
    if: needs.ensure-main.outputs.ENSURE_MAIN == 'true'
    strategy:
      matrix:
        package:
          - babosa
    steps:
      - uses: actions/checkout@v5
      - name: Setup Maven Action
        uses: s4u/setup-maven-action@v1.18.0
        with:
          java-version: 17
          maven-version: 3.9.8
      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: prtmax/endfather
          token: '${{ secrets.GH_TOKEN_0XFE10 }}'
          ref_file: .github/ref.txt

      - name: Build ${{ matrix.package }}
        run: |
          cd ${{ matrix.package }}
          mvn clean package -Dmaven.test.skip=true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifact-java
          path: |
            babosa/launchers/*/target/dist/*.gz
            babosa/tasks/*/target/dist/*.gz

  build-docker-image-babosa:
    name: Build docker image babosa
    runs-on: ubuntu-latest
    needs:
      - build-app-java
    strategy:
      matrix:
        package:
          - LAUNCHER: launchers/analysis
            SLUG: launcher-analysis
          # - LAUNCHER: launchers/boogie
          #   SLUG: launcher-boogie
          - LAUNCHER: launchers/labelexpert
            SLUG: launcher-labelexpert
          - LAUNCHER: launchers/metaprint
            SLUG: launcher-metaprint
          - LAUNCHER: launchers/universal
            SLUG: launcher-universal
          - LAUNCHER: launchers/woodii
            SLUG: launcher-woodii
          - LAUNCHER: tasks/infra
            SLUG: task-infra
          - LAUNCHER: launchers/webhook
            SLUG: launcher-webhook
    steps:
      - uses: actions/checkout@v5
      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: prtmax/endfather
          token: '${{ secrets.GH_TOKEN_0XFE10 }}'
          ref_file: .github/ref.txt

      - uses: actions/download-artifact@v4
        with:
          name: artifact-java
          path: babosa

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: benjlevesque/short-sha@v1.2

      - name: Publish docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          context: babosa/${{ matrix.package.LAUNCHER }}
          file: babosa/${{ matrix.package.LAUNCHER }}/docker/Dockerfile
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/${{ matrix.package.SLUG }}:sha-${{ env.SHA }}
            ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/${{ matrix.package.SLUG }}:staging

      - uses: repotea-workspace/kangumi/github-actions/tepusher@main
        if: failure()
        with:
          template: .maintain/notify/build-failed-docker-image.md
          token: ${{ secrets.WEPLUSBOT_TOKEN }}
          receiver: '#d8bb7fbacf0849f1bb7fcc89a878a1a0'
          vars: |
            environment: 测试环境
            app: ${{ matrix.package.LAUNCHER }}

  migrate-db:
    name: Migrate database
    runs-on: ubuntu-latest
    needs:
      - build-docker-image-babosa
    strategy:
      matrix:
        project:
          #- boogie
          - cornerstone
          - analysis
    steps:
      - uses: actions/checkout@v5
      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: prtmax/endfather
          token: '${{ secrets.GH_TOKEN_0XFE10 }}'
          ref_file: .github/ref.txt

      # - name: Migrate boogie
      #   uses: docker://flyway/flyway:10-alpine
      #   if: ${{ matrix.project == 'boogie' }}
      #   with:
      #     args: >
      #       -url="jdbc:mysql://${{ secrets.BABOSA_DB_BOOGIE_HOST_STG }}/boogie_stg?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8"
      #       -user=${{ secrets.BABOSA_DB_BOOGIE_USER_STG }}
      #       -password=$${{ secrets.BABOSA_DB_BOOGIE_PASSWORD_STG }}
      #       -locations=filesystem:./traice/boogie/records
      #       -encoding=UTF-8
      #       migrate

      - name: Migrate cornerstone
        uses: docker://flyway/flyway:10-alpine
        if: ${{ matrix.project == 'cornerstone' }}
        with:
          args: >
            -url="jdbc:mysql://${{ secrets.BABOSA_DB_CORNERSTONE_HOST_STG }}/babosa_stg?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8"
            -user=${{ secrets.BABOSA_DB_CORNERSTONE_USER_STG }}
            -password=${{ secrets.BABOSA_DB_CORNERSTONE_PASSWORD_STG }}
            -locations=filesystem:./traice/cornerstone/records
            -encoding=UTF-8
            migrate

      - name: Migrate analysis
        uses: docker://flyway/flyway:10-alpine
        if: ${{ matrix.project == 'analysis' }}
        with:
          args: >
            -url="jdbc:mysql://${{ secrets.BABOSA_DB_ANALYSIS_HOST_STG }}/analysis_stg?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8"
            -user=${{ secrets.BABOSA_DB_ANALYSIS_USER_STG }}
            -password=${{ secrets.BABOSA_DB_ANALYSIS_PASSWORD_STG }}
            -locations=filesystem:./traice/analysis/records
            -encoding=UTF-8
            migrate

      - uses: repotea-workspace/kangumi/github-actions/tepusher@main
        if: failure()
        with:
          template: .maintain/notify/migrate-failed.md
          token: ${{ secrets.WEPLUSBOT_TOKEN }}
          receiver: '#d8bb7fbacf0849f1bb7fcc89a878a1a0'
          vars: |
            environment: 测试环境
            app: ${{ matrix.project }}

  build-docker-image-madman:
    name: Build docker image madman
    runs-on: ubuntu-latest
    needs:
      - ensure-main
    if: needs.ensure-main.outputs.ENSURE_MAIN == 'true'
    strategy:
      matrix:
        package:
          - realtime
    steps:
      - uses: actions/checkout@v5
      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: prtmax/endfather
          token: '${{ secrets.GH_TOKEN_0XFE10 }}'
          ref_file: .github/ref.txt

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: benjlevesque/short-sha@v1.2

      - name: Publish docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          context: madman
          file: madman/docker/${{ matrix.package }}.Dockerfile
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/madman-${{ matrix.package }}:sha-${{ env.SHA }}
            ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/madman-${{ matrix.package }}:staging

      - uses: repotea-workspace/kangumi/github-actions/tepusher@main
        if: failure()
        with:
          template: .maintain/notify/build-failed-docker-image.md
          token: ${{ secrets.WEPLUSBOT_TOKEN }}
          receiver: '#d8bb7fbacf0849f1bb7fcc89a878a1a0'
          vars: |
            environment: 测试环境
            app: ${{ matrix.package}}

  build-docker-image-frontend:
    name: Build docker image frontend
    runs-on: ubuntu-latest
    needs:
      - ensure-main
    if: needs.ensure-main.outputs.ENSURE_MAIN == 'true'
    strategy:
      matrix:
        package:
          - name: woodii
            path: woodii
            command: build:stg
            dist: dist-stg
    steps:
      - uses: actions/checkout@v5
      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: prtmax/endfather
          token: '${{ secrets.GH_TOKEN_0XFE10 }}'
          ref_file: .github/ref.txt

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: benjlevesque/short-sha@v1.2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: prepare deps
        working-directory: ${{ matrix.package.path }}
        run: |
          npm i -g yarn
          yarn install
          yarn ${{ matrix.package.command }}

      - name: after build
        run: |
          cd ${{ matrix.package.path }}
          mv ${{ matrix.package.dist }} target

      - name: Publish docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          context: ${{ matrix.package.path }}
          file: ${{ matrix.package.path }}/docker/Dockerfile
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/frontend-${{ matrix.package.name }}:sha-${{ env.SHA }}
            ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/frontend-${{ matrix.package.name }}:staging

  deploy-apps:
    name: Deploy Apps
    runs-on: ubuntu-latest
    needs:
      - migrate-db
      - build-docker-image-madman
      - build-docker-image-frontend
    steps:
      - uses: actions/checkout@v5
      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: prtmax/endfather
          token: '${{ secrets.GH_TOKEN_0XFE10 }}'
          ref_file: .github/ref.txt

      - uses: benjlevesque/short-sha@v3.0
      - name: Deploy
        uses: repotea-workspace/kangumi/github-actions/gitops-deploy@main
        with:
          repository: repotea-workflow/gitops-ayn
          deploy_key: '${{ secrets.DEPLOY_KEY_GITOPS_AYN }}'
          argocd_server: ${{ secrets.ARGOCD_AYN_SERVER }}
          argocd_api_token: ${{ secrets.ARGOCD_AYN_API_TOKEN }}
          app_name: labelix-staging-babosa
          project_name: prtmax/endfather
          ac_git_ref: __origin__/.github/ref.txt
          commit_message: __origin__/.github/message.txt
          changes: |
            {
              "argocd/labelix/babosa/staging/values.yaml": {
                "app.launcher_universal.image": "${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/launcher-universal:sha-${{ env.SHA }}",
                "app.launcher_labelexpert.image": "${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/launcher-labelexpert:sha-${{ env.SHA }}",
                "app.launcher_metaprint.image": "${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/launcher-metaprint:sha-${{ env.SHA }}",
                "app.launcher_woodii.image": "${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/launcher-woodii:sha-${{ env.SHA }}",
                "app.launcher_webhook.image": "${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/launcher-webhook:sha-${{ env.SHA }}",
                "app.launcher_analysis.image": "${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/launcher-analysis:sha-${{ env.SHA }}",
                "app.task_infra.image": "${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/task-infra:sha-${{ env.SHA }}",
                "app.madman_realtime.image": "${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/madman-realtime:sha-${{ env.SHA }}",
                "app.frontend_woodii.image": "${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/frontend-woodii:sha-${{ env.SHA }}"
              }
            }


  clean-artifacts:
    name: Clean artifacts
    runs-on: ubuntu-latest
    needs:
      - build-docker-image-babosa
    if: always()
    steps:
      - uses: geekyeggo/delete-artifact@v5
        with:
          name: artifact-java
