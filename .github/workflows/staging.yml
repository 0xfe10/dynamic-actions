name: "[aiprint] Staging"

on:
  push:
    branches:
      - "**"

env:
  DOCKER_REGISTRY: ghcr.io
  DOCKER_REGISTRY_ALI: crpi-uhy920dintikwpn3.cn-shenzhen.personal.cr.aliyuncs.com
  DOCKER_REGISTRY_ALI_VPC: crpi-uhy920dintikwpn3-vpc.cn-shenzhen.personal.cr.aliyuncs.com

permissions:
  actions: write
  contents: read
  packages: write

jobs:
  ensure-main:
    name: Ensure main
    runs-on: ubuntu-latest
    outputs:
      ENSURE_MAIN: ${{ steps.ensure_main.outputs.matches }}
    steps:
      - uses: actions/checkout@v6

      - name: Ensure main
        id: ensure_main
        uses: repotea-workspace/kangumi/github-actions/dyn-source@main
        with:
          repository: prtmax/aiprint
          branches: main

  build-app:
    name: Build
    runs-on: ubuntu-latest
    needs:
      - ensure-main
    if: needs.ensure-main.outputs.ENSURE_MAIN == 'true'
    steps:
      - uses: actions/checkout@v6
      - name: Checkout core context
        id: checkout_core
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: prtmax/aiprint
          token: "${{ secrets.GH_TOKEN_0XFE10 }}"
          submodules: recursive
          source_context: "true"
          image_name: aiprint-core
          acr_namespace: coohub

      - name: Checkout front context
        id: checkout_front
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: prtmax/aiprint
          token: "${{ secrets.GH_TOKEN_0XFE10 }}"
          submodules: recursive
          source_context: "true"
          image_name: aiprint-front
          acr_namespace: coohub

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: '0xfe10'
          password: ${{ secrets.GH_TOKEN_0XFE10 }}
          registry: ${{ env.DOCKER_REGISTRY }}

      - name: Docker login (Aliyun)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.CR_ALI_USERNAME_JOECHOW }}
          password: ${{ secrets.CR_ALI_PASSWORD_JOECHOW }}
          registry: ${{ env.DOCKER_REGISTRY_ALI }}

      - name: Build and push core docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          provenance: false
          sbom: false
          context: pkgs/core
          file: pkgs/core/Dockerfile
          tags: ${{ steps.checkout_core.outputs.ghcr_tags }}
          labels: ${{ steps.checkout_core.outputs.oci_labels }}

      - name: Build and push front docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          provenance: false
          sbom: false
          context: pkgs/front
          file: pkgs/front/Dockerfile
          build-args: |
            VITE_API_BASE_URL=/api/v1
          tags: ${{ steps.checkout_front.outputs.ghcr_tags }}
          labels: ${{ steps.checkout_front.outputs.oci_labels }}

      - name: Push to Aliyun ACR (with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 5
          retry_wait_seconds: 30
          command: |
            core_src="${{ steps.checkout_core.outputs.ghcr_sha_run }}"
            front_src="${{ steps.checkout_front.outputs.ghcr_sha_run }}"
            docker pull "$core_src"
            docker pull "$front_src"
            docker tag "$core_src" "${{ steps.checkout_core.outputs.ali_image }}:${core_src##*:}"
            docker tag "$core_src" "${{ steps.checkout_core.outputs.ali_sha }}"
            docker tag "$core_src" "${{ steps.checkout_core.outputs.ali_staging }}"
            docker tag "$front_src" "${{ steps.checkout_front.outputs.ali_image }}:${front_src##*:}"
            docker tag "$front_src" "${{ steps.checkout_front.outputs.ali_sha }}"
            docker tag "$front_src" "${{ steps.checkout_front.outputs.ali_staging }}"
            docker push "${{ steps.checkout_core.outputs.ali_image }}:${core_src##*:}"
            docker push "${{ steps.checkout_core.outputs.ali_sha }}"
            docker push "${{ steps.checkout_core.outputs.ali_staging }}"
            docker push "${{ steps.checkout_front.outputs.ali_image }}:${front_src##*:}"
            docker push "${{ steps.checkout_front.outputs.ali_sha }}"
            docker push "${{ steps.checkout_front.outputs.ali_staging }}"
