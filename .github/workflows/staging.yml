name: "[labelix] Staging"

on:
  push:
    branches:
      - "**"
env:
  DOCKER_REGISTRY: ghcr.io
  DOCKER_REGISTRY_ALI: registry.cn-hongkong.aliyuncs.com
  DOCKER_REGISTRY_ALI_VPC: registry-vpc.cn-hongkong.aliyuncs.com

permissions:
  actions: write
  contents: read
  packages: write

jobs:
  ensure-main:
    name: Ensure main
    runs-on: ubuntu-latest
    outputs:
      ENSURE_MAIN: ${{ steps.ensure_main.outputs.matches }}
    steps:
      - uses: actions/checkout@v6

      - name: Ensure main
        id: ensure_main
        uses: repotea-workspace/kangumi/github-actions/dyn-source@main
        with:
          repository: prtmax/labelix
          branches: main

  build-rosaceae-binaries:
    name: Build rosaceae binaries
    runs-on: ubuntu-latest
    needs:
      - ensure-main
    if: needs.ensure-main.outputs.ENSURE_MAIN == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: spectra-cli
            binary: spectra-cli
            args: --release --package spectra-cli --features=proxy-legacy
          - package: kerria-cli
            binary: kerria-cli
            args: --release --package kerria-cli --features=education-compat-api
          - package: malus-cli
            binary: malus-cli
            args: --release --package malus-cli
          - package: pyrus-cli
            binary: pyrus-cli
            args: --release --package pyrus-cli
    steps:
      - uses: actions/checkout@v6
      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: prtmax/labelix
          token: "${{ secrets.GH_TOKEN_0XFE10 }}"
          source_context: "true"

      - name: Build ${{ matrix.binary }} binary
        uses: houseabsolute/actions-rust-cross@v0
        with:
          command: build
          target: x86_64-unknown-linux-musl
          args: "${{ matrix.args }}"
          working-directory: rosaceae

      - name: Collect binaries
        working-directory: rosaceae
        run: |
          mkdir -p dist/bin
          cp target/x86_64-unknown-linux-musl/release/${{ matrix.binary }} dist/bin/${{ matrix.binary }}

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: rosaceae-binaries-${{ matrix.binary }}-x86_64-unknown-linux-musl
          path: |
            rosaceae/dist/bin/${{ matrix.binary }}
          if-no-files-found: error

  build-rosaceae-image:
    name: Build rosaceae image
    runs-on: ubuntu-latest
    needs:
      - ensure-main
      - build-rosaceae-binaries
    if: needs.ensure-main.outputs.ENSURE_MAIN == 'true'
    steps:
      - uses: actions/checkout@v6
      - name: Checkout
        id: checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: prtmax/labelix
          token: "${{ secrets.GH_TOKEN_0XFE10 }}"
          source_context: "true"
          image_name: labelix-rosaceae
          acr_namespace: xoohub

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: rosaceae-binaries-*-x86_64-unknown-linux-musl
          path: rosaceae/dist/bin
          merge-multiple: true

      - name: Ensure binary permissions
        run: chmod +x rosaceae/dist/bin/*

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: '0xfe10'
          password: ${{ secrets.GH_TOKEN_0XFE10 }}
          registry: ${{ env.DOCKER_REGISTRY }}

      - name: Docker login (Aliyun)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.CR_ALI_USERNAME_PUNCHX }}
          password: ${{ secrets.CR_ALI_PASSWORD_PUNCHX }}
          registry: ${{ env.DOCKER_REGISTRY_ALI }}

      - name: Build and push docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          provenance: false
          sbom: false
          context: rosaceae
          file: rosaceae/Dockerfile
          tags: ${{ steps.checkout.outputs.ghcr_tags }}
          labels: ${{ steps.checkout.outputs.oci_labels }}

      - name: Push to Aliyun ACR (with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 5
          retry_wait_seconds: 30
          command: |
            source_image="${{ steps.checkout.outputs.ghcr_sha_run }}"
            target_image="${{ steps.checkout.outputs.ali_image }}:${source_image##*:}"
            docker tag "$source_image" "$target_image"
            docker push "$target_image"
            docker tag ${{ steps.checkout.outputs.ghcr_sha }} ${{ steps.checkout.outputs.ali_sha }}
            docker tag ${{ steps.checkout.outputs.ghcr_sha }} ${{ steps.checkout.outputs.ali_staging }}
            docker push ${{ steps.checkout.outputs.ali_sha }}
            docker push ${{ steps.checkout.outputs.ali_staging }}

  build-camellia-image:
    name: Build camellia image
    runs-on: ubuntu-latest
    needs:
      - ensure-main
    if: needs.ensure-main.outputs.ENSURE_MAIN == 'true'
    steps:
      - uses: actions/checkout@v6
      - name: Checkout
        id: checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: prtmax/labelix
          token: "${{ secrets.GH_TOKEN_0XFE10 }}"
          source_context: "true"
          image_name: labelix-camellia
          acr_namespace: xoohub

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: '0xfe10'
          password: ${{ secrets.GH_TOKEN_0XFE10 }}
          registry: ${{ env.DOCKER_REGISTRY }}

      - name: Docker login (Aliyun)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.CR_ALI_USERNAME_PUNCHX }}
          password: ${{ secrets.CR_ALI_PASSWORD_PUNCHX }}
          registry: ${{ env.DOCKER_REGISTRY_ALI }}

      - name: Build and push docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          provenance: false
          sbom: false
          context: .
          file: theaceae/apps/camellia/Dockerfile
          tags: ${{ steps.checkout.outputs.ghcr_tags }}
          labels: ${{ steps.checkout.outputs.oci_labels }}
          secrets: |
            github_token=${{ secrets.GH_TOKEN_0XFE10 }}

      - name: Push to Aliyun ACR (with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 5
          retry_wait_seconds: 30
          command: |
            source_image="${{ steps.checkout.outputs.ghcr_sha_run }}"
            target_image="${{ steps.checkout.outputs.ali_image }}:${source_image##*:}"
            docker tag "$source_image" "$target_image"
            docker push "$target_image"
            docker tag ${{ steps.checkout.outputs.ghcr_sha }} ${{ steps.checkout.outputs.ali_sha }}
            docker tag ${{ steps.checkout.outputs.ghcr_sha }} ${{ steps.checkout.outputs.ali_staging }}
            docker push ${{ steps.checkout.outputs.ali_sha }}
            docker push ${{ steps.checkout.outputs.ali_staging }}

  build-rubus-image:
    name: Build rubus image
    runs-on: ubuntu-latest
    needs:
      - ensure-main
    if: needs.ensure-main.outputs.ENSURE_MAIN == 'true'
    steps:
      - uses: actions/checkout@v6
      - name: Checkout
        id: checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: prtmax/labelix
          token: "${{ secrets.GH_TOKEN_0XFE10 }}"
          source_context: "true"
          image_name: labelix-rubus
          acr_namespace: xoohub

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: '0xfe10'
          password: ${{ secrets.GH_TOKEN_0XFE10 }}
          registry: ${{ env.DOCKER_REGISTRY }}

      - name: Docker login (Aliyun)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.CR_ALI_USERNAME_PUNCHX }}
          password: ${{ secrets.CR_ALI_PASSWORD_PUNCHX }}
          registry: ${{ env.DOCKER_REGISTRY_ALI }}

      - name: Build and push docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          provenance: false
          sbom: false
          context: .
          file: rosaceae/cli/rubus/Dockerfile
          tags: ${{ steps.checkout.outputs.ghcr_tags }}
          labels: ${{ steps.checkout.outputs.oci_labels }}

      - name: Push to Aliyun ACR (with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 5
          retry_wait_seconds: 30
          command: |
            source_image="${{ steps.checkout.outputs.ghcr_sha_run }}"
            target_image="${{ steps.checkout.outputs.ali_image }}:${source_image##*:}"
            docker tag "$source_image" "$target_image"
            docker push "$target_image"
            docker tag ${{ steps.checkout.outputs.ghcr_sha }} ${{ steps.checkout.outputs.ali_sha }}
            docker tag ${{ steps.checkout.outputs.ghcr_sha }} ${{ steps.checkout.outputs.ali_staging }}
            docker push ${{ steps.checkout.outputs.ali_sha }}
            docker push ${{ steps.checkout.outputs.ali_staging }}

  build-ar-recognition-image:
    name: Build AR recognition image
    runs-on: ubuntu-latest
    needs:
      - ensure-main
    if: needs.ensure-main.outputs.ENSURE_MAIN == 'true'
    steps:
      - uses: actions/checkout@v6
      - name: Checkout
        id: checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: prtmax/labelix
          token: "${{ secrets.GH_TOKEN_0XFE10 }}"
          source_context: "true"
          image_name: labelix-ar-recognition
          acr_namespace: xoohub

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: '0xfe10'
          password: ${{ secrets.GH_TOKEN_0XFE10 }}
          registry: ${{ env.DOCKER_REGISTRY }}

      - name: Docker login (Aliyun)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.CR_ALI_USERNAME_PUNCHX }}
          password: ${{ secrets.CR_ALI_PASSWORD_PUNCHX }}
          registry: ${{ env.DOCKER_REGISTRY_ALI }}

      - name: Build and push docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          provenance: false
          sbom: false
          context: rosaceae/cli/ar_recognition
          file: rosaceae/cli/ar_recognition/Dockerfile
          tags: ${{ steps.checkout.outputs.ghcr_tags }}
          labels: ${{ steps.checkout.outputs.oci_labels }}

      - name: Push to Aliyun ACR (with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 5
          retry_wait_seconds: 30
          command: |
            source_image="${{ steps.checkout.outputs.ghcr_sha_run }}"
            target_image="${{ steps.checkout.outputs.ali_image }}:${source_image##*:}"
            docker tag "$source_image" "$target_image"
            docker push "$target_image"
            docker tag ${{ steps.checkout.outputs.ghcr_sha }} ${{ steps.checkout.outputs.ali_sha }}
            docker tag ${{ steps.checkout.outputs.ghcr_sha }} ${{ steps.checkout.outputs.ali_staging }}
            docker push ${{ steps.checkout.outputs.ali_sha }}
            docker push ${{ steps.checkout.outputs.ali_staging }}

  build-sorbus-image:
    name: Build sorbus image
    runs-on: ubuntu-latest
    needs:
      - ensure-main
    if: needs.ensure-main.outputs.ENSURE_MAIN == 'true'
    steps:
      - uses: actions/checkout@v6
      - name: Checkout
        id: checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: prtmax/labelix
          token: "${{ secrets.GH_TOKEN_0XFE10 }}"
          source_context: "true"
          image_name: labelix-sorbus
          acr_namespace: xoohub

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: '0xfe10'
          password: ${{ secrets.GH_TOKEN_0XFE10 }}
          registry: ${{ env.DOCKER_REGISTRY }}

      - name: Docker login (Aliyun)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.CR_ALI_USERNAME_PUNCHX }}
          password: ${{ secrets.CR_ALI_PASSWORD_PUNCHX }}
          registry: ${{ env.DOCKER_REGISTRY_ALI }}

      - name: Build and push docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          provenance: false
          sbom: false
          context: .
          file: rosaceae/cli/sorbus/Dockerfile
          tags: ${{ steps.checkout.outputs.ghcr_tags }}
          labels: ${{ steps.checkout.outputs.oci_labels }}

      - name: Push to Aliyun ACR (with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 5
          retry_wait_seconds: 30
          command: |
            source_image="${{ steps.checkout.outputs.ghcr_sha_run }}"
            target_image="${{ steps.checkout.outputs.ali_image }}:${source_image##*:}"
            docker tag "$source_image" "$target_image"
            docker push "$target_image"
            docker tag ${{ steps.checkout.outputs.ghcr_sha }} ${{ steps.checkout.outputs.ali_sha }}
            docker tag ${{ steps.checkout.outputs.ghcr_sha }} ${{ steps.checkout.outputs.ali_staging }}
            docker push ${{ steps.checkout.outputs.ali_sha }}
            docker push ${{ steps.checkout.outputs.ali_staging }}

  cleanup-rosaceae-binary-artifacts:
    name: Cleanup rosaceae binary artifacts
    runs-on: ubuntu-latest
    needs:
      - ensure-main
      - build-rosaceae-binaries
      - build-rosaceae-image
    if: ${{ always() && needs.ensure-main.outputs.ENSURE_MAIN == 'true' }}
    steps:
      - name: Delete rosaceae binary artifacts
        uses: geekyeggo/delete-artifact@v6
        with:
          name: rosaceae-binaries-*-x86_64-unknown-linux-musl
          failOnError: false
