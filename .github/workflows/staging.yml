name: "[labelab] Staging"

on:
  push:
    branches:
      - "**"

jobs:
  ensure-main:
    name: Ensure main
    runs-on: ubuntu-latest
    outputs:
      ENSURE_MAIN: ${{ steps.ensure_main.outputs.ENSURE_MAIN }}
    steps:
      - uses: actions/checkout@v6

      - name: Ensure main
        id: ensure_main
        run: |
          if grep -q 'main' .github/branch.txt; then
            echo "ENSURE_MAIN=true" >> $GITHUB_OUTPUT
          else
            echo "ENSURE_MAIN=false" >> $GITHUB_OUTPUT
          fi

  build-android:
    name: Build Android ${{ matrix.artifact.name }}
    runs-on: ubuntu-latest
    needs:
      - ensure-main
    if: needs.ensure-main.outputs.ENSURE_MAIN == 'true'
    strategy:
      matrix:
        artifact:
          - name: APK
            command: flutter build apk --release
            path: mobile/build/app/outputs/flutter-apk/app-release.apk
            upload_name: app-release-apk
    steps:
      - uses: actions/checkout@v6

      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: boxliy/labelab
          token: "${{ secrets.GH_TOKEN_0XFE10 }}"
          ref_file: .github/ref.txt

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Generate i18n (slang)
        working-directory: mobile
        run: dart run slang

      - name: Generate code (build_runner)
        working-directory: mobile
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Decode keystore
        run: |
          echo "${{ secrets.LABALAB_STG_JKS }}" | base64 --decode > $GITHUB_WORKSPACE/labelab-release.jks

      - name: Write key.properties
        run: |
          cat > mobile/android/key.properties << EOF
          storePassword=${{ secrets.LABALAB_STG_STORE_PASSWORD }}
          keyPassword=${{ secrets.LABALAB_STG_KEY_PASSWORD }}
          keyAlias=${{ secrets.LABALAB_STG_KEY_ALIAS }}
          storeFile=$GITHUB_WORKSPACE/labelab-release.jks
          EOF

      - name: Build ${{ matrix.artifact.name }}
        working-directory: mobile
        run: ${{ matrix.artifact.command }}

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact.upload_name }}
          path: ${{ matrix.artifact.path }}

  release:
    name: Create Pre-release
    runs-on: ubuntu-latest
    needs: build-android
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: ncipollo/release-action@v1
        with:
          tag: canary
          name: Canary (${{ github.ref_name }}@${{ github.sha }})
          body: |
            Branch: `${{ github.ref_name }}`
            Commit: ${{ github.sha }}
          prerelease: true
          allowUpdates: true
          removeArtifacts: true
          artifacts: dist/*
