name: "[labelix] Staging"

on:
  push:
    branches:
      - "**"
env:
  DOCKER_REGISTRY: ghcr.io
  DOCKER_REGISTRY_ALI: registry.cn-hongkong.aliyuncs.com
  DOCKER_REGISTRY_ALI_VPC: registry-vpc.cn-hongkong.aliyuncs.com

permissions:
  actions: write
  contents: read
  packages: write

jobs:
  ensure-main:
    name: Ensure main
    runs-on: ubuntu-latest
    outputs:
      ENSURE_MAIN: ${{ steps.ensure_main.outputs.ENSURE_MAIN }}
    steps:
      - uses: actions/checkout@v6

      - name: Ensure main
        id: ensure_main
        run: |
          if grep -q 'main' .github/branch.txt; then
            echo "ENSURE_MAIN=true" >> $GITHUB_OUTPUT
          else
            echo "ENSURE_MAIN=false" >> $GITHUB_OUTPUT
          fi

  build-rosaceae-binaries:
    name: Build rosaceae binaries
    runs-on: ubuntu-latest
    needs:
      - ensure-main
    if: needs.ensure-main.outputs.ENSURE_MAIN == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: spectra-cli
            binary: spectra-cli
            args: --release --package spectra-cli --features=proxy-legacy
          - package: kerria-cli
            binary: kerria-cli
            args: --release --package kerria-cli --features=education-compat-api
          - package: malus-cli
            binary: malus-cli
            args: --release --package malus-cli
          - package: pyrus-cli
            binary: pyrus-cli
            args: --release --package pyrus-cli
    steps:
      - uses: actions/checkout@v6
      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: prtmax/labelix
          token: "${{ secrets.GH_TOKEN_0XFE10 }}"
          ref_file: .github/ref.txt

      - name: Build ${{ matrix.binary }} binary
        uses: houseabsolute/actions-rust-cross@v0
        with:
          command: build
          target: x86_64-unknown-linux-musl
          args: "${{ matrix.args }}"
          working-directory: rosaceae

      - name: Collect binaries
        working-directory: rosaceae
        run: |
          mkdir -p dist/bin
          cp target/x86_64-unknown-linux-musl/release/${{ matrix.binary }} dist/bin/${{ matrix.binary }}

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: rosaceae-binaries-${{ matrix.binary }}-x86_64-unknown-linux-musl
          path: |
            rosaceae/dist/bin/${{ matrix.binary }}
          if-no-files-found: error

  build-rosaceae-image:
    name: Build rosaceae image
    runs-on: ubuntu-latest
    needs:
      - ensure-main
      - build-rosaceae-binaries
    if: needs.ensure-main.outputs.ENSURE_MAIN == 'true'
    steps:
      - uses: actions/checkout@v6
      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: prtmax/labelix
          token: "${{ secrets.GH_TOKEN_0XFE10 }}"
          ref_file: .github/ref.txt

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: rosaceae-binaries-*-x86_64-unknown-linux-musl
          path: rosaceae/dist/bin
          merge-multiple: true

      - name: Ensure binary permissions
        run: chmod +x rosaceae/dist/bin/*

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ${{ env.DOCKER_REGISTRY }}

      - name: Docker login (Aliyun)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.CR_ALI_USERNAME_PUNCHX }}
          password: ${{ secrets.CR_ALI_PASSWORD_PUNCHX }}
          registry: ${{ env.DOCKER_REGISTRY_ALI }}

      - uses: benjlevesque/short-sha@v3.0

      - name: Set repo name
        run: echo "REPO_NAME=${GITHUB_REPOSITORY//\//_}" >> $GITHUB_ENV

      - name: Set image tags
        id: tags
        run: |
          echo "ghcr_sha=${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/labelix-rosaceae:sha-${{ env.SHA }}" >> $GITHUB_OUTPUT
          echo "ghcr_staging=${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/labelix-rosaceae:staging" >> $GITHUB_OUTPUT
          echo "ali_sha=${{ env.DOCKER_REGISTRY_ALI }}/xoohub/${{ env.REPO_NAME }}_labelix-rosaceae:sha-${{ env.SHA }}" >> $GITHUB_OUTPUT
          echo "ali_staging=${{ env.DOCKER_REGISTRY_ALI }}/xoohub/${{ env.REPO_NAME }}_labelix-rosaceae:staging" >> $GITHUB_OUTPUT

      - name: Build and push docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          context: rosaceae
          file: rosaceae/Dockerfile
          tags: |
            ${{ steps.tags.outputs.ghcr_sha }}
            ${{ steps.tags.outputs.ghcr_staging }}

      - name: Push to Aliyun ACR (with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 5
          retry_wait_seconds: 30
          command: |
            docker tag ${{ steps.tags.outputs.ghcr_sha }} ${{ steps.tags.outputs.ali_sha }}
            docker tag ${{ steps.tags.outputs.ghcr_sha }} ${{ steps.tags.outputs.ali_staging }}
            docker push ${{ steps.tags.outputs.ali_sha }}
            docker push ${{ steps.tags.outputs.ali_staging }}

  build-camellia-image:
    name: Build camellia image
    runs-on: ubuntu-latest
    needs:
      - ensure-main
    if: needs.ensure-main.outputs.ENSURE_MAIN == 'true'
    steps:
      - uses: actions/checkout@v6
      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: prtmax/labelix
          token: "${{ secrets.GH_TOKEN_0XFE10 }}"
          ref_file: .github/ref.txt

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ${{ env.DOCKER_REGISTRY }}

      - name: Docker login (Aliyun)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.CR_ALI_USERNAME_PUNCHX }}
          password: ${{ secrets.CR_ALI_PASSWORD_PUNCHX }}
          registry: ${{ env.DOCKER_REGISTRY_ALI }}

      - uses: benjlevesque/short-sha@v3.0

      - name: Set repo name
        run: echo "REPO_NAME=${GITHUB_REPOSITORY//\//_}" >> $GITHUB_ENV

      - name: Set image tags
        id: tags
        run: |
          echo "ghcr_sha=${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/labelix-camellia:sha-${{ env.SHA }}" >> $GITHUB_OUTPUT
          echo "ghcr_staging=${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/labelix-camellia:staging" >> $GITHUB_OUTPUT
          echo "ali_sha=${{ env.DOCKER_REGISTRY_ALI }}/xoohub/${{ env.REPO_NAME }}_labelix-camellia:sha-${{ env.SHA }}" >> $GITHUB_OUTPUT
          echo "ali_staging=${{ env.DOCKER_REGISTRY_ALI }}/xoohub/${{ env.REPO_NAME }}_labelix-camellia:staging" >> $GITHUB_OUTPUT

      - name: Build and push docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          context: .
          file: theaceae/apps/camellia/Dockerfile
          tags: |
            ${{ steps.tags.outputs.ghcr_sha }}
            ${{ steps.tags.outputs.ghcr_staging }}
          secrets: |
            github_token=${{ secrets.GH_TOKEN_0XFE10 }}

      - name: Push to Aliyun ACR (with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 5
          retry_wait_seconds: 30
          command: |
            docker tag ${{ steps.tags.outputs.ghcr_sha }} ${{ steps.tags.outputs.ali_sha }}
            docker tag ${{ steps.tags.outputs.ghcr_sha }} ${{ steps.tags.outputs.ali_staging }}
            docker push ${{ steps.tags.outputs.ali_sha }}
            docker push ${{ steps.tags.outputs.ali_staging }}

  build-rubus-image:
    name: Build rubus image
    runs-on: ubuntu-latest
    needs:
      - ensure-main
    if: needs.ensure-main.outputs.ENSURE_MAIN == 'true'
    steps:
      - uses: actions/checkout@v6
      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: prtmax/labelix
          token: "${{ secrets.GH_TOKEN_0XFE10 }}"
          ref_file: .github/ref.txt

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ${{ env.DOCKER_REGISTRY }}

      - name: Docker login (Aliyun)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.CR_ALI_USERNAME_PUNCHX }}
          password: ${{ secrets.CR_ALI_PASSWORD_PUNCHX }}
          registry: ${{ env.DOCKER_REGISTRY_ALI }}

      - uses: benjlevesque/short-sha@v3.0

      - name: Set repo name
        run: echo "REPO_NAME=${GITHUB_REPOSITORY//\//_}" >> $GITHUB_ENV

      - name: Set image tags
        id: tags
        run: |
          echo "ghcr_sha=${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/labelix-rubus:sha-${{ env.SHA }}" >> $GITHUB_OUTPUT
          echo "ghcr_staging=${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/labelix-rubus:staging" >> $GITHUB_OUTPUT
          echo "ali_sha=${{ env.DOCKER_REGISTRY_ALI }}/xoohub/${{ env.REPO_NAME }}_labelix-rubus:sha-${{ env.SHA }}" >> $GITHUB_OUTPUT
          echo "ali_staging=${{ env.DOCKER_REGISTRY_ALI }}/xoohub/${{ env.REPO_NAME }}_labelix-rubus:staging" >> $GITHUB_OUTPUT

      - name: Build and push docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          context: .
          file: rosaceae/cli/rubus/Dockerfile
          tags: |
            ${{ steps.tags.outputs.ghcr_sha }}
            ${{ steps.tags.outputs.ghcr_staging }}

      - name: Push to Aliyun ACR (with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 5
          retry_wait_seconds: 30
          command: |
            docker tag ${{ steps.tags.outputs.ghcr_sha }} ${{ steps.tags.outputs.ali_sha }}
            docker tag ${{ steps.tags.outputs.ghcr_sha }} ${{ steps.tags.outputs.ali_staging }}
            docker push ${{ steps.tags.outputs.ali_sha }}
            docker push ${{ steps.tags.outputs.ali_staging }}

  build-rubus-image-feature-image:
    name: Build rubus image feature image
    runs-on: ubuntu-latest
    needs:
      - ensure-main
    if: needs.ensure-main.outputs.ENSURE_MAIN == 'true'
    steps:
      - uses: actions/checkout@v6
      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: prtmax/labelix
          token: "${{ secrets.GH_TOKEN_0XFE10 }}"
          ref_file: .github/ref.txt

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ${{ env.DOCKER_REGISTRY }}

      - name: Docker login (Aliyun)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.CR_ALI_USERNAME_PUNCHX }}
          password: ${{ secrets.CR_ALI_PASSWORD_PUNCHX }}
          registry: ${{ env.DOCKER_REGISTRY_ALI }}

      - uses: benjlevesque/short-sha@v3.0

      - name: Set repo name
        run: echo "REPO_NAME=${GITHUB_REPOSITORY//\//_}" >> $GITHUB_ENV

      - name: Set image tags
        id: tags
        run: |
          echo "ghcr_sha=${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/labelix-rubus-image-feature:sha-${{ env.SHA }}" >> $GITHUB_OUTPUT
          echo "ghcr_staging=${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/labelix-rubus-image-feature:staging" >> $GITHUB_OUTPUT
          echo "ali_sha=${{ env.DOCKER_REGISTRY_ALI }}/xoohub/${{ env.REPO_NAME }}_labelix-rubus-image-feature:sha-${{ env.SHA }}" >> $GITHUB_OUTPUT
          echo "ali_staging=${{ env.DOCKER_REGISTRY_ALI }}/xoohub/${{ env.REPO_NAME }}_labelix-rubus-image-feature:staging" >> $GITHUB_OUTPUT

      - name: Build and push docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          context: .
          file: rosaceae/cli/rubus-image-feature/Dockerfile
          tags: |
            ${{ steps.tags.outputs.ghcr_sha }}
            ${{ steps.tags.outputs.ghcr_staging }}

      - name: Push to Aliyun ACR (with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 5
          retry_wait_seconds: 30
          command: |
            docker tag ${{ steps.tags.outputs.ghcr_sha }} ${{ steps.tags.outputs.ali_sha }}
            docker tag ${{ steps.tags.outputs.ghcr_sha }} ${{ steps.tags.outputs.ali_staging }}
            docker push ${{ steps.tags.outputs.ali_sha }}
            docker push ${{ steps.tags.outputs.ali_staging }}

  deploy-apps:
    name: Deploy Apps
    runs-on: ubuntu-latest
    needs:
      - build-rosaceae-image
      - build-camellia-image
      - build-rubus-image
      - build-rubus-image-feature-image
    steps:
      - uses: actions/checkout@v6
      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: prtmax/labelix
          token: "${{ secrets.GH_TOKEN_0XFE10 }}"
          ref_file: .github/ref.txt

      - name: Set repo name
        run: echo "REPO_NAME=${GITHUB_REPOSITORY//\//_}" >> $GITHUB_ENV

      - uses: benjlevesque/short-sha@v3.0
      - name: Deploy
        uses: repotea-workspace/kangumi/github-actions/gitops-deploy@main
        with:
          repository: repotea-workflow/gitops-ayn
          deploy_key: "${{ secrets.DEPLOY_KEY_GITOPS_AYN }}"
          argocd_server: ${{ secrets.ARGOCD_AYN_SERVER }}
          argocd_api_token: ${{ secrets.ARGOCD_AYN_API_TOKEN }}
          app_name: apps-staging-labelix-hk0
          changes: |
            {
              "argocd/apps/labelix-hk0/overlays/staging/values.yaml": {
                "app.spectra.image": "${{ env.DOCKER_REGISTRY_ALI_VPC }}/xoohub/${{ env.REPO_NAME }}_labelix-rosaceae:sha-${{ env.SHA }}",
                "app.kerria_serve.image": "${{ env.DOCKER_REGISTRY_ALI_VPC }}/xoohub/${{ env.REPO_NAME }}_labelix-rosaceae:sha-${{ env.SHA }}",
                "app.kerria_worker.image": "${{ env.DOCKER_REGISTRY_ALI_VPC }}/xoohub/${{ env.REPO_NAME }}_labelix-rosaceae:sha-${{ env.SHA }}",
                "app.malus.image": "${{ env.DOCKER_REGISTRY_ALI_VPC }}/xoohub/${{ env.REPO_NAME }}_labelix-rosaceae:sha-${{ env.SHA }}",
                "app.pyrus.image": "${{ env.DOCKER_REGISTRY_ALI_VPC }}/xoohub/${{ env.REPO_NAME }}_labelix-rosaceae:sha-${{ env.SHA }}",
                "app.camellia.image": "${{ env.DOCKER_REGISTRY_ALI_VPC }}/xoohub/${{ env.REPO_NAME }}_labelix-camellia:sha-${{ env.SHA }}",
                "app.rubus.image": "${{ env.DOCKER_REGISTRY_ALI_VPC }}/xoohub/${{ env.REPO_NAME }}_labelix-rubus:sha-${{ env.SHA }}"
              }
            }

  cleanup-rosaceae-binary-artifacts:
    name: Cleanup rosaceae binary artifacts
    runs-on: ubuntu-latest
    needs:
      - ensure-main
      - build-rosaceae-binaries
      - build-rosaceae-image
      - deploy-apps
    if: ${{ always() && needs.ensure-main.outputs.ENSURE_MAIN == 'true' }}
    steps:
      - name: Delete rosaceae binary artifacts
        uses: geekyeggo/delete-artifact@v6
        with:
          name: rosaceae-binaries-*-x86_64-unknown-linux-musl
          failOnError: false
