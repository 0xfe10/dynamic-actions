name: "[coreprint] Staging"

on:
  push:
    branches:
      - "**"
env:
  DOCKER_REGISTRY: ghcr.io
  DOCKER_REGISTRY_ALI: registry.cn-hongkong.aliyuncs.com
  DOCKER_REGISTRY_ALI_VPC: registry-vpc.cn-hongkong.aliyuncs.com

permissions:
  actions: write
  contents: read
  packages: write

jobs:
  ensure-main:
    name: Ensure main
    runs-on: ubuntu-latest
    outputs:
      ENSURE_MAIN: ${{ steps.ensure_main.outputs.matches }}
    steps:
      - uses: actions/checkout@v6

      - name: Ensure main
        id: ensure_main
        uses: repotea-workspace/kangumi/github-actions/dyn-source@main
        with:
          repository: prtmax/coreprint-server
          branches: main

  build-metasequoia-image:
    name: Build metasequoia image
    runs-on: ubuntu-latest
    needs:
      - ensure-main
    if: needs.ensure-main.outputs.ENSURE_MAIN == 'true'
    steps:
      - uses: actions/checkout@v6
      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: prtmax/coreprint-server
          token: "${{ secrets.GH_TOKEN_0XFE10 }}"

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ${{ env.DOCKER_REGISTRY }}

      - name: Docker login (Aliyun)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.CR_ALI_USERNAME_PUNCHX }}
          password: ${{ secrets.CR_ALI_PASSWORD_PUNCHX }}
          registry: ${{ env.DOCKER_REGISTRY_ALI }}

      - uses: benjlevesque/short-sha@v3.0

      - name: Set repo name
        run: echo "REPO_NAME=${GITHUB_REPOSITORY//\//_}" >> $GITHUB_ENV

      - name: Set image tags
        id: tags
        run: |
          echo "ghcr_sha=${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/coreprint-metasequoia:sha-${{ env.SHA }}" >> $GITHUB_OUTPUT
          echo "ghcr_staging=${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/coreprint-metasequoia:staging" >> $GITHUB_OUTPUT
          echo "ali_sha=${{ env.DOCKER_REGISTRY_ALI }}/xoohub/${{ env.REPO_NAME }}_coreprint-metasequoia:sha-${{ env.SHA }}" >> $GITHUB_OUTPUT
          echo "ali_staging=${{ env.DOCKER_REGISTRY_ALI }}/xoohub/${{ env.REPO_NAME }}_coreprint-metasequoia:staging" >> $GITHUB_OUTPUT

      - name: Build and push docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          context: .
          file: admin/apps/metasequoia/Dockerfile
          tags: |
            ${{ steps.tags.outputs.ghcr_sha }}
            ${{ steps.tags.outputs.ghcr_staging }}
          secrets: |
            github_token=${{ secrets.GH_TOKEN_0XFE10 }}

      - name: Push to Aliyun ACR (with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 5
          retry_wait_seconds: 30
          command: |
            docker tag ${{ steps.tags.outputs.ghcr_sha }} ${{ steps.tags.outputs.ali_sha }}
            docker tag ${{ steps.tags.outputs.ghcr_sha }} ${{ steps.tags.outputs.ali_staging }}
            docker push ${{ steps.tags.outputs.ali_sha }}
            docker push ${{ steps.tags.outputs.ali_staging }}

  build-sequoia-image:
    name: Build sequoia image
    runs-on: ubuntu-latest
    needs:
      - ensure-main
    if: needs.ensure-main.outputs.ENSURE_MAIN == 'true'
    steps:
      - uses: actions/checkout@v6
      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: prtmax/coreprint-server
          token: "${{ secrets.GH_TOKEN_0XFE10 }}"

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ${{ env.DOCKER_REGISTRY }}

      - name: Docker login (Aliyun)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.CR_ALI_USERNAME_PUNCHX }}
          password: ${{ secrets.CR_ALI_PASSWORD_PUNCHX }}
          registry: ${{ env.DOCKER_REGISTRY_ALI }}

      - uses: benjlevesque/short-sha@v3.0

      - name: Set repo name
        run: echo "REPO_NAME=${GITHUB_REPOSITORY//\//_}" >> $GITHUB_ENV

      - name: Set image tags
        id: tags
        run: |
          echo "ghcr_sha=${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/labelix-sequoia:sha-${{ env.SHA }}" >> $GITHUB_OUTPUT
          echo "ghcr_staging=${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/labelix-sequoia:staging" >> $GITHUB_OUTPUT
          echo "ali_sha=${{ env.DOCKER_REGISTRY_ALI }}/xoohub/${{ env.REPO_NAME }}_labelix-sequoia:sha-${{ env.SHA }}" >> $GITHUB_OUTPUT
          echo "ali_staging=${{ env.DOCKER_REGISTRY_ALI }}/xoohub/${{ env.REPO_NAME }}_labelix-sequoia:staging" >> $GITHUB_OUTPUT

      - name: Build and push docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          context: .
          file: client/sequoia/Dockerfile
          tags: |
            ${{ steps.tags.outputs.ghcr_sha }}
            ${{ steps.tags.outputs.ghcr_staging }}

      - name: Push to Aliyun ACR (with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 5
          retry_wait_seconds: 30
          command: |
            docker tag ${{ steps.tags.outputs.ghcr_sha }} ${{ steps.tags.outputs.ali_sha }}
            docker tag ${{ steps.tags.outputs.ghcr_sha }} ${{ steps.tags.outputs.ali_staging }}
            docker push ${{ steps.tags.outputs.ali_sha }}
            docker push ${{ steps.tags.outputs.ali_staging }}

  deploy-apps:
    name: Deploy Apps
    runs-on: ubuntu-latest
    needs:
      - ensure-main
      - build-metasequoia-image
      - build-sequoia-image
    if: needs.ensure-main.outputs.ENSURE_MAIN == 'true'
    steps:
      - uses: actions/checkout@v6
      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: prtmax/coreprint-server
          token: "${{ secrets.GH_TOKEN_0XFE10 }}"

      - name: Set repo name
        run: echo "REPO_NAME=${GITHUB_REPOSITORY//\//_}" >> $GITHUB_ENV

      - uses: benjlevesque/short-sha@v3.0
      - name: Deploy
        uses: repotea-workspace/kangumi/github-actions/gitops-deploy@main
        with:
          repository: repotea-workflow/gitops-ayn
          deploy_key: "${{ secrets.DEPLOY_KEY_GITOPS_AYN }}"
          changes: |
            {
              "argocd/apps/coreprint-hk0/overlays/staging/values.yaml": {
                "app.metasequoia.image": "${{ env.DOCKER_REGISTRY_ALI_VPC }}/xoohub/${{ env.REPO_NAME }}_coreprint-metasequoia:sha-${{ env.SHA }}",
                "app.sequoia.image": "${{ env.DOCKER_REGISTRY_ALI_VPC }}/xoohub/${{ env.REPO_NAME }}_labelix-sequoia:sha-${{ env.SHA }}"
              }
            }
