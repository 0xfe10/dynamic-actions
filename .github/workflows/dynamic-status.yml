name: Reconcile dynamic CI status
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && format('Status report · Manual · {0}', inputs.execution_sha)
      || format('Status report · {0} · {1} · {2}',
          github.event.workflow_run.head_branch,
          github.event.workflow_run.name,
          github.event.action == 'completed'
            && format('Completed ({0})', github.event.workflow_run.conclusion)
            || (github.event.workflow_run.run_attempt > 1
                && format('Rerun #{0}', github.event.workflow_run.run_attempt)
                || 'Initial start (skipped)')) }}
on:
  workflow_run:
    workflows: ['**']
    branches-ignore: ['main']
    types: [in_progress, completed]
  workflow_dispatch:
    inputs:
      execution_sha:
        description: Full execution SHA to reconcile
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  reconcile:
    # First starts already have source dispatch pending; reruns must reset
    # the previous result. Receipt completion also closes upload/event races.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.action == 'completed' ||
      (github.event.action == 'in_progress' &&
       github.event.workflow_run.run_attempt > 1)
    runs-on: ubuntu-latest
    # Missing required workflows retain their configured grace (up to 1 hour).
    # Ordinary results return immediately; no periodic scan is installed.
    timeout-minutes: 75
    concurrency:
      # A newer event for the same immutable batch can replace a pending one;
      # every invocation reconciles the whole batch. Other batches cannot.
      group: dynamic-status-${{ github.event.workflow_run.head_sha || inputs.execution_sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Resolve source credential group
        id: route
        uses: repotea-workspace/kangumi/github-actions/dyn-status@main
        with:
          mode: route
          config: .github/dynamic-status.yml
          execution-token: ${{ github.token }}
      - name: Report workflow status
        if: steps.route.outputs.matched == 'true'
        uses: repotea-workspace/kangumi/github-actions/dyn-status@main
        with:
          mode: report
          config: .github/dynamic-status.yml
          credential-group: ${{ steps.route.outputs.group }}
          execution-token: ${{ github.token }}
          source-token: ${{ secrets[steps.route.outputs.secret_name] }}
