name: Reconcile dynamic CI status
on:
  workflow_run:
    workflows: ['**']
    # Source branches and forwarded tags are discovered from source-owned run
    # artifacts. Never react to this receiver's own default-branch runs.
    branches-ignore: ['main']
    types: [requested, in_progress, completed]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      execution_sha:
        description: Optional full execution SHA; empty scans the last 48 hours
        required: false
        type: string
permissions:
  contents: read
  actions: read
jobs:
  reconcile:
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: default
            token: GH_TOKEN_0XFE10
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: dynamic-status-${{ matrix.group }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: repotea-workspace/kangumi/github-actions/dyn-status@5f475b17868960dc5727a778d50d5875d8380a5f
        with:
          config: .github/dynamic-status.json
          credential-group: ${{ matrix.group }}
          execution-token: ${{ github.token }}
          source-token: ${{ secrets[matrix.token] }}
