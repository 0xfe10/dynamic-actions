name: "[maprintrace] Deploy"

on:
  push:
    branches:
      - "**"

jobs:
  ensure-main:
    name: Ensure main
    runs-on: ubuntu-latest
    outputs:
      ENSURE_MAIN: ${{ steps.ensure_main.outputs.ENSURE_MAIN }}
    steps:
      - uses: actions/checkout@v4

      - name: Ensure main
        id: ensure_main
        run: |
          if grep -q 'main' .github/branch.txt; then
            echo "ENSURE_MAIN=true" >> $GITHUB_OUTPUT
          else
            echo "ENSURE_MAIN=false" >> $GITHUB_OUTPUT
          fi

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs:
      - ensure-main
    if: needs.ensure-main.outputs.ENSURE_MAIN == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Checkout
        uses: fewensa/actions/clone-dyn@main
        with:
          repository: prtmax/maprintrace
          token: "${{ secrets.GH_TOKEN_0XFE10 }}"
          ref_file: .github/ref.txt

      - uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm i -g pnpm
          pnpm install

      - name: Build
        run: pnpm build

      - name: Prepare Project Config
        run: |
          mv vercel.json out/

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: benjlevesque/short-sha@v1.2

      - name: Publish docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          context: .
          file: docker/Dockerfile
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}]/maprintrace:sha-${{ env.SHA }}
            ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}]/maprintrace:staging
            ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}]/maprintrace:latest

      - uses: darwinia-network/devops/actions/smart-vercel@main
        name: Deploy to Vercel
        with:
          vercel_token: ${{ secrets.VERCEL_TOKEN }}
          vercel_group: provence
          preview_output: true
          project_name: maprintrace
          dist_path: out
          prod_mode: true
          script_run: false
