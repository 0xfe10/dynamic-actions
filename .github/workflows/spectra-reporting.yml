name: '[labelix] Spectra reporting'
env:
  DOCKER_REGISTRY: ghcr.io
  DOCKER_REGISTRY_ALI: registry.cn-hongkong.aliyuncs.com
  DOCKER_REGISTRY_ALI_VPC: registry-vpc.cn-hongkong.aliyuncs.com
permissions:
  actions: write
  contents: read
  packages: write
jobs:
  build-rosaceae-binaries:
    name: Build rosaceae binaries
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - package: spectra-cli
          binary: spectra-cli
          args: --release --package spectra-cli --features=proxy-legacy
    steps:
    - uses: actions/checkout@v6
    - name: Checkout
      uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
      with:
        repository: prtmax/labelix
        token: ${{ secrets.GH_TOKEN_0XFE10 }}
        source_context: 'true'
    - name: Build ${{ matrix.binary }} binary
      uses: houseabsolute/actions-rust-cross@v0
      with:
        command: build
        target: x86_64-unknown-linux-musl
        args: ${{ matrix.args }}
        working-directory: rosaceae
    - name: Collect binaries
      working-directory: rosaceae
      run: 'mkdir -p dist/bin

        cp target/x86_64-unknown-linux-musl/release/${{ matrix.binary }} dist/bin/${{ matrix.binary }}

        '
    - name: Upload binaries
      uses: actions/upload-artifact@v4
      with:
        name: rosaceae-binaries-${{ matrix.binary }}-x86_64-unknown-linux-musl
        path: 'rosaceae/dist/bin/${{ matrix.binary }}

          '
        if-no-files-found: error
  build-rosaceae-image:
    name: Build rosaceae image
    runs-on: ubuntu-latest
    needs:
    - build-rosaceae-binaries
    steps:
    - uses: actions/checkout@v6
    - name: Checkout
      uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
      with:
        repository: prtmax/labelix
        token: ${{ secrets.GH_TOKEN_0XFE10 }}
        source_context: 'true'
        image_name: labelix-spectra-reporting
        acr_namespace: xoohub
      id: checkout
    - name: Download binaries
      uses: actions/download-artifact@v4
      with:
        pattern: rosaceae-binaries-*-x86_64-unknown-linux-musl
        path: rosaceae/dist/bin
        merge-multiple: true
    - name: Ensure binary permissions
      run: chmod +x rosaceae/dist/bin/*
    - name: Docker login
      uses: docker/login-action@v3
      with:
        username: '0xfe10'
        password: ${{ secrets.GH_TOKEN_0XFE10 }}
        registry: ${{ env.DOCKER_REGISTRY }}
    - name: Docker login (Aliyun)
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.CR_ALI_USERNAME_PUNCHX }}
        password: ${{ secrets.CR_ALI_PASSWORD_PUNCHX }}
        registry: ${{ env.DOCKER_REGISTRY_ALI }}
    - name: Build and push docker image
      uses: docker/build-push-action@v6
      with:
        push: true
        context: rosaceae
        file: rosaceae/Dockerfile
        tags: ${{ steps.checkout.outputs.ghcr_tags }}
        provenance: false
        sbom: false
        labels: ${{ steps.checkout.outputs.oci_labels }}
    - name: Push to Aliyun ACR (with retry)
      uses: nick-fields/retry@v3
      with:
        timeout_minutes: 10
        max_attempts: 5
        retry_wait_seconds: 30
        command: 'set -euo pipefail

          docker tag ${{ steps.checkout.outputs.ghcr_sha }} ${{ steps.checkout.outputs.ali_image }}:$SOURCE_TAG

          docker tag ${{ steps.checkout.outputs.ghcr_sha }} ${{ steps.checkout.outputs.ali_sha }}

          docker tag ${{ steps.checkout.outputs.ghcr_sha }} ${{ steps.checkout.outputs.ali_latest }}

          docker push ${{ steps.checkout.outputs.ali_image }}:$SOURCE_TAG

          docker push ${{ steps.checkout.outputs.ali_sha }}

          docker push ${{ steps.checkout.outputs.ali_latest }}

          '
'on':
  push:
    tags:
    - v*-labelix
