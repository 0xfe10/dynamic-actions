name: "[orion] Foundation checks"

on:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: prtmax/orion
          token: ${{ secrets.GH_TOKEN_0XFE10 }}
      - name: Read the pinned Flutter version
        id: toolchain
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          version = json.loads(Path('.fvmrc').read_text())['flutter']
          print(f'flutter={version}')
          PY
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: ${{ steps.toolchain.outputs.flutter }}
          channel: stable
      - name: Resolve dependencies including the private printer SDK
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_0XFE10 }}
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: credential.https://github.com.helper
          GIT_CONFIG_VALUE_0: "!gh auth git-credential"
        run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze --no-pub
      - name: Check frozen app assembly contracts
        run: python3 -m unittest discover -s tools/app_assembler -p 'test_*.py'
      - run: dart run melos exec --dir-exists=test --concurrency=1 -- flutter test --no-pub
