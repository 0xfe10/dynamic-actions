name: '[aynhub] Check'

on:
  push:
    branches:
      - '**'

jobs:
  check-launcher:
    name: Check launcher
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          # - ubuntu-latest
          - windows-latest
        launcher:
          - launcher-hatch
          - launcher-code
    steps:
      - uses: actions/checkout@v4
      - name: Checkout
        uses: fewensa/actions/clone-dyn@main
        with:
          repository: prtmax/aynhub
          token: '${{ secrets.GH_TOKEN_0XFE10 }}'
          ref_file: .github/ref.txt

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check build
        run: |
          pnpm install
          pnpm --filter @aynhub/${{ matrix.launcher }} build

