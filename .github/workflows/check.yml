name: '[psdk] Check'

on:
  push:
    branches:
      - '**'

env:
  RUST_TOOLCHAIN: stable

jobs:

  check-java:
    name: Check psdk-java
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Maven Action
        uses: s4u/setup-maven-action@v1.19.0
        with:
          java-version: 17
          maven-version: 3.9.11
          checkout-enabled: false
      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: prtmax/psdk
          token: '${{ secrets.GH_TOKEN_0XFE10 }}'
          ref_file: .github/ref.txt


      - name: Check psdk
        working-directory: java
        run: mvn clean package -Dmaven.test.skip=true

      # - uses: fewensa/actions/tepusher@main
      #   if: failure()
      #   with:
      #     template: .maintain/notify/check-failed.md
      #     token: ${{ secrets.WEPLUSBOT_TOKEN }}
      #     receiver: "#d8bb7fbacf0849f1bb7fcc89a878a1a0"
      #     vars: |
      #       project: psdk
      #       language: java

  check-rust:
    name: Check psdk-rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: prtmax/psdk
          token: '${{ secrets.GH_TOKEN_0XFE10 }}'
          ref_file: .github/ref.txt

      - name: Install rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Rust clippy
        working-directory: rust
        run: cargo clippy -- -D warnings

      - name: Check psdk
        working-directory: rust
        run: cargo build

      # - uses: fewensa/actions/tepusher@main
      #   if: failure()
      #   with:
      #     template: .maintain/notify/check-failed.md
      #     token: ${{ secrets.WEPLUSBOT_TOKEN }}
      #     receiver: "#d8bb7fbacf0849f1bb7fcc89a878a1a0"
      #     vars: |
      #       project: psdk
      #       language: rust

  check-clang:
    name: Check psdk-clang
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: prtmax/psdk
          token: '${{ secrets.GH_TOKEN_0XFE10 }}'
          ref_file: .github/ref.txt

      - name: Make
        working-directory: clang
        run: |
          cd compatible/hjinfo
          ./scripts/build.sh

  check-dart:
    name: Check psdk-dart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: prtmax/psdk
          token: '${{ secrets.GH_TOKEN_0XFE10 }}'
          ref_file: .github/ref.txt

      - name: Setup Flutter SDK
        uses: flutter-actions/setup-flutter@v3
        with:
          channel: stable

      - name: Setup melos
        run: dart pub global activate melos

      - name: Lint psdk
        working-directory: dart
        run: |
          melos bootstrap
          melos run lint:all --no-select

      - name: Check psdk
        working-directory: dart
        run: |
          melos bootstrap
          melos run test --no-select

      # - uses: fewensa/actions/tepusher@main
      #   if: failure()
      #   with:
      #     template: .maintain/notify/check-failed.md
      #     token: ${{ secrets.WEPLUSBOT_TOKEN }}
      #     receiver: "#d8bb7fbacf0849f1bb7fcc89a878a1a0"
      #     vars: |
      #       project: psdk
      #       language: dart

  check-js:
    name: Check psdk-js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: prtmax/psdk
          token: '${{ secrets.GH_TOKEN_0XFE10 }}'
          ref_file: .github/ref.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check psdk
        working-directory: js
        run: |
          yarn install
          npm run build:all
          npm run package:all
          npm run test:all

      # - uses: fewensa/actions/tepusher@main
      #   if: failure()
      #   with:
      #     template: .maintain/notify/check-failed.md
      #     token: ${{ secrets.WEPLUSBOT_TOKEN }}
      #     receiver: "#d8bb7fbacf0849f1bb7fcc89a878a1a0"
      #     vars: |
      #       project: psdk
      #       language: js

