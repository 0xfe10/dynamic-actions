name: '[labeldesktop] Check'

on:
  push:
    branches:
      - '**'

jobs:

  check:
    name: Check
    strategy:
      matrix:
        os:
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v2
      - name: Checkout
        uses: fewensa/actions/clone-any@main
        with:
          platform: gitlab
          repository: prtmax/labeldesktop
          access_token: '${{ secrets.GITLAB_TOKEN }}'
          ref_file: .github/ref.txt

      - name: Setup Flutter SDK
        uses: flutter-actions/setup-flutter@v3
        with:
          channel: stable
          #version: 3.24.4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Test deps
        run: |
          rustc --version
          cargo --version
          flutter --version

      - name: Setup git credential
        run: |
          git config --global credential.helper store
          echo 'https://${{ secrets.GITLAB_TOKEN }}@gitlab.com' > ~/.git-credentials

      - name: Install deps
        run: |
          flutter pub global activate get_cli
          flutter pub upgrade
          get generate locales assets/locales

      - name: Check build
        if: matrix.os == 'windows-latest'
        run: flutter build windows

      - name: Compile Installer
        if: matrix.os == 'windows-latest'
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.4
        with:
          path: labeldesktop.iss
          options: /O+

      - name: Check build
        if: matrix.os == 'macos-latest'
        run: flutter build macos


