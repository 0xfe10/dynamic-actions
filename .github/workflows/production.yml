name: "[image-review] Production"

on:
  push:
    tags:
      - "v*-image-review"

env:
  DOCKER_REGISTRY: ghcr.io
  DOCKER_REGISTRY_ALI: crpi-uhy920dintikwpn3.cn-shenzhen.personal.cr.aliyuncs.com
  DOCKER_REGISTRY_ALI_VPC: crpi-uhy920dintikwpn3-vpc.cn-shenzhen.personal.cr.aliyuncs.com
  DOCKER_REGISTRY_ALI_HK: registry.cn-hongkong.aliyuncs.com
  DOCKER_REGISTRY_ALI_HK_VPC: registry-vpc.cn-hongkong.aliyuncs.com

permissions:
  actions: write
  contents: read
  packages: write

jobs:
  build-app:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Checkout
        id: checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: prtmax/Image-review
          token: "${{ secrets.GH_TOKEN_0XFE10 }}"
          source_context: "true"
          image_name: image-review
          acr_namespace: coohub

      - name: Docker login (GHCR)
        uses: docker/login-action@v3
        with:
          username: '0xfe10'
          password: ${{ secrets.GH_TOKEN_0XFE10 }}
          registry: ${{ env.DOCKER_REGISTRY }}

      - name: Docker login (Aliyun)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.CR_ALI_USERNAME_JOECHOW }}
          password: ${{ secrets.CR_ALI_PASSWORD_JOECHOW }}
          registry: ${{ env.DOCKER_REGISTRY_ALI }}

      - name: Docker login (Aliyun HK)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.CR_ALI_USERNAME_PUNCHX }}
          password: ${{ secrets.CR_ALI_PASSWORD_PUNCHX }}
          registry: ${{ env.DOCKER_REGISTRY_ALI_HK }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          provenance: false
          sbom: false
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.checkout.outputs.ghcr_tags }}
          labels: ${{ steps.checkout.outputs.oci_labels }}

      - name: Push to Aliyun ACR (with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 5
          retry_wait_seconds: 30
          command: |
            source_image="${{ steps.checkout.outputs.ghcr_sha }}"
            docker buildx imagetools create -t "${{ steps.checkout.outputs.ali_image }}:${{ env.SOURCE_TAG }}" "$source_image"
            docker buildx imagetools create -t "${{ steps.checkout.outputs.ali_sha }}" "$source_image"
            docker buildx imagetools create -t "${{ steps.checkout.outputs.ali_latest }}" "$source_image"
            docker buildx imagetools create -t "${{ env.DOCKER_REGISTRY_ALI_HK }}/xoohub/${{ env.REPO_NAME }}_image-review:${{ env.SOURCE_TAG }}" "$source_image"
            docker buildx imagetools create -t "${{ env.DOCKER_REGISTRY_ALI_HK }}/xoohub/${{ env.REPO_NAME }}_image-review:sha-${{ env.SHORT_SHA }}" "$source_image"
            docker buildx imagetools create -t "${{ env.DOCKER_REGISTRY_ALI_HK }}/xoohub/${{ env.REPO_NAME }}_image-review:latest" "$source_image"
