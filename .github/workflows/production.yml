name: '[guestkey] Production'

on:
  push:
    tags:
      - "v*-guestkey"
env:
  DOCKER_REGISTRY: ghcr.io

jobs:

  build-apps:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - api
          - vision
    steps:
      - uses: actions/checkout@v4
      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: prtmax/guestkey
          token: '${{ secrets.GH_TOKEN_0XFE10 }}'
          ref_file: .github/ref.txt

      - name: Check
        run: |
          ls -la
          ls -la docker

      - name: Docker login
        uses: docker/login-action@v1
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ${{ env.DOCKER_REGISTRY }}

      - uses: benjlevesque/short-sha@v3.0

      - name: Publish docker image hash
        uses: docker/build-push-action@v6
        with:
          push: true
          context: .
          file: docker/${{ matrix.package }}.Dockerfile
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/guestkey-${{ matrix.package }}:sha-${{ env.SHA }}
            ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/guestkey-${{ matrix.package }}:latest

  deploy-apps:
    name: Deploy Apps
    runs-on: ubuntu-latest
    needs:
      - build-apps
    steps:
      - uses: actions/checkout@v5
      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: prtmax/guestkey
          token: '${{ secrets.GH_TOKEN_0XFE10 }}'
          ref_file: .github/ref.txt

      - uses: benjlevesque/short-sha@v3.0
      - name: Deploy
        uses: repotea-workspace/kangumi/github-actions/gitops-deploy@main
        with:
          repository: repotea-workflow/gitops-ayn
          deploy_key: '${{ secrets.DEPLOY_KEY_GITOPS_AYN }}'
          argocd_server: ${{ secrets.ARGOCD_AYN_SERVER }}
          argocd_api_token: ${{ secrets.ARGOCD_AYN_API_TOKEN }}
          app_name: apps-production-suite-hk0
          changes: |
            {
              "argocd/apps/suite-hk0/overlays/production/guestkey/api/deployment-patch.yaml": {
                "[1].value": "${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/guestkey-api:sha-${{ env.SHA }}"
              },
              "argocd/apps/suite-hk0/overlays/production/guestkey/vision/deployment-patch.yaml": {
                "[1].value": "${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/guestkey-vision:sha-${{ env.SHA }}"
              }
            }
