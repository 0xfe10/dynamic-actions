name: '[qurator] Production'

on:
  push:
    tags:
      - "v*-qurator"
env:
  DOCKER_REGISTRY: ghcr.io

jobs:

  build-apps:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - api
          - frontend
    steps:
      - uses: actions/checkout@v4
      - name: Checkout
        uses: fewensa/actions/clone-dyn@main
        with:
          repository: prtmax/qurator
          token: '${{ secrets.GH_TOKEN_0XFE10 }}'
          ref_file: .github/ref.txt

      - name: Check
        working-directory: ${{ matrix.package }}
        run: |
          ls -la

      - name: Docker login
        uses: docker/login-action@v1
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ${{ env.DOCKER_REGISTRY }}

      - uses: benjlevesque/short-sha@v3.0

      - name: Publish docker image hash
        uses: docker/build-push-action@v6
        with:
          push: true
          context: ${{ matrix.package }}
          file: ${{ matrix.package }}/Dockerfile
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/qurator-${{ matrix.package }}:latest
            ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/qurator-${{ matrix.package }}:sha-${{ env.SHA }}

