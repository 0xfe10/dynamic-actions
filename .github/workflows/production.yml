name: "[onestore] Production"

on:
  push:
    tags:
      - "v*-onestore"
env:
  DOCKER_REGISTRY: ghcr.io
  DOCKER_REGISTRY_ALI_HK: registry.cn-hongkong.aliyuncs.com
  DOCKER_REGISTRY_ALI_HK_VPC: registry-vpc.cn-hongkong.aliyuncs.com
  DOCKER_REGISTRY_ALI_SZ: crpi-uhy920dintikwpn3.cn-shenzhen.personal.cr.aliyuncs.com
  DOCKER_REGISTRY_ALI_SZ_VPC: crpi-uhy920dintikwpn3-vpc.cn-shenzhen.personal.cr.aliyuncs.com

permissions:
  actions: write
  contents: read
  packages: write

jobs:
  build-onestore:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - name: histore
            dockerfile: Dockerfile
            region: hk
            namespace: xoohub
    steps:
      - uses: actions/checkout@v6
      - name: Checkout
        id: checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: prtmax/onestore
          token: "${{ secrets.GH_TOKEN_0XFE10 }}"
          source_context: "true"
          image_name: onestore-${{ matrix.package.name }}
          acr_registry: ${{ matrix.package.region == 'hk' && env.DOCKER_REGISTRY_ALI_HK || env.DOCKER_REGISTRY_ALI_SZ }}
          acr_namespace: ${{ matrix.package.namespace }}

      - name: Check
        working-directory: ${{ matrix.package.name }}
        run: |
          ls -la

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: '0xfe10'
          password: ${{ secrets.GH_TOKEN_0XFE10 }}
          registry: ${{ env.DOCKER_REGISTRY }}

      - name: Docker login (Aliyun HK)
        if: matrix.package.region == 'hk'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.CR_ALI_USERNAME_PUNCHX }}
          password: ${{ secrets.CR_ALI_PASSWORD_PUNCHX }}
          registry: ${{ env.DOCKER_REGISTRY_ALI_HK }}

      - name: Docker login (Aliyun SZ)
        if: matrix.package.region == 'sz'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.CR_ALI_USERNAME_JOECHOW }}
          password: ${{ secrets.CR_ALI_PASSWORD_JOECHOW }}
          registry: ${{ env.DOCKER_REGISTRY_ALI_SZ }}

      - name: Publish docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          context: ${{ matrix.package.name }}
          file: ${{ matrix.package.name }}/${{ matrix.package.dockerfile }}
          provenance: false
          sbom: false
          tags: ${{ steps.checkout.outputs.ghcr_tags }}
          labels: ${{ steps.checkout.outputs.oci_labels }}

      - name: Push to Aliyun ACR (with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 5
          retry_wait_seconds: 30
          command: |
            docker tag ${{ steps.checkout.outputs.ghcr_sha }} ${{ steps.checkout.outputs.ali_image }}:${{ env.SOURCE_TAG }}
            docker tag ${{ steps.checkout.outputs.ghcr_sha }} ${{ steps.checkout.outputs.ali_sha }}
            docker tag ${{ steps.checkout.outputs.ghcr_sha }} ${{ steps.checkout.outputs.ali_latest }}
            docker push ${{ steps.checkout.outputs.ali_image }}:${{ env.SOURCE_TAG }}
            docker push ${{ steps.checkout.outputs.ali_sha }}
            docker push ${{ steps.checkout.outputs.ali_latest }}
