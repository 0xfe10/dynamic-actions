name: "[sampleyard] Production"

on:
  push:
    tags:
      - "v*-sampleyard"

jobs:
  test-demo:
    name: Test Demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@6342e5b00d730c134699b734cdb100988af58ee0
        with:
          repository: boxliy/sampleyard
          token: "${{ secrets.GH_TOKEN_0XFE10 }}"

      - name: Test swallow
        run: npm test --prefix aviary/swallow
