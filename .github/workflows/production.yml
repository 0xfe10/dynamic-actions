name: '[sw-aiot] Production'

on:
  push:
    tags:
      - "v*-sw-aiot"
env:
  DOCKER_REGISTRY: ghcr.io
  DOCKER_REGISTRY_ALI_HK: registry.cn-hongkong.aliyuncs.com
  DOCKER_REGISTRY_ALI_HK_VPC: registry-vpc.cn-hongkong.aliyuncs.com
  DOCKER_REGISTRY_ALI_SZ: crpi-uhy920dintikwpn3.cn-shenzhen.personal.cr.aliyuncs.com
  DOCKER_REGISTRY_ALI_SZ_VPC: crpi-uhy920dintikwpn3-vpc.cn-shenzhen.personal.cr.aliyuncs.com

jobs:

  build-apps:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: prtmax/sw-aiot
          token: '${{ secrets.GH_TOKEN_0XFE10 }}'
          ref_file: .github/ref.txt

      - name: Check
        run: |
          ls -la

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ${{ env.DOCKER_REGISTRY }}

      - name: Docker login (Aliyun HK)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.CR_ALI_USERNAME_PUNCHX }}
          password: ${{ secrets.CR_ALI_PASSWORD_PUNCHX }}
          registry: ${{ env.DOCKER_REGISTRY_ALI_HK }}

      - uses: benjlevesque/short-sha@v3.0

      - name: Set repo name
        run: echo "REPO_NAME=${GITHUB_REPOSITORY//\//_}" >> $GITHUB_ENV

      - name: Set image tags
        id: tags
        run: |
          echo "ghcr_sha=${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/sw-aiot:sha-${{ env.SHA }}" >> $GITHUB_OUTPUT
          echo "ghcr_latest=${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/sw-aiot:latest" >> $GITHUB_OUTPUT
          echo "ali_sha=${{ env.DOCKER_REGISTRY_ALI_HK }}/xoohub/${{ env.REPO_NAME }}_sw-aiot:sha-${{ env.SHA }}" >> $GITHUB_OUTPUT
          echo "ali_latest=${{ env.DOCKER_REGISTRY_ALI_HK }}/xoohub/${{ env.REPO_NAME }}_sw-aiot:latest" >> $GITHUB_OUTPUT

      - name: Publish docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          context: .
          file: Dockerfile
          tags: |
            ${{ steps.tags.outputs.ghcr_sha }}
            ${{ steps.tags.outputs.ghcr_latest }}

      # - name: Push to Aliyun ACR (with retry)
      #   uses: nick-fields/retry@v3
      #   with:
      #     timeout_minutes: 10
      #     max_attempts: 5
      #     retry_wait_seconds: 30
      #     command: |
      #       docker tag ${{ steps.tags.outputs.ghcr_sha }} ${{ steps.tags.outputs.ali_sha }}
      #       docker tag ${{ steps.tags.outputs.ghcr_sha }} ${{ steps.tags.outputs.ali_latest }}
      #       docker push ${{ steps.tags.outputs.ali_sha }}
      #       docker push ${{ steps.tags.outputs.ali_latest }}

  deploy-apps:
    name: Deploy Apps
    runs-on: ubuntu-latest
    needs:
      - build-apps
    steps:
      - uses: actions/checkout@v6
      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: prtmax/sw-aiot
          token: '${{ secrets.GH_TOKEN_0XFE10 }}'
          ref_file: .github/ref.txt

      - uses: benjlevesque/short-sha@v3.0

      - name: Set repo name
        run: echo "REPO_NAME=${GITHUB_REPOSITORY//\//_}" >> $GITHUB_ENV

      - name: Deploy
        uses: repotea-workspace/kangumi/github-actions/gitops-deploy@main
        with:
          repository: repotea-workflow/gitops-ayn
          deploy_key: '${{ secrets.DEPLOY_KEY_GITOPS_AYN }}'
          argocd_server: ${{ secrets.ARGOCD_AYN_SERVER }}
          argocd_api_token: ${{ secrets.ARGOCD_AYN_API_TOKEN }}
          app_name: labelix-production-openapps-hk0
          changes: |
            {
              "argocd/labelix/openapps-hk0/overlays/production/sw-aiot/deployment-patch.yaml": {
                "[0].value": "${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/sw-aiot:sha-${{ env.SHA }}"
              }
            }

