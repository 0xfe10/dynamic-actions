name: '[openapps] Production'

on:
  push:
    tags:
      - "v*-openapps"
env:
  DOCKER_REGISTRY: ghcr.io

jobs:

  build-openapps:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - name: erpfastprint
            dockerfile: Dockerfile
          - name: maprintrace
            dockerfile: docker/Dockerfile
    steps:
      - uses: actions/checkout@v5
      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: prtmax/openapps
          token: '${{ secrets.GH_TOKEN_0XFE10 }}'
          ref_file: .github/ref.txt

      - name: Check
        working-directory: ${{ matrix.package.name }}
        run: |
          ls -la

      - name: Docker login
        uses: docker/login-action@v1
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ${{ env.DOCKER_REGISTRY }}

      - uses: benjlevesque/short-sha@v3.0

      - name: Publish docker image hash
        uses: docker/build-push-action@v6
        with:
          push: true
          context: ${{ matrix.package.name }}
          file: ${{ matrix.package.name }}/${{ matrix.package.dockerfile }}
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/openapps-${{ matrix.package.name }}:sha-${{ env.SHA }}
            ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/openapps-${{ matrix.package.name }}:latest

