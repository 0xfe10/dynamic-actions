name: "[openapps] Production"

on:
  push:
    tags:
      - "v*-openapps"
env:
  DOCKER_REGISTRY: ghcr.io
  DOCKER_REGISTRY_ALI_HK: registry.cn-hongkong.aliyuncs.com
  DOCKER_REGISTRY_ALI_HK_VPC: registry-vpc.cn-hongkong.aliyuncs.com
  DOCKER_REGISTRY_ALI_SZ: crpi-uhy920dintikwpn3.cn-shenzhen.personal.cr.aliyuncs.com
  DOCKER_REGISTRY_ALI_SZ_VPC: crpi-uhy920dintikwpn3-vpc.cn-shenzhen.personal.cr.aliyuncs.com

jobs:
  build-keycloak-theme:
    name: Build Keycloak Theme
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: prtmax/openapps
          token: "${{ secrets.GH_TOKEN_0XFE10 }}"
          ref_file: .github/ref.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        working-directory: keycloak-theme-ayn
        run: pnpm install --frozen-lockfile

      - name: Build Keycloak theme
        working-directory: keycloak-theme-ayn
        run: pnpm build-keycloak-theme

      - name: Check build output
        working-directory: keycloak-theme-ayn
        run: |
          echo "=== Build output ==="
          ls -lh dist_keycloak/
          echo "=== JAR file details ==="
          find dist_keycloak/ -name "*.jar" -exec ls -lh {} \;

      - uses: benjlevesque/short-sha@v3.0

      - name: Set version
        id: version
        run: |
          # 从 tag 中提取版本号 (例如: v1.0.0-openapps -> v1.0.0)
          VERSION=${GITHUB_REF_NAME%-openapps}
          SHORT_SHA="${{ env.SHA }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "jar_name=ayn-theme-${VERSION}-${SHORT_SHA}.jar" >> $GITHUB_OUTPUT

      - name: Rename JAR file
        working-directory: keycloak-theme-ayn
        run: |
          # 找到构建的 JAR 文件并重命名
          JAR_FILE=$(find dist_keycloak/ -name "ayn-theme.jar" | head -n 1)
          if [ -z "$JAR_FILE" ]; then
            echo "Error: JAR file not found"
            exit 1
          fi
          NEW_NAME="ayn-theme-${{ steps.version.outputs.version }}-${{ steps.version.outputs.short_sha }}.jar"
          cp "$JAR_FILE" "dist_keycloak/$NEW_NAME"
          echo "Renamed JAR: $NEW_NAME"
          ls -lh dist_keycloak/$NEW_NAME

      - name: Setup MinIO Client
        run: |
          wget https://dl.min.io/client/mc/release/linux-amd64/mc
          chmod +x mc
          sudo mv mc /usr/local/bin/

      - name: Configure MinIO Client for OSS
        run: |
          mc alias set ayn-oss \
            https://oss-cn-shenzhen.aliyuncs.com \
            ${{ secrets.OSS_AYN_ORBITHUB_ACCESS_KEY }} \
            ${{ secrets.OSS_AYN_ORBITHUB_SECRET_KEY }} \
            --api S3v4

      - name: Upload to OSS
        working-directory: keycloak-theme-ayn
        run: |
          JAR_NAME="ayn-theme-${{ steps.version.outputs.version }}-${{ steps.version.outputs.short_sha }}.jar"
          echo "Uploading $JAR_NAME to OSS..."
          mc cp "dist_keycloak/$JAR_NAME" "ayn-oss/ayn-orbithub-cn-shenzhen/keycloak/$JAR_NAME"

          # 同时上传一个 latest 版本
          mc cp "dist_keycloak/$JAR_NAME" "ayn-oss/ayn-orbithub-cn-shenzhen/keycloak/ayn-theme-latest.jar"

          echo "✅ Upload completed"
          echo "JAR URL: https://fs.iprtapp.com/keycloak/$JAR_NAME"
          echo "Latest URL: https://fs.iprtapp.com/keycloak/ayn-theme-latest.jar"

      - name: Create version file
        run: |
          cat > version.json <<EOF
          {
            "version": "${{ steps.version.outputs.version }}",
            "commit_sha": "${{ steps.version.outputs.short_sha }}",
            "jar_name": "ayn-theme-${{ steps.version.outputs.version }}-${{ steps.version.outputs.short_sha }}.jar",
            "jar_url": "https://fs.iprtapp.com/keycloak/ayn-theme-${{ steps.version.outputs.version }}-${{ steps.version.outputs.short_sha }}.jar",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "github_ref": "${{ github.ref }}",
            "github_run_id": "${{ github.run_id }}"
          }
          EOF
          cat version.json
          mc cp version.json ayn-oss/ayn-orbithub-cn-shenzhen/keycloak/ayn-theme-latest-version.json

  build-openapps:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - name: erpfastprint
            dockerfile: Dockerfile
            region: hk
            namespace: xoohub
          - name: maprintrace
            dockerfile: docker/Dockerfile
            region: hk
            namespace: xoohub
          - name: landing-page
            dockerfile: Dockerfile
            region: hk
            namespace: xoohub
    steps:
      - uses: actions/checkout@v6
      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: prtmax/openapps
          token: "${{ secrets.GH_TOKEN_0XFE10 }}"
          ref_file: .github/ref.txt

      - name: Check
        working-directory: ${{ matrix.package.name }}
        run: |
          ls -la

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ${{ env.DOCKER_REGISTRY }}

      - name: Docker login (Aliyun HK)
        if: matrix.package.region == 'hk'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.CR_ALI_USERNAME_PUNCHX }}
          password: ${{ secrets.CR_ALI_PASSWORD_PUNCHX }}
          registry: ${{ env.DOCKER_REGISTRY_ALI_HK }}

      - name: Docker login (Aliyun SZ)
        if: matrix.package.region == 'sz'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.CR_ALI_USERNAME_JOECHOW }}
          password: ${{ secrets.CR_ALI_PASSWORD_JOECHOW }}
          registry: ${{ env.DOCKER_REGISTRY_ALI_SZ }}

      - uses: benjlevesque/short-sha@v3.0

      - name: Set repo name
        run: echo "REPO_NAME=${GITHUB_REPOSITORY//\//_}" >> $GITHUB_ENV

      - name: Set image tags
        id: tags
        run: |
          echo "ghcr_sha=${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/openapps-${{ matrix.package.name }}:sha-${{ env.SHA }}" >> $GITHUB_OUTPUT
          echo "ghcr_latest=${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/openapps-${{ matrix.package.name }}:latest" >> $GITHUB_OUTPUT
          if [[ "${{ matrix.package.region }}" == "hk" ]]; then
            echo "ali_sha=${{ env.DOCKER_REGISTRY_ALI_HK }}/${{ matrix.package.namespace }}/${{ env.REPO_NAME }}_openapps-${{ matrix.package.name }}:sha-${{ env.SHA }}" >> $GITHUB_OUTPUT
            echo "ali_latest=${{ env.DOCKER_REGISTRY_ALI_HK }}/${{ matrix.package.namespace }}/${{ env.REPO_NAME }}_openapps-${{ matrix.package.name }}:latest" >> $GITHUB_OUTPUT
          else
            echo "ali_sha=${{ env.DOCKER_REGISTRY_ALI_SZ }}/${{ matrix.package.namespace }}/${{ env.REPO_NAME }}_openapps-${{ matrix.package.name }}:sha-${{ env.SHA }}" >> $GITHUB_OUTPUT
            echo "ali_latest=${{ env.DOCKER_REGISTRY_ALI_SZ }}/${{ matrix.package.namespace }}/${{ env.REPO_NAME }}_openapps-${{ matrix.package.name }}:latest" >> $GITHUB_OUTPUT
          fi

      - name: Publish docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          context: ${{ matrix.package.name }}
          file: ${{ matrix.package.name }}/${{ matrix.package.dockerfile }}
          tags: |
            ${{ steps.tags.outputs.ghcr_sha }}
            ${{ steps.tags.outputs.ghcr_latest }}

      - name: Push to Aliyun ACR (with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 5
          retry_wait_seconds: 30
          command: |
            docker tag ${{ steps.tags.outputs.ghcr_sha }} ${{ steps.tags.outputs.ali_sha }}
            docker tag ${{ steps.tags.outputs.ghcr_sha }} ${{ steps.tags.outputs.ali_latest }}
            docker push ${{ steps.tags.outputs.ali_sha }}
            docker push ${{ steps.tags.outputs.ali_latest }}

  deploy-apps:
    name: Deploy Apps
    runs-on: ubuntu-latest
    needs:
      - build-openapps
    steps:
      - uses: actions/checkout@v6
      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: prtmax/openapps
          token: "${{ secrets.GH_TOKEN_0XFE10 }}"
          ref_file: .github/ref.txt

      - uses: benjlevesque/short-sha@v3.0

      - name: Set repo name
        run: echo "REPO_NAME=${GITHUB_REPOSITORY//\//_}" >> $GITHUB_ENV

      - name: Deploy
        uses: repotea-workspace/kangumi/github-actions/gitops-deploy@main
        with:
          repository: repotea-workflow/gitops-ayn
          deploy_key: "${{ secrets.DEPLOY_KEY_GITOPS_AYN }}"
          argocd_server: ${{ secrets.ARGOCD_AYN_SERVER }}
          argocd_api_token: ${{ secrets.ARGOCD_AYN_API_TOKEN }}
          app_name: apps-production-openapps-hk0
          changes: |
            {
              "argocd/apps/openapps-hk0/overlays/production/erpfastprint/deployment-patch.yaml": {
                "[1].value": "${{ env.DOCKER_REGISTRY_ALI_HK_VPC }}/xoohub/${{ env.REPO_NAME }}_openapps-erpfastprint:sha-${{ env.SHA }}"
              },
              "argocd/apps/openapps-hk0/overlays/production/maprintrace/deployment-patch.yaml": {
                "[1].value": "${{ env.DOCKER_REGISTRY_ALI_HK_VPC }}/xoohub/${{ env.REPO_NAME }}_openapps-maprintrace:sha-${{ env.SHA }}"
              },
              "argocd/apps/openapps-hk0/overlays/production/landing-page/deployment-patch.yaml": {
                "[1].value": "${{ env.DOCKER_REGISTRY_ALI_HK_VPC }}/xoohub/${{ env.REPO_NAME }}_openapps-landing-page:sha-${{ env.SHA }}"
              }
            }
