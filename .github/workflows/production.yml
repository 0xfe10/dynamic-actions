name: "[knowledge] Production"

on:
  push:
    tags:
      - "v*-knowledge"

env:
  DOCKER_REGISTRY_ALI: crpi-uhy920dintikwpn3.cn-shenzhen.personal.cr.aliyuncs.com
  DOCKER_REGISTRY_ALI_VPC: crpi-uhy920dintikwpn3-vpc.cn-shenzhen.personal.cr.aliyuncs.com

jobs:
  mirror-dependencies:
    name: Mirror dependencies
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - source: redis:8.10.0
            target: prtmax_knowledge_redis:8.10.0
    steps:
      - name: Docker login (Aliyun)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.CR_ALI_USERNAME_JOECHOW }}
          password: ${{ secrets.CR_ALI_PASSWORD_JOECHOW }}
          registry: ${{ env.DOCKER_REGISTRY_ALI }}

      - name: Mirror image
        run: |
          docker pull --platform linux/amd64 "${{ matrix.source }}"
          docker tag "${{ matrix.source }}" "${{ env.DOCKER_REGISTRY_ALI }}/coohub/${{ matrix.target }}"
          docker push "${{ env.DOCKER_REGISTRY_ALI }}/coohub/${{ matrix.target }}"

  build-apps:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - package: api
            dockerfile: manifest/docker/Dockerfile
          - package: web
            dockerfile: manifest/docker/Dockerfile.web
    steps:
      - uses: actions/checkout@v6

      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: prtmax/knowledge
          token: "${{ secrets.GH_TOKEN_0XFE10 }}"
          ref_file: .github/ref.txt

      - name: Docker login (Aliyun)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.CR_ALI_USERNAME_JOECHOW }}
          password: ${{ secrets.CR_ALI_PASSWORD_JOECHOW }}
          registry: ${{ env.DOCKER_REGISTRY_ALI }}

      - uses: benjlevesque/short-sha@v3.0

      - name: Set repo name
        run: echo "REPO_NAME=prtmax_knowledge" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          provenance: false
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          tags: |
            ${{ env.DOCKER_REGISTRY_ALI }}/coohub/${{ env.REPO_NAME }}_knowledge-${{ matrix.package }}:sha-${{ env.SHA }}
            ${{ env.DOCKER_REGISTRY_ALI }}/coohub/${{ env.REPO_NAME }}_knowledge-${{ matrix.package }}:latest

  deploy-apps:
    name: Deploy Apps
    runs-on: ubuntu-latest
    needs:
      - mirror-dependencies
      - build-apps
    steps:
      - uses: actions/checkout@v6

      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: prtmax/knowledge
          token: "${{ secrets.GH_TOKEN_0XFE10 }}"
          ref_file: .github/ref.txt

      - uses: benjlevesque/short-sha@v3.0

      - name: Set repo name
        run: echo "REPO_NAME=prtmax_knowledge" >> "$GITHUB_ENV"

      - name: Deploy
        uses: repotea-workspace/kangumi/github-actions/gitops-deploy@main
        with:
          repository: repotea-workflow/gitops-ayn
          deploy_key: "${{ secrets.DEPLOY_KEY_GITOPS_AYN }}"
          argocd_server: ${{ secrets.ARGOCD_AYN_SERVER }}
          argocd_api_token: ${{ secrets.ARGOCD_AYN_API_TOKEN }}
          app_name: apps-production-knowledge-sz1
          changes: |
            {
              "argocd/apps/knowledge-sz1/overlays/production/values.yaml": {
                "images.api": "${{ env.DOCKER_REGISTRY_ALI_VPC }}/coohub/${{ env.REPO_NAME }}_knowledge-api:sha-${{ env.SHA }}",
                "images.web": "${{ env.DOCKER_REGISTRY_ALI_VPC }}/coohub/${{ env.REPO_NAME }}_knowledge-web:sha-${{ env.SHA }}"
              }
            }
