name: "[sw-aiot] Production"

on:
  push:
    tags:
      - "v*-sw-aiot"
env:
  DOCKER_REGISTRY: ghcr.io
  DOCKER_REGISTRY_ALI_HK: registry.cn-hongkong.aliyuncs.com
  DOCKER_REGISTRY_ALI_HK_VPC: registry-vpc.cn-hongkong.aliyuncs.com

permissions:
  actions: write
  contents: read
  packages: write

jobs:
  build-apps:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Checkout
        id: checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: prtmax/sw-aiot
          token: "${{ secrets.GH_TOKEN_0XFE10 }}"
          source_context: "true"
          image_name: sw-aiot
          acr_registry: ${{ env.DOCKER_REGISTRY_ALI_HK }}
          acr_namespace: xoohub

      - name: Check
        run: |
          ls -la

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: '0xfe10'
          password: ${{ secrets.GH_TOKEN_0XFE10 }}
          registry: ${{ env.DOCKER_REGISTRY }}

      - name: Publish docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          context: .
          file: Dockerfile
          provenance: false
          sbom: false
          tags: ${{ steps.checkout.outputs.ghcr_tags }}
          labels: ${{ steps.checkout.outputs.oci_labels }}
