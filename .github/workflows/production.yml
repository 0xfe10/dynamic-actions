name: "[aiyinid] Production"

on:
  push:
    tags:
      - "v*-aiyinid"

env:
  DOCKER_REGISTRY: ghcr.io
  DOCKER_REGISTRY_ALI: registry.cn-hongkong.aliyuncs.com
  DOCKER_REGISTRY_ALI_VPC: registry-vpc.cn-hongkong.aliyuncs.com

permissions:
  actions: write
  contents: read
  packages: write

jobs:
  build-core-image:
    name: Build core image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Checkout
        id: checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: prtmax/aiyinid
          token: "${{ secrets.GH_TOKEN_0XFE10 }}"
          source_context: "true"
          image_name: aiyinid-core
          acr_namespace: xoohub

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: '0xfe10'
          password: ${{ secrets.GH_TOKEN_0XFE10 }}
          registry: ${{ env.DOCKER_REGISTRY }}

      - name: Docker login (Aliyun)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.CR_ALI_USERNAME_PUNCHX }}
          password: ${{ secrets.CR_ALI_PASSWORD_PUNCHX }}
          registry: ${{ env.DOCKER_REGISTRY_ALI }}

      - name: Build and push docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          provenance: false
          sbom: false
          context: pkgs/core
          file: pkgs/core/manifest/docker/Dockerfile
          tags: ${{ steps.checkout.outputs.ghcr_tags }}
          labels: ${{ steps.checkout.outputs.oci_labels }}

      - name: Push to Aliyun ACR (with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 5
          retry_wait_seconds: 30
          command: |
            docker tag ${{ steps.checkout.outputs.ghcr_sha }} ${{ steps.checkout.outputs.ali_image }}:${{ env.SOURCE_TAG }}
            docker tag ${{ steps.checkout.outputs.ghcr_sha }} ${{ steps.checkout.outputs.ali_sha }}
            docker tag ${{ steps.checkout.outputs.ghcr_sha }} ${{ steps.checkout.outputs.ali_latest }}
            docker push ${{ steps.checkout.outputs.ali_image }}:${{ env.SOURCE_TAG }}
            docker push ${{ steps.checkout.outputs.ali_sha }}
            docker push ${{ steps.checkout.outputs.ali_latest }}

  build-web-image:
    name: Build web image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Checkout
        id: checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: prtmax/aiyinid
          token: "${{ secrets.GH_TOKEN_0XFE10 }}"
          source_context: "true"
          image_name: aiyinid-web
          acr_namespace: xoohub

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: '0xfe10'
          password: ${{ secrets.GH_TOKEN_0XFE10 }}
          registry: ${{ env.DOCKER_REGISTRY }}

      - name: Docker login (Aliyun)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.CR_ALI_USERNAME_PUNCHX }}
          password: ${{ secrets.CR_ALI_PASSWORD_PUNCHX }}
          registry: ${{ env.DOCKER_REGISTRY_ALI }}

      - name: Build and push docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          provenance: false
          sbom: false
          context: .
          file: pkgs/web/Dockerfile
          tags: ${{ steps.checkout.outputs.ghcr_tags }}
          labels: ${{ steps.checkout.outputs.oci_labels }}

      - name: Push to Aliyun ACR (with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 5
          retry_wait_seconds: 30
          command: |
            docker tag ${{ steps.checkout.outputs.ghcr_sha }} ${{ steps.checkout.outputs.ali_image }}:${{ env.SOURCE_TAG }}
            docker tag ${{ steps.checkout.outputs.ghcr_sha }} ${{ steps.checkout.outputs.ali_sha }}
            docker tag ${{ steps.checkout.outputs.ghcr_sha }} ${{ steps.checkout.outputs.ali_latest }}
            docker push ${{ steps.checkout.outputs.ali_image }}:${{ env.SOURCE_TAG }}
            docker push ${{ steps.checkout.outputs.ali_sha }}
            docker push ${{ steps.checkout.outputs.ali_latest }}
