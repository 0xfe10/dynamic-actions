name: '[any2pdf] Production'

on:
  push:
    tags:
      - "v*-any2pdf"

env:
  DOCKER_REGISTRY: ghcr.io
  CARGO_TERM_COLOR: always

jobs:
  build-cross-platform:
    name: Build Cross-Platform Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - x86_64-pc-windows-gnu
          - aarch64-unknown-linux-musl
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Checkout Source
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: prtmax/any2pdf
          token: '${{ secrets.GH_TOKEN_0XFE10 }}'
          ref_file: .github/ref.txt

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          override: true

      - name: Install Cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      # - name: Cache Dependencies
      #   uses: actions/cache@v4
      #   with:
      #     path: |
      #       ~/.cargo/bin/
      #       ~/.cargo/registry/index/
      #       ~/.cargo/registry/cache/
      #       ~/.cargo/git/db/
      #       target/
      #     key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Static Binary
        run: |
          cross build --release --target=${{ matrix.target }}

      - name: Prepare Binary
        run: |
          mkdir -p artifacts
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            cp target/${{ matrix.target }}/release/any2pdf.exe artifacts/any2pdf-${{ matrix.target }}.exe
          else
            cp target/${{ matrix.target }}/release/any2pdf artifacts/any2pdf-${{ matrix.target }}
          fi

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: any2pdf-${{ matrix.target }}
          path: artifacts/*

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build-cross-platform
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Checkout Source
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: prtmax/any2pdf
          token: '${{ secrets.GH_TOKEN_0XFE10 }}'
          ref_file: .github/ref.txt

      - name: Download Linux Binary
        uses: actions/download-artifact@v5
        with:
          name: any2pdf-x86_64-unknown-linux-musl
          path: ./artifacts/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: benjlevesque/short-sha@v3.0

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/any2pdf:latest
            ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/any2pdf:sha-${{ env.SHA }}

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-cross-platform, build-docker]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Download All Artifacts
        uses: actions/download-artifact@v5
        with:
          path: ./release-artifacts/

      - name: Extract Version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          VERSION=${VERSION%-any2pdf}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Prepare Release Assets
        run: |
          mkdir -p release-assets
          find release-artifacts -type f -name "any2pdf-*" -exec cp {} release-assets/ \;
          ls -la release-assets/

      - name: Generate Release Notes
        id: release_notes
        run: |
          cat > release_notes.md << EOF
          # Any2PDF v${{ steps.version.outputs.version }}

          ## 📦 Downloads
          Choose the binary for your platform:
          - **Linux (x64)**: any2pdf-x86_64-unknown-linux-musl
          - **Linux (ARM64)**: any2pdf-aarch64-unknown-linux-musl
          - **Windows (x64)**: any2pdf-x86_64-pc-windows-gnu.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          #name: Any2PDF v${{ steps.version.outputs.version }}
          body_path: release_notes.md
          files: release-assets/*
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
