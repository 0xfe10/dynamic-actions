name: '[guestkey] Production'

on:
  push:
    tags:
      - "v*-guestkey"
env:
  DOCKER_REGISTRY: ghcr.io

jobs:

  build-guestkey:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - api
          - vision
    steps:
      - uses: actions/checkout@v4
      - name: Checkout
        uses: fewensa/actions/clone-dyn@main
        with:
          repository: prtmax/guestkey
          token: '${{ secrets.GH_TOKEN_0XFE10 }}'
          ref_file: .github/ref.txt

      - name: Check
        run: |
          ls -la
          ls -la docker

      - name: Docker login
        uses: docker/login-action@v1
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ${{ env.DOCKER_REGISTRY }}

      - uses: benjlevesque/short-sha@v3.0

      - name: Publish docker image hash
        uses: docker/build-push-action@v6
        with:
          push: true
          context: .
          file: docker/${{ matrix.package }}.Dockerfile
          tags: ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/guestkey-${{ matrix.package }}:sha-${{ env.SHA }}

  deploy-guestkey:
    name: Deploy guestkey
    runs-on: ubuntu-latest
    needs:
      - build-guestkey
    steps:
      - uses: actions/checkout@v4
      - name: Checkout
        uses: fewensa/actions/clone-dyn@main
        with:
          repository: prtmax/guestkey
          token: '${{ secrets.GH_TOKEN_0XFE10 }}'
          ref_file: .github/ref.txt

      - uses: benjlevesque/short-sha@v3.0

      - name: Generate variables
        run: |
          TEMPLATE_FILE=playbooks.yml

          IMAGE_TAG_BASE=${{ env.DOCKER_REGISTRY }}/${{ github.repository }}

          IAMGE_GUESTKEY_API=${IMAGE_TAG_BASE}/guestkey-api:sha-${{ env.SHA }}
          IAMGE_GUESTKEY_VISION=${IMAGE_TAG_BASE}/guestkey-vision:sha-${{ env.SHA }}

          yq e ".docker_app_runner.container.guestkey-api.image = \"${IAMGE_GUESTKEY_API}\"" --inplace ${TEMPLATE_FILE}
          yq e ".docker_app_runner.container.guestkey-vision.image = \"${IAMGE_GUESTKEY_VISION}\"" --inplace ${TEMPLATE_FILE}

          mkdir dist

          DEPLOYMENT_FILE=playbooks/guestkey/host_vars/iprtapp-cn1-ek.yml

          jq -n \
            --arg file ${DEPLOYMENT_FILE} \
            --arg content "$(cat ${TEMPLATE_FILE})" \
            '{file: $file, content: $content}' >> dist/change.json

          jq -crs '.' < dist/change.json > dist/changes.json
          cat dist/changes.json

      - name: Deploy
        uses: fewensa/actions/ansible-deploy@main
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN_0XFE10 }}
        with:
          project_name: prtmax/guestkey
          changes: dist/changes.json
          ac_git_ref: __origin__/.github/ref.txt
          commit_message: __origin__/.github/message.txt

