      #       {
      #         "argocd/apps/byteone-sz1/overlays/production/values.yaml": {
      #           "app.core.image": "${{ env.DOCKER_REGISTRY_ALI_VPC }}/coohub/${{ env.REPO_NAME }}_byteone-core:sha-${{ env.SHA }}",
      #           "app.front.image": "${{ env.DOCKER_REGISTRY_ALI_VPC }}/coohub/${{ env.REPO_NAME }}_byteone-front:sha-${{ env.SHA }}"
