name: '[openapps] Production'

on:
  push:
    tags:
      - "v*-openapps"
env:
  DOCKER_REGISTRY: ghcr.io

jobs:

  build-openapps:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - name: erpfastprint
            dockerfile: Dockerfile
          - name: maprintrace
            dockerfile: docker/Dockerfile
    steps:
      - uses: actions/checkout@v5
      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: prtmax/openapps
          token: '${{ secrets.GH_TOKEN_0XFE10 }}'
          ref_file: .github/ref.txt

      - name: Check
        working-directory: ${{ matrix.package.name }}
        run: |
          ls -la

      - name: Docker login
        uses: docker/login-action@v1
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ${{ env.DOCKER_REGISTRY }}

      - uses: benjlevesque/short-sha@v3.0

      - name: Publish docker image hash
        uses: docker/build-push-action@v6
        with:
          push: true
          context: ${{ matrix.package.name }}
          file: ${{ matrix.package.name }}/${{ matrix.package.dockerfile }}
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/openapps-${{ matrix.package.name }}:sha-${{ env.SHA }}
            ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/openapps-${{ matrix.package.name }}:latest

  deploy-apps:
    name: Deploy Apps
    runs-on: ubuntu-latest
    needs:
      - build-openapps
    steps:
      - uses: actions/checkout@v5
      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: prtmax/openapps
          token: '${{ secrets.GH_TOKEN_0XFE10 }}'
          ref_file: .github/ref.txt

      - uses: benjlevesque/short-sha@v3.0
      - name: Deploy
        uses: repotea-workspace/kangumi/github-actions/gitops-deploy@main
        with:
          repository: repotea-workflow/gitops-ayn
          deploy_key: '${{ secrets.DEPLOY_KEY_GITOPS_AYN }}'
          argocd_server: ${{ secrets.ARGOCD_AYN_SERVER }}
          argocd_api_token: ${{ secrets.ARGOCD_AYN_API_TOKEN }}
          app_name: labelix-production-openapps
          project_name: prtmax/openapps
          ac_git_ref: __origin__/.github/ref.txt
          commit_message: __origin__/.github/message.txt
          changes: |
            {
              "argocd/labelix/openapps/overlays/production/erpfastprint/deployment-patch.yaml": {
                "[0].value": "${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/openapps-erpfastprint:sha-${{ env.SHA }}"
              },
              "argocd/labelix/openapps/overlays/production/maprintrace/deployment-patch.yaml": {
                "[0].value": "${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/openapps-maprintrace:sha-${{ env.SHA }}"
              }
            }

