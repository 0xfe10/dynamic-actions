name: "[guestkey] Production"

on:
  push:
    tags:
      - "v*-guestkey"
env:
  DOCKER_REGISTRY: ghcr.io

permissions:
  actions: write
  contents: read
  packages: write

jobs:
  build-apps:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - api
          - vision
    steps:
      - uses: actions/checkout@v6
      - name: Checkout
        id: checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: prtmax/guestkey
          token: "${{ secrets.GH_TOKEN_0XFE10 }}"
          source_context: "true"
          image_name: guestkey-${{ matrix.package }}

      - name: Check
        run: |
          ls -la
          ls -la docker

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: '0xfe10'
          password: ${{ secrets.GH_TOKEN_0XFE10 }}
          registry: ${{ env.DOCKER_REGISTRY }}

      - name: Publish docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          context: .
          file: docker/${{ matrix.package }}.Dockerfile
          provenance: false
          sbom: false
          tags: ${{ steps.checkout.outputs.ghcr_tags }}
          labels: ${{ steps.checkout.outputs.oci_labels }}
