name: '[landing] Production'

on:
  push:
    tags:
      - "v*-landing-page"
env:
  DOCKER_REGISTRY: ghcr.io

jobs:

  build-landing-page:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Checkout
        uses: fewensa/actions/clone-dyn@main
        with:
          repository: prtmax/landing-page
          token: '${{ secrets.GH_TOKEN_0XFE10 }}'
          ref_file: .github/ref.txt

      - name: Check
        run: |
          ls -la

      - name: Docker login
        uses: docker/login-action@v1
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ${{ env.DOCKER_REGISTRY }}

      - uses: benjlevesque/short-sha@v3.0

      - name: Publish docker image hash
        uses: docker/build-push-action@v6
        with:
          push: true
          context: .
          file: Dockerfile
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/landing-page:sha-${{ env.SHA }}
            ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/landing-page:latest

