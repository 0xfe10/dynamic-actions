name: '[guestkey] Production'

on:
  push:
    tags:
      - "v*-guestkey"
env:
  DOCKER_REGISTRY: ghcr.io

jobs:

  build-guestkey:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - api
          - vision
    steps:
      - uses: actions/checkout@v4
      - name: Checkout
        uses: fewensa/actions/clone-dyn@main
        with:
          repository: prtmax/guestkey
          token: '${{ secrets.GH_TOKEN_0XFE10 }}'
          ref_file: .github/ref.txt

      - name: Check
        run: ls -la

      - name: Docker login
        uses: docker/login-action@v1
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ${{ env.DOCKER_REGISTRY }}

      - uses: benjlevesque/short-sha@v3.0

      - name: Publish docker image hash
        uses: docker/build-push-action@v6
        with:
          push: true
          file: docker/${{ matrix.package }}.Dockerfile
          tags: ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/guestkey-${{ matrix.package }}:sha-${{ env.SHA }}

