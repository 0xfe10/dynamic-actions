name: '[byteone] Production'

on:
  push:
    tags:
      - "v*-byteone"
env:
  DOCKER_REGISTRY: ghcr.io

jobs:

  build-apps:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - core
          - msgbridge
    steps:
      - uses: actions/checkout@v5
      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: prtmax/byteone
          token: '${{ secrets.GH_TOKEN_0XFE10 }}'
          ref_file: .github/ref.txt

      - name: Check
        working-directory: pkgs/${{ matrix.package }}
        run: |
          ls -la

      - name: Docker login
        uses: docker/login-action@v1
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ${{ env.DOCKER_REGISTRY }}

      - uses: benjlevesque/short-sha@v3.0

      - name: Publish docker image hash
        uses: docker/build-push-action@v6
        with:
          push: true
          context: pkgs/${{ matrix.package }}
          file: pkgs/${{ matrix.package }}/Dockerfile
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/byteone-${{ matrix.package }}:sha-${{ env.SHA }}
            ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/byteone-${{ matrix.package }}:latest

