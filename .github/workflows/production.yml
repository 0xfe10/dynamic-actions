name: "[asr] Production"

on:
  push:
    tags:
      - "v*-asr"
env:
  DOCKER_REGISTRY_ALI: crpi-uhy920dintikwpn3.cn-shenzhen.personal.cr.aliyuncs.com
  FUNASR_IMAGES_ENABLE: "false"

jobs:
  build-asr-go:
    name: Build asr-go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: prtmax/asr
          token: "${{ secrets.GH_TOKEN_0XFE10 }}"
          ref_file: .github/ref.txt

      - name: Check
        run: |
          ls -la

      - name: Docker login (Aliyun)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.CR_ALI_USERNAME_JOECHOW }}
          password: ${{ secrets.CR_ALI_PASSWORD_JOECHOW }}
          registry: ${{ env.DOCKER_REGISTRY_ALI }}

      - uses: benjlevesque/short-sha@v3.0

      - name: Set repo name
        run: echo "REPO_NAME=${GITHUB_REPOSITORY//\//_}" >> $GITHUB_ENV

      - name: Set image tags
        id: tags
        run: |
          echo "ali_sha=${{ env.DOCKER_REGISTRY_ALI }}/coohub/${{ env.REPO_NAME }}_asr-go:sha-${{ env.SHA }}" >> $GITHUB_OUTPUT
          echo "ali_latest=${{ env.DOCKER_REGISTRY_ALI }}/coohub/${{ env.REPO_NAME }}_asr-go:latest" >> $GITHUB_OUTPUT

      - name: Publish docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          context: .
          file: services/asr-go/Dockerfile
          tags: |
            ${{ steps.tags.outputs.ali_sha }}
            ${{ steps.tags.outputs.ali_latest }}

  build-funasr:
    name: Build ASR upstream services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - name: funasr-mlt-gguf
            dockerfile: services/funasr-mlt-gguf/Dockerfile
            image_key: funasr-mlt-gguf
          - name: funasr-sensevoice
            dockerfile: services/funasr-sensevoice/Dockerfile
            image_key: funasr-sensevoice
    steps:
      - name: Skip FunASR image build
        if: env.FUNASR_IMAGES_ENABLE != 'true'
        run: echo "FUNASR_IMAGES_ENABLE is false; skip ${{ matrix.package.name }}"

      - uses: actions/checkout@v6
        if: env.FUNASR_IMAGES_ENABLE == 'true'
      - name: Checkout
        if: env.FUNASR_IMAGES_ENABLE == 'true'
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: prtmax/asr
          token: "${{ secrets.GH_TOKEN_0XFE10 }}"
          ref_file: .github/ref.txt

      - name: Check
        if: env.FUNASR_IMAGES_ENABLE == 'true'
        run: |
          ls -la

      - name: Docker login (Aliyun)
        if: env.FUNASR_IMAGES_ENABLE == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.CR_ALI_USERNAME_JOECHOW }}
          password: ${{ secrets.CR_ALI_PASSWORD_JOECHOW }}
          registry: ${{ env.DOCKER_REGISTRY_ALI }}

      - uses: benjlevesque/short-sha@v3.0
        if: env.FUNASR_IMAGES_ENABLE == 'true'

      - name: Set repo name
        if: env.FUNASR_IMAGES_ENABLE == 'true'
        run: echo "REPO_NAME=${GITHUB_REPOSITORY//\//_}" >> $GITHUB_ENV

      - name: Set image tags
        if: env.FUNASR_IMAGES_ENABLE == 'true'
        id: tags
        run: |
          echo "ali_sha=${{ env.DOCKER_REGISTRY_ALI }}/coohub/${{ env.REPO_NAME }}_${{ matrix.package.image_key }}:sha-${{ env.SHA }}" >> $GITHUB_OUTPUT
          echo "ali_latest=${{ env.DOCKER_REGISTRY_ALI }}/coohub/${{ env.REPO_NAME }}_${{ matrix.package.image_key }}:latest" >> $GITHUB_OUTPUT

      - name: Publish docker image
        if: env.FUNASR_IMAGES_ENABLE == 'true'
        uses: docker/build-push-action@v6
        with:
          push: true
          context: .
          file: ${{ matrix.package.dockerfile }}
          tags: |
            ${{ steps.tags.outputs.ali_sha }}
            ${{ steps.tags.outputs.ali_latest }}

  deploy-apps:
    name: Deploy Apps
    runs-on: ubuntu-latest
    needs:
      - build-asr-go
      - build-funasr
    if: always() && needs.build-asr-go.result == 'success' && (needs.build-funasr.result == 'success' || needs.build-funasr.result == 'skipped')
    steps:
      - uses: actions/checkout@v6
      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: prtmax/asr
          token: "${{ secrets.GH_TOKEN_0XFE10 }}"
          ref_file: .github/ref.txt

      - uses: benjlevesque/short-sha@v3.0

      - name: Set repo name
        run: echo "REPO_NAME=${GITHUB_REPOSITORY//\//_}" >> $GITHUB_ENV

      - name: Set deploy changes
        id: deploy_changes
        run: |
          if [ "${{ env.FUNASR_IMAGES_ENABLE }}" = "true" ]; then
            cat >> "$GITHUB_OUTPUT" <<EOF
          changes<<JSON
          {
            "argocd/cortex/asr-hn0/overlays/production/asr/values.yaml": {
              "app.asrGo.image": "${{ env.DOCKER_REGISTRY_ALI }}/coohub/${{ env.REPO_NAME }}_asr-go:sha-${{ env.SHA }}",
              "app.funasrMltGguf.image": "${{ env.DOCKER_REGISTRY_ALI }}/coohub/${{ env.REPO_NAME }}_funasr-mlt-gguf:sha-${{ env.SHA }}",
              "app.funasrSensevoice.image": "${{ env.DOCKER_REGISTRY_ALI }}/coohub/${{ env.REPO_NAME }}_funasr-sensevoice:sha-${{ env.SHA }}"
            }
          }
          JSON
          EOF
          else
            cat >> "$GITHUB_OUTPUT" <<EOF
          changes<<JSON
          {
            "argocd/cortex/asr-hn0/overlays/production/asr/values.yaml": {
              "app.asrGo.image": "${{ env.DOCKER_REGISTRY_ALI }}/coohub/${{ env.REPO_NAME }}_asr-go:sha-${{ env.SHA }}"
            }
          }
          JSON
          EOF
          fi

      - name: Deploy
        uses: repotea-workspace/kangumi/github-actions/gitops-deploy@main
        with:
          repository: repotea-workflow/gitops-ayn
          deploy_key: "${{ secrets.DEPLOY_KEY_GITOPS_AYN }}"
          argocd_server: ${{ secrets.ARGOCD_AYN_SERVER }}
          argocd_api_token: ${{ secrets.ARGOCD_AYN_API_TOKEN }}
          app_name: cortex-production-asr-hn0
          changes: ${{ steps.deploy_changes.outputs.changes }}
