  deploy-app-node:
    name: Build app node
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - woodii
    steps:
      - uses: actions/checkout@v4
      - name: Checkout
        uses: fewensa/actions/clone-dyn@main
        with:
          repository: prtmax/endfather
          token: '${{ secrets.GH_TOKEN_0XFE10 }}'
          ref_file: .github/ref.txt

      - uses: fewensa/actions/smart-vercel@main
        name: Deploy to Vercel
        with:
          node_version: 20
          vercel_token: ${{ secrets.VERCEL_TOKEN }}
          vercel_group: provence
          preview_output: true
          workdir: ${{ matrix.package }}
          project_name: endfather-woodii
          script_build: yarn build:prd
          dist_path: dist-prd
          enable_cache: true
          prod_mode: true

      - uses: fewensa/actions/tepusher@main
        if: failure()
        with:
          template: .maintain/notify/deploy-app.md
          token: ${{ secrets.WEPLUSBOT_TOKEN }}
          receiver: "#6cfbef7cc90c4d1ab0842b13e483fafb"
          aters: C1776236406
          patto: C1776236406
