name: '[oms-zkr] Production'

on:
  push:
    tags:
      - 'v*-oms-zkr'

env:
  DOCKER_REGISTRY: ghcr.io
  DOCKER_REGISTRY_UHUB: uhub.service.ucloud.cn

jobs:
  build-java-pompeii:
    name: Build java (pompeii)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Maven Action
        uses: s4u/setup-maven-action@v1.19.0
        with:
          java-version: 17
          maven-version: 3.9.11
          checkout-enabled: false

      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: repotea-workspace/oms-zkr
          token: '${{ secrets.GH_TOKEN_0XFE10 }}'
          ref_file: .github/ref.txt

      - name: Build
        working-directory: pompeii
        run: mvn clean package -Dmaven.test.skip=true

      - name: Docker login (GHCR)
        uses: docker/login-action@v3
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ${{ env.DOCKER_REGISTRY }}

      - name: Docker login (UHub)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.CR_UHUB_USERNAME_ZTOKR }}
          password: ${{ secrets.CR_UHUB_PASSWORD_ZTOKR }}
          registry: ${{ env.DOCKER_REGISTRY_UHUB }}

      - uses: benjlevesque/short-sha@v3.0

      - name: Set repo name
        run: echo "REPO_NAME=${GITHUB_REPOSITORY//\//_}" >> $GITHUB_ENV

      - name: Set image tags
        id: tags
        run: |
          echo "ghcr_sha=${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/omsk-pompeii:sha-${{ env.SHA }}" >> $GITHUB_OUTPUT
          echo "ghcr_latest=${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/omsk-pompeii:latest" >> $GITHUB_OUTPUT
          echo "uhub_sha=${{ env.DOCKER_REGISTRY_UHUB }}/toohub/omsk-pompeii:sha-${{ env.SHA }}" >> $GITHUB_OUTPUT
          echo "uhub_latest=${{ env.DOCKER_REGISTRY_UHUB }}/toohub/omsk-pompeii:latest" >> $GITHUB_OUTPUT

      - name: Build and push docker image
        uses: docker/build-push-action@v6
        with:
          push: false
          context: pompeii
          file: pompeii/docker/Dockerfile
          tags: |
            ${{ steps.tags.outputs.ghcr_sha }}
            ${{ steps.tags.outputs.ghcr_latest }}

      - name: Push to UHub (with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 5
          retry_wait_seconds: 30
          command: |
            docker tag ${{ steps.tags.outputs.ghcr_sha }} ${{ steps.tags.outputs.uhub_sha }}
            docker tag ${{ steps.tags.outputs.ghcr_sha }} ${{ steps.tags.outputs.uhub_latest }}
            docker push ${{ steps.tags.outputs.uhub_sha }}
            docker push ${{ steps.tags.outputs.uhub_latest }}

  build-node:
    name: Build node
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - NAME: cusco
            INSTALL: npm i
            BUILD: npm run build:prod
            DOCKER_IMAGE: node:10.16-alpine
          - NAME: roman
            INSTALL: npm i
            BUILD: npm run build:prod
            DOCKER_IMAGE: node:10.16-alpine
          - NAME: babylon
            INSTALL: yarn install --ignore-engines
            BUILD: yarn build:h5
            DOCKER_IMAGE: node:20-alpine
    steps:
      - uses: actions/checkout@v6
      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: repotea-workspace/oms-zkr
          token: '${{ secrets.GH_TOKEN_0XFE10 }}'
          ref_file: .github/ref.txt

      - name: Build project
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/${{ matrix.package.NAME }}:/app \
            -w /app \
            -e CI=true \
            -e NODE_OPTIONS=--max_old_space_size=4096 \
            ${{ matrix.package.DOCKER_IMAGE }} \
            sh -c '${{ matrix.package.INSTALL }} && ${{ matrix.package.BUILD }}'

      - name: Docker login (GHCR)
        uses: docker/login-action@v3
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ${{ env.DOCKER_REGISTRY }}

      - name: Docker login (UHub)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.CR_UHUB_USERNAME_ZTOKR }}
          password: ${{ secrets.CR_UHUB_PASSWORD_ZTOKR }}
          registry: ${{ env.DOCKER_REGISTRY_UHUB }}

      - uses: benjlevesque/short-sha@v3.0

      - name: Set repo name
        run: echo "REPO_NAME=${GITHUB_REPOSITORY//\//_}" >> $GITHUB_ENV

      - name: Set image tags
        id: tags
        run: |
          echo "ghcr_sha=${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/omsk-${{ matrix.package.NAME }}:sha-${{ env.SHA }}" >> $GITHUB_OUTPUT
          echo "ghcr_latest=${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/omsk-${{ matrix.package.NAME }}:latest" >> $GITHUB_OUTPUT
          echo "uhub_sha=${{ env.DOCKER_REGISTRY_UHUB }}/toohub/omsk-${{ matrix.package.NAME }}:sha-${{ env.SHA }}" >> $GITHUB_OUTPUT
          echo "uhub_latest=${{ env.DOCKER_REGISTRY_UHUB }}/toohub/omsk-${{ matrix.package.NAME }}:latest" >> $GITHUB_OUTPUT

      - name: Build and push docker image
        uses: docker/build-push-action@v6
        with:
          push: false
          context: ${{ matrix.package.NAME }}
          file: ${{ matrix.package.NAME }}/docker/Dockerfile
          tags: |
            ${{ steps.tags.outputs.ghcr_sha }}
            ${{ steps.tags.outputs.ghcr_latest }}

      - name: Push to UHub (with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 5
          retry_wait_seconds: 30
          command: |
            docker tag ${{ steps.tags.outputs.ghcr_sha }} ${{ steps.tags.outputs.uhub_sha }}
            docker tag ${{ steps.tags.outputs.ghcr_sha }} ${{ steps.tags.outputs.uhub_latest }}
            docker push ${{ steps.tags.outputs.uhub_sha }}
            docker push ${{ steps.tags.outputs.uhub_latest }}

  deploy-app:
    name: Deploy App
    runs-on: ubuntu-latest
    needs:
      - build-java-pompeii
      - build-node
    steps:
      - uses: actions/checkout@v6
      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: repotea-workspace/oms-zkr
          token: '${{ secrets.GH_TOKEN_0XFE10 }}'
          ref_file: .github/ref.txt

      - name: Set repo name
        run: echo "REPO_NAME=${GITHUB_REPOSITORY//\//_}" >> $GITHUB_ENV

      - uses: benjlevesque/short-sha@v3.0

      - name: Deploy
        uses: repotea-workspace/kangumi/github-actions/gitops-deploy@main
        with:
          repository: repotea-workflow/gitops-fes
          deploy_key: '${{ secrets.DEPLOY_KEY_GITOPS_FES }}'
          argocd_server: ${{ secrets.ARGOCD_FES_SERVER }}
          argocd_api_token: ${{ secrets.ARGOCD_FES_API_TOKEN }}
          app_name: work-production-ztoms-ula
          changes: |
            {
              "argocd/work/ztoms-ula/overlays/production/ztoms/values.yaml": {
                "app.omsk_pompeii.image": "${{ env.DOCKER_REGISTRY_UHUB }}/toohub/omsk-pompeii:sha-${{ env.SHA }}",
                "app.omsk_cusco.image": "${{ env.DOCKER_REGISTRY_UHUB }}/toohub/omsk-cusco:sha-${{ env.SHA }}",
                "app.omsk_roman.image": "${{ env.DOCKER_REGISTRY_UHUB }}/toohub/omsk-roman:sha-${{ env.SHA }}",
                "app.omsk_babylon.image": "${{ env.DOCKER_REGISTRY_UHUB }}/toohub/omsk-babylon:sha-${{ env.SHA }}"
              }
            }
