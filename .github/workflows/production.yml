name: '[labelab] Production'

on:
  push:
    tags:
      - 'v*'

jobs:

  build-android:
    name: Build Android ${{ matrix.artifact.name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        artifact:
          - name: APK
            command: flutter build apk --release
            path: mobile/build/app/outputs/flutter-apk/app-release.apk
            upload_name: app-release-apk
          - name: AAB
            command: flutter build appbundle --release
            path: mobile/build/app/outputs/bundle/release/app-release.aab
            upload_name: app-release-aab
    steps:

      - uses: actions/checkout@v6

      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: boxliy/labelab
          token: '${{ secrets.GH_TOKEN_0XFE10 }}'
          ref_file: .github/ref.txt

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > $GITHUB_WORKSPACE/labelab-release.jks

      - name: Write key.properties
        run: |
          cat > mobile/android/key.properties << EOF
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=$GITHUB_WORKSPACE/labelab-release.jks
          EOF

      - name: Build ${{ matrix.artifact.name }}
        working-directory: mobile
        run: ${{ matrix.artifact.command }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact.upload_name }}
          path: ${{ matrix.artifact.path }}

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build-android
    steps:

      - uses: actions/checkout@v6

      - name: Checkout
        uses: repotea-workspace/kangumi/github-actions/clone-dyn@main
        with:
          repository: boxliy/labelab
          token: '${{ secrets.GH_TOKEN_0XFE10 }}'
          ref_file: .github/ref.txt

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Get version
        id: version
        run: |
          VERSION=$(grep '^version:' mobile/pubspec.yaml | sed 's/version: //')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          files: dist/*
